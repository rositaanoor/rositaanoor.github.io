<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Pindai Teks</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<style>
:root{--bg:#F2F2F7;--surface:#FFFFFF;--ink:#000;--muted:#8A8A8E;--line:rgba(60,60,67,.16);--soft:#E9E9EE;--field:#F2F2F7;
 --acc:#3B82F6;--on:#FFFFFF;--coral:#EF5B5B;--green:#22B573;--amber:#F5A524;
 --display:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',system-ui,sans-serif;
 --body:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--surface:#1C1C1E;--ink:#FFF;--muted:#8E8E93;--line:rgba(84,84,88,.5);--soft:#2C2C2E;--field:#2C2C2E;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--surface:#1C1C1E;--ink:#FFF;--muted:#8E8E93;--line:rgba(84,84,88,.5);--soft:#2C2C2E;--field:#2C2C2E;color-scheme:dark}
*{box-sizing:border-box} html,body{margin:0}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--body);-webkit-font-smoothing:antialiased}
button,a,label{font-family:inherit;touch-action:manipulation}
.wrap{max-width:720px;margin:0 auto;padding:0 16px calc(104px + env(safe-area-inset-bottom))}
.top{padding:calc(26px + env(safe-area-inset-top)) 0 2px}
.brand{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font:800 26px/1.15 var(--display);letter-spacing:.2px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12px;color:var(--muted);margin:2px 0 0}
.status{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;color:var(--muted);cursor:pointer}
.status i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.status[data-s="cloud"] i{background:var(--green)}
.status[data-s="saving"] i,.status[data-s="syncing"] i,.status[data-s="pending"] i{background:var(--amber)}
.status[data-s="error"] i{background:var(--coral)} .status[data-s="local"] i{background:var(--acc)}
.gear{width:40px;height:40px;border-radius:50%;border:0;background:var(--surface);color:var(--acc);display:grid;place-items:center;padding:0;cursor:pointer;flex:none}
.gear.on{background:var(--acc);color:var(--on)}
.vh h2{font:700 32px/1.1 var(--display);letter-spacing:.2px;margin:6px 0 2px}
.card{position:relative;background:var(--surface);border-radius:14px;padding:16px;min-width:0}
.card h3{font:600 17px/1.2 var(--display);margin:0 0 4px}
.hint{color:var(--muted);font-size:13px;margin:0 0 10px}
.lab{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:12px 0 4px}
.f{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--field);border:0;border-radius:10px;padding:10px 12px;min-width:0}
.f:focus{outline:none;box-shadow:0 0 0 2px var(--acc)}
.btn{border:0;background:var(--soft);border-radius:10px;padding:9px 14px;font-weight:600;font-size:15px;color:var(--acc);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;line-height:1.2}
.btn svg{width:18px;height:18px;flex:none}
.btn.pri{background:var(--acc);color:var(--on)}
.btn[disabled]{opacity:.5;cursor:default}
.btn.arm{background:var(--coral);color:#fff}
.btn.dng{color:var(--coral)}
.row{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.mchip{border:0;background:var(--soft);color:var(--ink);border-radius:99px;padding:7px 12px;font-weight:600;font-size:14px;cursor:pointer}
.mchip.on{background:var(--acc);color:var(--on)}
.setgrid{display:grid;gap:16px;margin-top:12px}
.stack{display:grid;gap:14px;margin-top:12px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--surface) 80%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line)}
body.kb nav.tabs{display:none}
.tab{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:4px 0;font-size:10.5px;font-weight:500;color:var(--muted);text-decoration:none;cursor:pointer}
.tab svg{width:26px;height:26px} .tab.on{color:var(--c,var(--acc))}
.mdl{position:fixed;inset:0;z-index:60;display:grid;place-items:end center;background:rgba(0,0,0,.4)}
.mdlc{background:var(--surface);border-radius:20px 20px 0 0;width:min(560px,100%);max-height:90vh;overflow:auto;padding:8px 18px calc(18px + env(safe-area-inset-bottom))}
.mdlc::before{content:"";display:block;width:36px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.mdla{display:flex;gap:8px;margin-top:16px;align-items:center}
.sp{flex:1}
/* colour selector */
.swrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.swb{width:30px;height:30px;border-radius:50%;border:2px solid var(--surface);background:var(--c);cursor:pointer;box-shadow:0 0 0 1px var(--line);padding:0}
.swb.on{box-shadow:0 0 0 2px var(--ink)}
.swb.more{background:conic-gradient(#EF4444,#F5A524,#84CC16,#14B8C4,#3B82F6,#A855F7,#EC4899,#EF4444)}
.swb.cus{background:var(--c)}
.pkg{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.pks{height:38px;border-radius:10px;border:2px solid var(--surface);background:var(--c);cursor:pointer;padding:0;box-shadow:0 0 0 1px var(--line)}
.pks.on{box-shadow:0 0 0 3px var(--ink)}
/* app */
.empty{display:grid;justify-items:center;gap:16px;padding:30px 16px 20px}
.empty .big{width:84px;height:84px;border-radius:24px;background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc);display:grid;place-items:center}
.empty .big svg{width:44px;height:44px}
.empty .mut{background:var(--soft);color:var(--muted)}
.pv{width:100%;max-height:300px;object-fit:contain;border-radius:10px;background:var(--field);display:block}
.bar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
textarea.f{resize:vertical;min-height:190px;line-height:1.45;display:block}
.err{color:var(--coral);font-size:14px;margin:10px 0 0}
.pl{padding:0;overflow:hidden}
.it{display:flex;align-items:center;gap:10px;padding:12px 16px;border:0;border-top:.5px solid var(--line);background:none;width:100%;text-align:left;color:var(--ink);cursor:pointer;font:inherit}
.it:first-child{border-top:0}
.it .tx{flex:1;min-width:0}
.it .t1{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .t2{font-size:12.5px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it svg{width:18px;height:18px;color:var(--muted);flex:none}
.srow{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:0;font:inherit;font-size:16px;font-weight:500;color:var(--ink);cursor:pointer;text-align:left;text-decoration:none}
.srow .sp{flex:1}
.srow svg{width:20px;height:20px;color:var(--acc)} .srow svg.r{color:var(--muted);width:18px;height:18px}
details.card{padding:0}
details.card summary{list-style:none;display:flex;align-items:center;gap:8px;padding:15px 16px;font-weight:600;font-size:16px;cursor:pointer}
details.card summary::-webkit-details-marker{display:none}
details.card summary svg{width:18px;height:18px;color:var(--muted);margin-left:auto;transition:transform .2s}
details.card[open] summary svg{transform:rotate(90deg)}
.gb{padding:0 16px 22px;font-size:15px}
.gb p{margin:0 0 10px} .gb ol{margin:0 0 12px;padding-left:20px} .gb li{margin-bottom:6px}
.shot{width:100%;max-width:300px;display:block;margin:6px auto 0;border-radius:14px;border:.5px solid var(--line)}
#q{background:var(--surface);-webkit-appearance:none;appearance:none}
</style>
</head>

</div>

<div id="mdl"></div>
<input type="file" id="fcam" accept="image/*" capture="environment" style="display:none">

/* ---------- warna ---------- */
var ACCS=['#3B82F6','#EC4899','#22B573','#F5A524','#8B5CF6','#EF5B5B','#14B8C4'];
function h2x(h,sat,l){h=h/360;sat/=100;l/=100;var a=sat*Math.min(l,1-l);function f(n){var k=(n+h*12)%12,c=l-a*Math.max(-1,Math.min(k-3,9-k,1));return ('0'+Math.round(255*c).toString(16)).slice(-2);}return ('#'+f(0)+f(8)+f(4)).toUpperCase();}

/* ---------- data ---------- */
var S=lsGet(KEY,{}),IM=lsGet(K_IM,{}),MT=lsGet(K_MT,{}),UI=lsGet(K_UI,{view:'scan'}),SY=lsGet(K_SY,{});
if(UI.view==='guide'||UI.view==='set')UI.view=UI.prev||'scan';
var snap={};
function rebuildSnap(){snap={};for(var d in S){snap[d]={};for(var id in S[d])snap[d][id]=JSON.stringify(S[d][id]);}}
function touchIM(){var now=Date.now(),ch=false,d,id;

function get(d,id){return S[d]&&S[d][id];}
function put(d,id,v){(S[d]=S[d]||{})[id]=v;save();}
function del(d,id){if(S[d]){delete S[d][id];save();}}
function cfg(k,def){var v=get('cfg',k);return v===undefined?def:v;}
function saveUI(){lsSet(K_UI,UI);}
rebuildSnap();
(function prune(){var now=Date.now(),lim=90*864e5;for(var d in IM)for(var id in IM[d])if(IM[d][id]<0&&now+IM[d][id]>lim){delete IM[d][id];}})();

/* ---------- util ---------- */
var edTimer=0,pend=null;

function flush(){clearTimeout(edTimer);if(pend){var f=pend;pend=null;f();}}
function fmtDate(t){try{return new Date(t).toLocaleString('id-ID',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});}catch(e){return '';}}
function hm(t){var d=new Date(t);return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function titleOf(t){var l=(t||'').split('\n').map(function(x){return x.trim();}).filter(Boolean)[0];return l?l.slice(0,70):'Tanpa teks';}
function stats(t){var w=(t.trim().match(/\S+/g)||[]).length;return w+' kata · '+t.length+' karakter';}
var LANGS={'ind+eng':'Indonesia + English','ind':'Indonesia','eng':'English'};

/* ---------- OCR ---------- */
var SC={cv:null,pv:'',lang:cfg('lang','ind+eng'),busy:false,text:'',id:null,doc:null,err:'',pct:0,lab:''};

 else if(st==='initializing tesseract'){pc=12;lb='Menyiapkan mesin';}

 else if(st==='initializing api'){pc=32;lb='Menyiapkan bahasa';}
 else if(st==='recognizing text'){pc=35+65*p;lb='Membaca teks '+Math.round(p*100)+'%';}

function cleanText(t){return (t||'').replace(/\r/g,'').split('\n').map(function(l){return l.replace(/\s+$/,'');}).join('\n').replace(/\n{3,}/g,'\n\n').trim();}
async function runOCR(){
 if(!SC.cv||SC.busy)return;SC.busy=true;SC.err='';SC.pct=2;SC.lab='Memulai';render();
 try{
  var cv=cfg('enh',true)?enhance(SC.cv):SC.cv;

function rotate(){if(!SC.cv)return;var s=SC.cv,c=document.createElement('canvas');c.width=s.height;c.height=s.width;var x=c.getContext('2d');x.translate(c.width,0);x.rotate(Math.PI/2);x.drawImage(s,0,0);SC.cv=c;SC.pv=c.toDataURL('image/jpeg',.82);SC.text='';SC.id=null;SC.err='';render();}
function resetScan(){flush();SC.cv=null;SC.pv='';SC.text='';SC.id=null;SC.doc=null;SC.err='';SC.busy=false;render();}

/* ---------- salin ---------- */
function fbCopy(t){return new Promise(function(res,rej){var ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;top:0;left:0;opacity:0;font-size:16px';document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,ta.value.length);var ok=false;try{ok=document.execCommand('copy');}catch(e){}document.body.removeChild(ta);ok?res():rej();});}
function copyText(t){if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(t).catch(function(){return fbCopy(t);});return fbCopy(t);}
function doCopy(btn,t){if(!t)return;var h=btn.innerHTML;copyText(t).then(function(){btn.innerHTML=ic('check')+'Tersalin';setTimeout(function(){btn.innerHTML=h;},1500);},function(){btn.textContent='Gagal menyalin';setTimeout(function(){btn.innerHTML=h;},1500);});}
function doShare(t){if(navigator.share)navigator.share({text:t}).catch(function(){});}

 var o=cfg('owner',''),s=$('sub');s.hidden=!o;s.textContent=o;}

  h+='<h3 style="margin:0 0 2px;font:600 17px var(--display)">'+esc(titleOf(e.text))+'</h3><p class="hint">'+fmtDate(e.t)+' · '+esc(LANGS[e.lang]||'')+'</p><textarea class="f" id="etx" spellcheck="false">'+esc(e.text)+'</textarea>';
  h+='<div class="mdla"><button class="btn pri" id="ecopy" data-a="ecopy">'+ic('copy')+'Salin</button>'+(navigator.share?'<button class="btn" data-a="eshare" aria-label="Bagikan">'+ic('share')+'</button>':'')+'<span class="sp"></span><button class="btn dng" data-a="edel" aria-label="Hapus">'+ic('trash-2')+'</button><button class="btn" data-a="mclose">Tutup</button></div>';
 }else if(MD.type==='pal'){var cur=cfg('accent','');
  h+='<h3 style="margin:0 0 12px;font:600 17px var(--display)">Warna aksen</h3><div class="pkg">'+PALETTE.map(function(c){return '<button class="pks'+(c===cur?' on':'')+'" style="--c:'+c+'" data-a="pick" data-v="'+c+'" aria-label="'+c+'"></button>';}).join('')+'</div>';
  h+='<div class="mdla"><button class="btn" data-a="accauto">Kembalikan ke bawaan</button><span class="sp"></span><button class="btn" data-a="mclose">Tutup</button></div>';}
 m.innerHTML=h+'</div></div>';}
function closeMd(){flush();MD=null;renderMd();if(UI.view==='hist'){var l=$('hl');if(l)l.innerHTML=histRows();}}

/* ---------- arm ---------- */
function arm(el,fn){if(el._arm){clearTimeout(el._arm);el._arm=0;el.classList.remove('arm');el.innerHTML=el._h;fn();return;}
 el._h=el.innerHTML;el.classList.add('arm');el.textContent='Ketuk lagi';el._arm=setTimeout(function(){el._arm=0;el.classList.remove('arm');el.innerHTML=el._h;},4000);}

/* ---------- aksi ---------- */
function setCfg(k,v){put('cfg',k,v);}
function doExport(){var data={app:APP,v:2,docs:S,mt:MT,im:IM},b=new Blob([JSON.stringify(data)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='pindai-teks-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);document.body.removeChild(a);},500);bkMsg('Export selesai.');}
function bkMsg(t){UI.bk=t;var e=$('bkmsg');if(e)e.textContent=t;}
function doImport(f){if(!f)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(!d||!d.docs)throw 0;var ch=mergeIn(d);finishMerge();bkMsg(ch?'Import selesai.':'Tidak ada data baru.');}catch(e){bkMsg('File tidak valid.');}};r.readAsText(f);}
function restorePre(){var p=lsGet(K_PRE,null);if(!p)return;var n=0;for(var d in p.S)for(var id in p.S[d])if(!(S[d]&&(id in S[d]))){(S[d]=S[d]||{})[id]=p.S[d][id];n++;}
 save();try{localStorage.removeItem(K_PRE);}catch(e){}bkMsg(n?n+' data dipulihkan.':'Tidak ada yang hilang.');render();}
function wipe(onlyHist){for(var d in S){if(!onlyHist||d.charAt(0)==='h')delete S[d];}save();if(!onlyHist){SC.lang='ind+eng';}resetScan();}

document.addEventListener('click',function(ev){
 var t=ev.target.closest&&ev.target.closest('[data-a],[data-tab],#gear,#stat');if(!t)return;
 if(t.id==='gear'){go(UI.view==='set'||UI.view==='guide'?(UI.prev||'scan'):'set');return;}
 if(t.id==='stat'){if(creds())sync(true);else go('set');return;}
 if(t.dataset.tab){go(t.dataset.tab);return;}
 var a=t.dataset.a,v=t.dataset.v;
 if(a==='mbg'){if(ev.target===t)closeMd();return;}
 switch(a){
  case 'run':runOCR();break;
  case 'rot':rotate();break;
  case 'reset':resetScan();break;
  case 'lang':SC.lang=v;render();break;
  case 'copy':doCopy(t,SC.text);break;
  case 'share':doShare(SC.text);break;
  case 'open':MD={type:'e',d:t.dataset.d,id:t.dataset.id};renderMd();break;
  case 'ecopy':var ta=$('etx');doCopy(t,ta?ta.value:'');break;
  case 'eshare':var tb=$('etx');doShare(tb?tb.value:'');break;
  case 'edel':arm(t,function(){var d=MD.d,id=MD.id;flush();del(d,id);if(SC.id===id){SC.id=null;SC.doc=null;}closeMd();});break;
  case 'mclose':closeMd();break;
  case 'theme':setCfg('theme',v);render();break;
  case 'accauto':setCfg('accent','');if(MD)closeMd();render();break;
  case 'acc':setCfg('accent',v);render();break;
  case 'pal':MD={type:'pal'};renderMd();break;
  case 'pick':setCfg('accent',v);MD=null;render();break;
  case 'dlang':setCfg('lang',v);SC.lang=v;render();break;
  case 'enh':setCfg('enh',v==='1');render();break;
  case 'auto':setCfg('auto',v==='1');render();break;
  case 'guide':go('guide');break;
  case 'back':go('set');break;
  case 'sync':sync(true);break;
  case 'export':doExport();break;
  case 'restore':restorePre();break;
  case 'delh':arm(t,function(){wipe(true);bkMsg('Riwayat dihapus.');});break;
  case 'dela':arm(t,function(){wipe(false);bkMsg('Semua data dihapus.');render();});break;
 }});
document.addEventListener('input',function(ev){var t=ev.target,id=t.id;
 if(id==='out'){SC.text=t.value;var s=$('stats');if(s)s.textContent=stats(SC.text);if(SC.id)edit(function(){var e=get(SC.doc,SC.id);if(e)put(SC.doc,SC.id,Object.assign({},e,{text:SC.text}));});}
 else if(id==='etx'){var d=MD&&MD.d,i=MD&&MD.id,val=t.value;edit(function(){var e=get(d,i);if(e)put(d,i,Object.assign({},e,{text:val}));});}
 else if(id==='q'){UI.q=t.value;var l=$('hl');if(l)l.innerHTML=histRows();}
 else if(id==='owner'){var o=t.value;edit(function(){setCfg('owner',o);applyTheme();});}
 else if(id==='scid'||id==='spass'){SY.cid=($('scid')||{}).value||'';SY.pass=($('spass')||{}).value||'';lsSet(K_SY,SY);}});
document.addEventListener('change',function(ev){var t=ev.target;
 if(t.id==='fcam'||t.id==='fgal'){loadFile(t.files&&t.files[0]);t.value='';}
 else if(t.id==='fimp'){doImport(t.files&&t.files[0]);t.value='';}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&MD)closeMd();});
document.addEventListener('paste',function(e){var it=(e.clipboardData&&e.clipboardData.items)||[];for(var i=0;i<it.length;i++){if(it[i].type.indexOf('image')===0){loadFile(it[i].getAsFile());e.preventDefault();return;}}});
document.addEventListener('dragover',function(e){e.preventDefault();});
document.addEventListener('drop',function(e){var f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];if(f&&f.type.indexOf('image')===0){e.preventDefault();loadFile(f);}});
document.addEventListener('visibilitychange',function(){if(document.hidden)flush();});
window.addEventListener('pagehide',flush);
if(window.visualViewport){var vvf=function(){document.body.classList.toggle('kb',window.innerHeight-window.visualViewport.height>120);};window.visualViewport.addEventListener('resize',vvf);}

/* ---------- kripto ---------- */
function b64(buf){var s='',b=new Uint8Array(buf);for(var i=0;i<b.length;i+=8192)s+=String.fromCharCode.apply(null,b.subarray(i,i+8192));return btoa(s);}
function unb64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
async function deriveKey(pass,salt,iter){var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:iter||250000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function enc(obj,pass){var salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),k=await deriveKey(pass,salt,250000);var ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},k,new TextEncoder().encode(JSON.stringify(obj)));return {app:APP,v:1,kdf:'PBKDF2-SHA256',iter:250000,salt:b64(salt),iv:b64(iv),ct:b64(ct)};}
async function dec(env,pass){try{var k=await deriveKey(pass,unb64(env.salt),env.iter);var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(env.iv)},k,unb64(env.ct));return JSON.parse(new TextDecoder().decode(pt));}catch(e){throw new Error('bad_pass');}}

/* ---------- merge per record ---------- */
function mergeIn(c){
 var cd=c.docs||{},ci=c.im||{},changed=false,pre={S:JSON.parse(JSON.stringify(S)),IM:JSON.parse(JSON.stringify(IM))},ds={},d,id;
 function mark(){if(!changed){changed=true;lsSet(K_PRE,pre);}}
 Object.keys(cd).concat(Object.keys(S),Object.keys(ci),Object.keys(IM)).forEach(function(k){ds[k]=1;});
 for(d in ds){var ids={};[cd[d],S[d],ci[d],IM[d]].forEach(function(o){if(o)for(var k in o)ids[k]=1;});
  for(id in ids){
   var lv=S[d]&&S[d][id],cv=cd[d]&&cd[d][id],ls=(IM[d]&&IM[d][id])||0,cs=(ci[d]&&ci[d][id])||0;
   var la=Math.abs(ls),ca=Math.abs(cs),cloudHas=cv!==undefined||cs<0,useCloud;
   if(ca>la)useCloud=true;else if(la>ca)useCloud=false;else useCloud=cloudHas;
   if(!useCloud||!cloudHas)continue;
   if(cs<0){if(lv!==undefined){mark();delete S[d][id];}(IM[d]=IM[d]||{})[id]=cs;}
   else{if(JSON.stringify(lv)!==JSON.stringify(cv)){mark();(S[d]=S[d]||{})[id]=cv;}(IM[d]=IM[d]||{})[id]=cs;}
  }}
 for(d in (c.mt||{}))MT[d]=Math.max(MT[d]||0,c.mt[d]);
 return changed;}
function finishMerge(){lsSet(KEY,S);lsSet(K_IM,IM);lsSet(K_MT,MT);rebuildSnap();applyTheme();SC.lang=cfg('lang','ind+eng');if(MD&&MD.type==='e'&&!get(MD.d,MD.id))MD=null;render();}

/* ---------- login & sync ---------- */
function shared(){try{var a=JSON.parse(localStorage.getItem('shared.auth')||'null');return a&&a.cid&&a.pass&&a.ok?a:null;}catch(e){return null;}}
function creds(){var s=shared();if(s)return {cid:s.cid,pass:s.pass,sh:true};if(SY.cid&&SY.pass)return {cid:SY.cid,pass:SY.pass,sh:false};return null;}
function loadAuth(){return new Promise(function(r){if(window.SharedAuth||window.location.protocol==='file:')return r();var s=document.createElement('script');s.src='../auth.js';s.onload=function(){r();};s.onerror=function(){r();};document.head.appendChild(s);});}
function loadGIS(){return new Promise(function(res,rej){if(window.google&&window.google.accounts&&window.google.accounts.oauth2)return res();var s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=res;s.onerror=function(){rej(new Error('net'));};document.head.appendChild(s);});}
var gTok=null,gExp=0;
async function token(inter){
 var c=creds();
 if(c&&c.sh&&window.SharedAuth){try{var r=await window.SharedAuth.token(inter);if(r&&r.t)return r.t;}catch(e){}}
 if(gTok&&Date.now()<gExp-60000)return gTok;
 if(!c)throw new Error('nologin');
 await loadGIS();
 return new Promise(function(res,rej){var tc=window.google.accounts.oauth2.initTokenClient({client_id:c.cid,scope:'https://www.googleapis.com/auth/drive.appdata',callback:function(r){if(r&&r.access_token){gTok=r.access_token;gExp=Date.now()+(r.expires_in||3600)*1000;res(gTok);}else rej(new Error('auth'));},error_callback:function(){rej(new Error('auth'));}});tc.requestAccessToken({prompt:inter?'':'none'});});}
async function dapi(url,opt,tok){opt=opt||{};opt.headers=Object.assign({Authorization:'Bearer '+tok},opt.headers||{});var r=await fetch(url,opt);if(r.status===401){if(window.SharedAuth&&window.SharedAuth.drop)window.SharedAuth.drop();gTok=null;throw new Error('401');}if(!r.ok)throw new Error('http '+r.status);return r;}
async function findFile(tok){var r=await dapi('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q='+encodeURIComponent("name='ocr.enc.json'")+'&fields=files(id)',{},tok),j=await r.json();return j.files&&j.files[0]&&j.files[0].id;}
async function upload(tok,id,env){var meta=id?{name:'ocr.enc.json'}:{name:'ocr.enc.json',parents:['appDataFolder']},bd='ocrb'+Date.now();
 var body='--'+bd+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(meta)+'\r\n--'+bd+'\r\nContent-Type: application/json\r\n\r\n'+JSON.stringify(env)+'\r\n--'+bd+'--';
 await dapi('https://www.googleapis.com/upload/drive/v3/files'+(id?'/'+id:'')+'?uploadType=multipart',{method:id?'PATCH':'POST',headers:{'Content-Type':'multipart/related; boundary='+bd},body:body},tok);}
var syncing=false,sstat='local',serr='',stimer=0;
function syncMsg(){var m=SY.last?'Terakhir sync '+hm(SY.last)+'.':'Belum tersinkron.';return serr?serr+' '+m:m;}
function setStat(s){sstat=s;var el=$('stat');if(!el)return;if(s==='cloud'&&!creds())s='local';el.dataset.s=s;
 var tx={local:'Tersimpan di perangkat ini',syncing:'Menyinkronkan…',pending:'Belum tersinkron · ketuk',error:'Sync gagal · ketuk',saving:'Menyimpan…',cloud:'Tersinkron '+hm(SY.last||Date.now())}[s];$('statt').textContent=tx;
 var m=$('syncmsg');if(m)m.textContent=syncMsg();}
function scheduleSync(){if(!creds())return;clearTimeout(stimer);stimer=setTimeout(function(){sync(false);},4000);}
async function sync(inter){
 var c=creds();if(!c){serr='Masuk dulu di halaman index.';setStat('local');return;}
 if(syncing)return;syncing=true;serr='';setStat('syncing');
 try{
  flush();
  var tok=await token(inter),id=await findFile(tok);
  if(id){var r=await dapi('https://www.googleapis.com/drive/v3/files/'+id+'?alt=media',{},tok),env=await r.json(),data=await dec(env,c.pass);if(mergeIn(data))finishMerge();else{lsSet(K_IM,IM);lsSet(K_MT,MT);rebuildSnap();}}
  var out=await enc({v:2,docs:S,mt:MT,im:IM},c.pass);await upload(tok,id,out);
  SY.last=Date.now();lsSet(K_SY,SY);setStat('cloud');
 }catch(e){
  if(e&&e.message==='bad_pass'){serr=c.sh?'Passphrase tidak cocok. Lupa? Reset data Drive di halaman index.':'Passphrase tidak cocok.';setStat('error');}
  else{serr=inter?'Sync gagal.':'';setStat(inter?'error':'pending');}
 }
 syncing=false;}

/* ---------- boot ---------- */
applyTheme();render();
loadAuth().then(function(){if(creds()){setStat('pending');setTimeout(function(){sync(false);},1200);}});

})();
</script>
