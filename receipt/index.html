<style>
:root{--bg:#f2f2f7;--card:#fff;--tx:#000;--tx2:#6c6c70;--sep:rgba(60,60,67,.18);--ac:#007aff;--seg:rgba(118,118,128,.12);--segon:#fff;--red:#ff3b30;--green:#248a3d;--bar:rgba(249,249,249,.82)}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--tx:#fff;--tx2:#98989f;--sep:rgba(84,84,88,.6);--seg:rgba(118,118,128,.24);--segon:#636366;--green:#30d158;--bar:rgba(30,30,30,.82)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
body{padding-top:env(safe-area-inset-top);padding-bottom:calc(30px + env(safe-area-inset-bottom));min-height:100vh;-webkit-user-select:none;user-select:none}
body.hasbar{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
body.kb .tabbar{display:none}
body.kb.hasbar{padding-bottom:30px}
#top{display:flex;align-items:center;justify-content:space-between;height:44px;padding:0 16px}
#top button{border:0;background:transparent;color:var(--ac);font:inherit;font-size:20px;font-weight:600;padding:6px 4px;min-width:40px}
#top svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;display:block}
h1{font-size:34px;font-weight:800;letter-spacing:-.4px;margin:0;padding:6px 20px 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#st{display:block;border:0;background:transparent;color:var(--ac);font:inherit;font-size:14px;font-weight:600;padding:2px 20px 12px;text-align:left;min-height:22px}
#st.err{color:var(--red)}
#view{padding:8px 16px 0}
.card{background:var(--card);border-radius:14px;margin:0 0 16px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;min-height:52px;padding:9px 16px;border-top:.5px solid var(--sep)}
.row:first-child{border-top:0}
.row.tap{cursor:pointer}
.row .nm{flex:1;min-width:0;font-size:17px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{font-size:13px;color:var(--tx2);font-weight:500;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .lb{font-size:16px;font-weight:600;flex:none}
.row .val{font-size:16px;font-weight:700;flex:none;text-align:right}
.row .val.mut{color:var(--tx2);font-weight:600}
.row .val.neg{color:var(--green)}
.ib{flex:none;width:34px;height:34px;border:0;border-radius:17px;background:var(--seg);color:var(--tx);font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0}
.seg{display:flex;background:var(--seg);border-radius:9px;padding:2px;flex:1;min-width:0}
.seg button{flex:1;min-width:0;border:0;background:transparent;color:var(--tx);font:inherit;font-size:14px;font-weight:600;padding:7px 4px;border-radius:7px}
.seg button.on{background:var(--segon);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:50px;border:0;border-radius:14px;background:var(--ac);color:#fff;font:inherit;font-size:17px;font-weight:700;margin:0 0 16px}
.btn.sec{background:var(--card);color:var(--ac)}
.btn.red{color:var(--red)}
.btn:disabled{opacity:.35}
.btn.sm{height:34px;width:auto;padding:0 14px;font-size:15px;border-radius:17px;margin:0;flex:none}
.btn.sm.sec{background:var(--seg)}
input[type=text],input[type=date],input[type=search],textarea{border:0;background:transparent;font:inherit;font-size:17px;font-weight:600;color:var(--tx);outline:0;-webkit-user-select:text;user-select:text;min-width:0;flex:1;text-align:right;padding:0}
textarea{resize:none;min-height:60px;text-align:left;padding:8px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:6px 16px 12px}
.chip{border:0;background:var(--seg);color:var(--tx);font:inherit;font-size:15px;font-weight:600;padding:8px 14px;border-radius:18px}
.chip.on{background:var(--ac);color:#fff}
.step{display:flex;align-items:center;gap:8px;flex:none}
.step b{min-width:28px;text-align:center;font-size:16px}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:10}
.tabbar button{flex:1;border:0;background:transparent;color:var(--tx2);font:inherit;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0}
.tabbar button.on{color:var(--ac)}
.tabbar svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bk{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:40}
.sh{position:fixed;left:0;right:0;bottom:0;max-height:90vh;background:var(--bg);border-radius:16px 16px 0 0;z-index:41;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.shh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;flex:none}
.shh b{font-size:17px}
.lnk{border:0;background:transparent;color:var(--ac);font:inherit;font-size:17px;font-weight:500;padding:4px;min-width:60px}
.lnk.b{font-weight:700;text-align:right}
.lnk:first-child{text-align:left}
.shb{overflow:auto;padding:0 16px 24px;-webkit-overflow-scrolling:touch}
.pal{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;padding:8px 0}
.sw{aspect-ratio:1;border-radius:50%;border:3px solid transparent}
.sw.on{border-color:var(--tx)}
.prev{display:block;width:100%;border-radius:12px;background:#fff}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-140px);background:#2c2c2e;color:#fff;padding:12px 18px;border-radius:14px;font-size:15px;font-weight:600;max-width:88vw;z-index:60;transition:transform .25s}
.toast.show{transform:translate(-50%,0)}
.gh{padding:14px 16px;font-size:17px;font-weight:700;display:flex;justify-content:space-between;width:100%;border:0;background:transparent;color:var(--tx);font-family:inherit;text-align:left}
.gb{padding:0 16px 22px;font-size:15px;line-height:1.5}
.gb img{width:100%;max-width:340px;display:block;margin:12px auto 0;border-radius:12px;border:.5px solid var(--sep)}
.gb ol{margin:0;padding-left:20px}
.tri{width:10px;height:10px;fill:var(--tx2);flex:none;align-self:center}
#top button{display:flex;align-items:center}
#top svg.tri{fill:currentColor;stroke:none;width:11px;height:11px;margin-right:7px}
.ic{width:18px;height:18px;display:block;flex:none}
.ib .tri{fill:var(--tx)}
a.row .ic{width:22px;height:22px;color:var(--ac)}
</style>
</head>

<div id="view"></div>

<script>
(function(){
'use strict';
var KS='bagi.v1',KU='bagi.ui',KY='bagi.sync',KB='bagi.bak';
var DB={docs:{}};
var UI={screen:'home',prev:'home',sid:null,tab:'shops',shop:null,g:{}};
var SY={clientId:'',on:false,last:0,fileId:'',sh:false};
var TOK=null,TOKEXP=0,PASS='',TC=null,TCRES=null,TCREJ=null,syncing=false,STAT='',STERR=false;
var MD=null;

/* ---------- util ---------- */
function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function uid(){return Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3);}
function num(n){return String(Math.round(Math.abs(n))).replace(/\B(?=(\d{3})+(?!\d))/g,'.');}
function rp(n){n=Math.round(n);return (n<0?'−':'')+'Rp '+num(n);}
function sum(a){var s=0;for(var i=0;i<a.length;i++)s+=a[i];return s;}
function ru(x,u){return Math.round(x/u)*u;}
var MON=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
function fdate(s){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?(+m[3])+' '+MON[+m[2]-1]+' '+m[1]:'';}
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
var tt;function toast(m){var t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('show');},3200);}
function pnum(s){return parseInt(String(s).replace(/\D/g,''),10)||0;}
function pflt(s){var v=parseFloat(String(s).replace(',','.'));return isFinite(v)?v:0;}

/* ---------- storage ---------- */
function load(){
 try{var j=JSON.parse(localStorage.getItem(KS));if(j&&j.docs)DB=j;}catch(e){}
 try{var u=JSON.parse(localStorage.getItem(KU));if(u)for(var k in u)if(k in UI)UI[k]=u[k];}catch(e){}
 try{var y=JSON.parse(localStorage.getItem(KY));if(y)for(var k2 in y)if(k2 in SY)SY[k2]=y[k2];}catch(e){}
}
function save(){try{localStorage.setItem(KS,JSON.stringify(DB));}catch(e){}}
function saveUI(){try{localStorage.setItem(KU,JSON.stringify({screen:UI.screen,prev:UI.prev,sid:UI.sid,tab:UI.tab,shop:UI.shop}));}catch(e){}}
function saveSY(){try{localStorage.setItem(KY,JSON.stringify({clientId:SY.clientId,on:SY.on,last:SY.last,fileId:SY.fileId}));}catch(e){}}
function put(doc,id,val){var d=DB.docs[doc]||(DB.docs[doc]={mt:0,d:{}});d.d[id]=val;d.mt=Date.now();save();}
function del(doc,id){var d=DB.docs[doc];if(d){delete d.d[id];d.mt=Date.now();save();}}
function get(doc,id){var d=DB.docs[doc];return d?d.d[id]:undefined;}
function cfg(k,def){var v=get('cfg',k);return v===undefined?def:v;}

/* ---------- model ---------- */
function sessions(){
 return Object.keys(DB.docs).filter(function(n){return n.indexOf('s_')===0;}).map(function(n){return {doc:n,meta:DB.docs[n].d.meta};})
  .filter(function(x){return x.meta&&!x.meta.gone;})
  .sort(function(a,b){return (b.meta.date||'').localeCompare(a.meta.date||'')||(b.meta.ts||0)-(a.meta.ts||0);});
}
function shopsOf(doc){
 var d=DB.docs[doc];if(!d)return [];
 return Object.keys(d.d).filter(function(k){return k.indexOf('h_')===0;}).map(function(k){return d.d[k];}).sort(function(a,b){return (a.ts||0)-(b.ts||0);});
}
function pname(meta,id){for(var i=0;i<meta.people.length;i++)if(meta.people[i].id===id)return meta.people[i].n;return '?';}
function updShop(doc,sid,fn){var s=get(doc,'h_'+sid);if(!s)return;fn(s);put(doc,'h_'+sid,s);}

/* ---------- calc ---------- */
function calc(doc){
 var meta=get(doc,'meta'),unit=cfg('unit',100),owed={},paid={},shops=[],warn=0;
 meta.people.forEach(function(p){owed[p.id]=0;paid[p.id]=0;});
 shopsOf(doc).forEach(function(sh){
  var items=sh.items||[],base=items.map(function(it){return it.p*it.q;}),cur=base.slice(),feeRows=[];
  (sh.fees||[]).forEach(function(fe){
   var idx=[];
   items.forEach(function(it,i){if(fe.scope!=='pick'||(fe.ids||[]).indexOf(it.id)>=0)idx.push(i);});
   var sign=fe.k==='diskon'?-1:1,amt=items.map(function(){return 0;}),tot=0;
   if(fe.t==='pct'){idx.forEach(function(i){amt[i]=sign*fe.v/100*(fe.af?cur[i]:base[i]);});}
   else{
    var w=idx.map(function(i){return fe.k==='ongkir'?1:base[i];}),sw=sum(w);
    idx.forEach(function(i,j){amt[i]=sw?sign*fe.v*w[j]/sw:0;});
   }
   idx.forEach(function(i){if(cur[i]+amt[i]<0)amt[i]=-cur[i];cur[i]+=amt[i];tot+=amt[i];});
   feeRows.push({fe:fe,total:tot});
  });
  var per={},lines={};
  meta.people.forEach(function(p){per[p.id]=0;lines[p.id]=[];});
  var itemRows=items.map(function(it,i){
   var ws=meta.people.filter(function(p){return (it.who||[]).indexOf(p.id)>=0;}).map(function(p){return [p.id,(it.sh&&it.sh[p.id])||1];});
   var sw=sum(ws.map(function(x){return x[1];}));
   if(!sw)warn++;
   ws.forEach(function(x){var s=cur[i]*x[1]/sw;per[x[0]]+=s;lines[x[0]].push({item:it,w:x[1],share:s,multi:!!(it.sh&&it.sh[x[0]]&&it.sh[x[0]]!==1)});});
   return {it:it,base:base[i],final:cur[i],assigned:sw>0};
  });
  var total=sum(Object.keys(per).map(function(k){return per[k];}));
  meta.people.forEach(function(p){owed[p.id]+=per[p.id];});
  if(sh.payer&&paid[sh.payer]!==undefined)paid[sh.payer]+=total;
  shops.push({sh:sh,items:itemRows,fees:feeRows,subtotal:sum(base),total:total,per:per,lines:lines});
 });
 var net={};meta.people.forEach(function(p){net[p.id]=owed[p.id]-paid[p.id];});
 return {meta:meta,unit:unit,shops:shops,owed:owed,paid:paid,net:net,transfers:makeTransfers(net,unit),total:sum(shops.map(function(s){return s.total;})),warn:warn};
}
function makeTransfers(net,unit){
 var deb=[],cre=[],out=[];
 Object.keys(net).forEach(function(id){var v=net[id];if(v>0.5)deb.push({id:id,a:v,t:v,pcs:[]});else if(v<-0.5)cre.push({id:id,a:-v});});
 deb.sort(function(x,y){return y.a-x.a;});cre.sort(function(x,y){return y.a-x.a;});
 var i=0,j=0;
 while(i<deb.length&&j<cre.length){
  var x=Math.min(deb[i].a,cre[j].a);
  deb[i].pcs.push({to:cre[j].id,a:x});deb[i].a-=x;cre[j].a-=x;
  if(deb[i].a<0.5)i++;
  if(cre[j].a<0.5)j++;
 }
 deb.forEach(function(d){
  var target=ru(d.t,unit),acc=0;
  d.pcs.forEach(function(p,k){
   var a=k===d.pcs.length-1?target-acc:ru(p.a,unit);
   a=Math.max(0,a);acc+=a;
   if(a>0)out.push({from:d.id,to:p.to,amt:a});
  });
 });
 return out;
}
function feeLabel(fe){
 var n={pajak:'Pajak',servis:'Servis',diskon:'Diskon',ongkir:'Ongkir',lain:'Biaya lain'}[fe.k]||'Biaya';
 return n+(fe.t==='pct'?' '+String(fe.v).replace('.',',')+'%':'');
}

function vGuide(){
 return '<div class="card">'+GUIDE.map(function(g,i){
  var open=UI.g[i];
  return '<div style="border-top:'+(i?'.5px solid var(--sep)':'0')+'"><button class="gh" data-act="gtog" data-i="'+i+'">'+g[0]+(open?IC.triD:IC.tri)+'</button>'+
   (open?'<div class="gb"><ol>'+g[1].map(function(s){return '<li>'+s+'</li>';}).join('')+'</ol><img src="'+g[2]+'" alt=""></div>':'')+'</div>';
 }).join('')+'</div>';
}
function render(){
 var s=UI.screen,doc=UI.sid,meta=doc?get(doc,'meta'):null,hasbar=false,title='',back='',gear='',st=false,body='';
 if((s==='sess'||s==='shop')&&(!meta||meta.gone)){UI.screen=s='home';UI.sid=null;}
 if(s==='home'){title='Bagi Tagihan';gear='gear';st=true;body=vHome();}
 else if(s==='sess'){title=meta.name;back='Sesi';gear='gear';st=true;hasbar=true;body={shops:vShops,people:vPeople,result:vResult}[UI.tab](doc);}
 else if(s==='shop'){var sh=get(doc,'h_'+UI.shop);if(!sh){UI.screen='sess';return render();}title=sh.name;back='Belanja';body=vShop(doc,UI.shop);}
 else if(s==='setup'){title='Setup';back='Kembali';body=vSetup();}
 else if(s==='guide'){title='Panduan';back='Setup';body=vGuide();}
 $('top').innerHTML=(back?'<button data-act="back">'+IC.triL+back+'</button>':'<span></span>')+(gear?'<button data-act="setup">'+IC.gear+'</button>':'<span></span>');
 $('ttl').textContent=title;
 var b=$('st');b.style.display=st?'block':'none';b.textContent=STAT||syncLabel();b.className=STERR?'err':'';
 $('view').innerHTML=body;
 var tb=$('tabs');tb.style.display=hasbar?'flex':'none';
 document.body.classList.toggle('hasbar',hasbar);
 if(hasbar)tb.innerHTML=[['shops','Belanja'],['people','Orang'],['result','Hasil']].map(function(t){return '<button data-act="tab" data-v="'+t[0]+'" class="'+(UI.tab===t[0]?'on':'')+'">'+IC[t[0]]+'<span>'+t[1]+'</span></button>';}).join('');
 saveUI();
}
function syncLabel(){
 if(!SY.clientId&&!SY.sh)return 'Sinkron belum diatur';
 if(!SY.on)return SY.sh?'Ketuk untuk sinkron':'Ketuk untuk menghubungkan';
 return 'Tersinkron '+(SY.last?new Date(SY.last).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}):'')+' · ketuk untuk sinkron';
}
function setStat(t,err){STAT=t||'';STERR=!!err;var b=$('st');b.textContent=STAT||syncLabel();b.className=STERR?'err':'';}

/* ---------- sheets ---------- */
function fld(label,inner){return '<div class="row"><span class="lb">'+label+'</span>'+inner+'</div>';}
function chips(list,isOn,act,extra){return '<div class="chips">'+list.map(function(p){return '<button class="chip'+(isOn(p)?' on':'')+'" data-act="'+act+'" data-id="'+p[0]+'"'+(extra||'')+'>'+esc(p[1])+'</button>';}).join('')+'</div>';}
function curMeta(){return get(UI.sid,'meta');}
function openSheet(type,data){MD={type:type,data:data||{},draft:null};drawSheet();}
function closeSheet(){MD=null;$('sheet').innerHTML='';}
function drawSheet(){
 if(!MD){$('sheet').innerHTML='';return;}
 var t=MD.type,d=MD.data,meta=UI.sid?curMeta():null,title='',body='',save=true;
 if(t==='sess'){
  title=d.doc?'Ganti nama':'Sesi baru';
  body='<div class="card">'+fld('Nama','<input type="text" id="f_n" value="'+esc(d.n||'')+'" placeholder="Makan malam">')+fld('Tanggal','<input type="date" id="f_d" value="'+esc(d.date||today())+'">')+'</div>';
  if(!d.doc)body+='<div class="card"><div class="row"><textarea id="f_pp" placeholder="Peserta, pisahkan dengan koma">'+esc(d.p||'')+'</textarea></div></div>';
 }else if(t==='person'){
  title=d.id?'Ganti nama':'Orang baru';
  body='<div class="card">'+fld('Nama','<input type="text" id="f_n" value="'+esc(d.n||'')+'">')+'</div>';
 }else if(t==='shop'){
  var dr=MD.draft||(MD.draft={n:d.n||'',payer:d.payer||(meta.people[0]&&meta.people[0].id)||''});
  title=d.id?'Belanja':'Belanja baru';
  body='<div class="card">'+fld('Tempat','<input type="text" id="f_n" value="'+esc(dr.n)+'" placeholder="Nama tempat">')+'<div class="row" style="border-top:.5px solid var(--sep)"><span class="lb">Dibayar oleh</span></div>'+chips(meta.people.map(function(p){return [p.id,p.n];}),function(p){return dr.payer===p[0];},'payer')+'</div>';
 }else if(t==='item'){
  var it=MD.draft||(MD.draft=d.id?JSON.parse(JSON.stringify(d)):{n:'',p:'',q:1,who:meta.people.map(function(p){return p.id;}),sh:{}});
  title=d.id?'Item':'Item baru';
  var ppl=meta.people.filter(function(p){return it.who.indexOf(p.id)>=0;});

function renderImage(model){
 var W=1080,P=48,CP=36,RH=66,SUBH=42,m=document.createElement('canvas').getContext('2d');
 var IW=W-2*P-2*CP;
 function wrap(s,font,maxW){m.font=font;var w=s.split(' '),ln='',o=[];w.forEach(function(x){var t=ln?ln+' '+x:x;if(m.measureText(t).width>maxW&&ln){o.push(ln);ln=x;}else ln=t;});if(ln)o.push(ln);return o;}
 var y=P+70+(model.sub?56:0)+30,layout=[];
 model.secs.forEach(function(sec){
  var hh=84,items=[],h=CP+hh;
  sec.rows.forEach(function(r){
   if(r.sub!==undefined){var ls=wrap(r.sub,'500 28px '+FONT,IW-40);items.push({t:'sub',ls:ls});h+=ls.length*SUBH-4;}
   else{items.push({t:'row',r:r});h+=RH;}
  });
  h+=CP-8;
  layout.push({sec:sec,items:items,y:y,h:h});
  y+=h+28;
 });
 var H=y+P-28,c=document.createElement('canvas');c.width=W;c.height=H;
 var x=c.getContext('2d');
 x.fillStyle='#f2f2f7';x.fillRect(0,0,W,H);
 x.textBaseline='alphabetic';
 x.fillStyle='#000';x.font='800 56px '+FONT;x.textAlign='left';x.fillText(trunc(x,model.head,W-2*P),P,P+52);
 if(model.sub){x.fillStyle='#6c6c70';x.font='600 32px '+FONT;x.fillText(trunc(x,model.sub,W-2*P),P,P+52+52);}
 layout.forEach(function(L){
  x.fillStyle='#fff';
  x.beginPath();if(x.roundRect)x.roundRect(P,L.y,W-2*P,L.h,28);else x.rect(P,L.y,W-2*P,L.h);x.fill();
  var cx=P+CP,cy=L.y+CP+40;
  x.fillStyle='#000';x.font='800 38px '+FONT;x.textAlign='left';
  var tw=L.sec.tr?IW*0.55:IW;
  x.fillText(trunc(x,L.sec.title,tw),cx,cy);
  if(L.sec.tr){x.fillStyle='#6c6c70';x.font='600 28px '+FONT;x.textAlign='right';x.fillText(trunc(x,L.sec.tr,IW*0.42),cx+IW,cy);}
  cy+=44;
  L.items.forEach(function(it){
   if(it.t==='sub'){
    x.fillStyle='#6c6c70';x.font='500 28px '+FONT;x.textAlign='left';
    it.ls.forEach(function(s,i){x.fillText(s,cx+8,cy+SUBH*0.35+i*SUBH);});
    cy+=it.ls.length*SUBH-4;
   }else{
    var r=it.r;
    x.fillStyle=r.g?'#6c6c70':'#000';
    x.font=(r.b?'800 ':'600 ')+'34px '+FONT;x.textAlign='right';
    var rw=r.r?x.measureText(r.r).width:0;
    x.fillText(r.r||'',cx+IW,cy+RH*0.5);
    x.textAlign='left';x.fillText(trunc(x,r.l,IW-rw-24),cx,cy+RH*0.5);
    cy+=RH;
   }
  });
 });
 return new Promise(function(res){c.toBlob(res,'image/png');});
}

function b64(bytes){var s='';for(var i=0;i<bytes.length;i+=8192)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));return btoa(s);}
function unb64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
async function deriveKey(pass,salt){
 var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:250000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encObj(obj,pass){
 var salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),key=await deriveKey(pass,salt);
 var ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,new TextEncoder().encode(JSON.stringify(obj))));
 var all=new Uint8Array(28+ct.length);all.set(salt,0);all.set(iv,16);all.set(ct,28);
 return b64(all);
}
async function decObj(txt,pass){
 var all=unb64(txt.trim()),key=await deriveKey(pass,all.slice(0,16));
 var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:all.slice(16,28)},key,all.slice(28));
 return JSON.parse(new TextDecoder().decode(pt));
}

    callback:function(r){if(r.error){if(TCREJ)TCREJ(new Error(r.error));return;}TOK=r.access_token;TOKEXP=Date.now()+(r.expires_in||3600)*1000;if(TCRES)TCRES(TOK);},

  }
  TCRES=res;TCREJ=rej;TC.requestAccessToken({prompt:''});

function getToken(interactive){
 if(TOK&&Date.now()<TOKEXP-60000)return Promise.resolve(TOK);
 var sa=refreshShared();
 if(sa){
  if(window.SharedAuth&&typeof SharedAuth.token==='function'){
   return SharedAuth.token(!!interactive).then(function(r){TOK=r.t;TOKEXP=r.exp;return TOK;});
  }
  if(sa.tok&&sa.exp&&Date.now()<sa.exp-60000){TOK=sa.tok;TOKEXP=sa.exp;return Promise.resolve(TOK);}
  if(!interactive)return Promise.reject(new Error('silent'));
 }

}

 setTimeout(function(){URL.revokeObjectURL(u);},30000);
}
function applyCfg(){document.documentElement.style.setProperty('--ac',cfg('accent','#007aff'));}

/* ---------- events ---------- */
function go(s,extra){UI.prev=UI.screen;UI.screen=s;if(extra)for(var k in extra)UI[k]=extra[k];render();window.scrollTo(0,0);}
document.addEventListener('click',function(e){
 var b=e.target.closest('[data-act]');if(!b||b.disabled)return;
 var a=b.dataset.act,id=b.dataset.id,doc=UI.sid;
 if(MD)syncDraft();
 switch(a){
  case 'back':
   if(UI.screen==='shop')UI.screen='sess';
   else if(UI.screen==='sess'){UI.screen='home';UI.sid=null;}
   else if(UI.screen==='guide')UI.screen='setup';
   else if(UI.screen==='setup')UI.screen=UI.sid?'sess':'home';
   render();window.scrollTo(0,0);break;
  case 'setup':refreshShared();go('setup');break;
  case 'guide':go('guide');break;
  case 'gtog':UI.g[b.dataset.i]=!UI.g[b.dataset.i];render();break;
  case 'tab':UI.tab=b.dataset.v;render();window.scrollTo(0,0);break;
  case 'open':go('sess',{sid:b.dataset.doc,tab:'shops'});break;
  case 'openshop':go('shop',{shop:id});break;
  case 'newsess':openSheet('sess',{});break;
  case 'smenu':openSheet('act',{title:esc(get(b.dataset.doc,'meta').name),items:[{l:'Ganti nama',act:'sren',doc:b.dataset.doc},{l:'Duplikat',act:'sdup',doc:b.dataset.doc},{l:'Hapus',act:'sdelq',doc:b.dataset.doc,red:1}]});break;
  case 'sren':{var m=get(b.dataset.doc,'meta');openSheet('sess',{doc:b.dataset.doc,n:m.name,date:m.date});break;}
  case 'sdup':{
   var src=DB.docs[b.dataset.doc],nid='s_'+uid(),cp=JSON.parse(JSON.stringify(src.d));cp.meta.name+=' (salinan)';cp.meta.ts=Date.now();
   DB.docs[nid]={mt:Date.now(),d:cp};save();closeSheet();render();break;}
  case 'sdelq':openSheet('confirm',{title:'Hapus sesi',msg:'Sesi dan semua belanjanya akan dihapus.',act:'sdel',doc:b.dataset.doc,label:'Hapus'});break;
  case 'sdel':DB.docs[b.dataset.doc]={mt:Date.now(),d:{meta:{gone:1}}};save();if(UI.sid===b.dataset.doc){UI.sid=null;UI.screen='home';}closeSheet();render();break;
  case 'newperson':openSheet('person',{});break;
  case 'pmenu':{var pm=curMeta(),pp=pm.people.filter(function(p){return p.id===id;})[0];openSheet('act',{title:esc(pp.n),items:[{l:'Ganti nama',act:'pren',id:id},{l:'Hapus',act:'pdelq',id:id,red:1}]});break;}
  case 'pren':{var pm2=curMeta();openSheet('person',{id:id,n:pname(pm2,id)});break;}
  case 'pdelq':if(curMeta().people.length<2){toast('Minimal satu orang');break;}openSheet('confirm',{title:'Hapus orang',msg:'Orang ini dikeluarkan dari semua item.',act:'pdel',id:id,label:'Hapus'});break;
  case 'pdel':{
   var m3=curMeta();m3.people=m3.people.filter(function(p){return p.id!==id;});put(doc,'meta',m3);
   shopsOf(doc).forEach(function(s){
    s.items.forEach(function(it){it.who=it.who.filter(function(w){return w!==id;});if(it.sh)delete it.sh[id];});
    if(s.payer===id)s.payer=m3.people[0].id;
    put(doc,'h_'+s.id,s);
   });
   closeSheet();render();break;}
  case 'newshop':if(!curMeta().people.length){toast('Tambah orang dulu');break;}openSheet('shop',{});break;
  case 'editshop':{var sh=get(doc,'h_'+UI.shop);openSheet('shop',{id:sh.id,n:sh.name,payer:sh.payer});break;}
  case 'payer':MD.draft.payer=id;drawSheet();break;
  case 'delshop':openSheet('confirm',{title:'Hapus belanja',msg:'Belanja ini dan isinya akan dihapus.',act:'delshopok',label:'Hapus'});break;
  case 'delshopok':del(doc,'h_'+UI.shop);UI.screen='sess';closeSheet();render();break;
  case 'newitem':openSheet('item',{});break;
  case 'edititem':{var sh2=get(doc,'h_'+UI.shop),it=sh2.items.filter(function(x){return x.id===id;})[0];var cp2=JSON.parse(JSON.stringify(it));cp2.portion=!!(cp2.sh&&Object.keys(cp2.sh).length);MD={type:'item',data:{id:id},draft:cp2};drawSheet();break;}
  case 'who':{var w=MD.draft.who,ix=w.indexOf(id);if(ix>=0)w.splice(ix,1);else w.push(id);drawSheet();break;}
  case 'whoall':{var all=curMeta().people.map(function(p){return p.id;});MD.draft.who=MD.draft.who.length===all.length?[]:all;drawSheet();break;}
  case 'porsi':MD.draft.portion=!MD.draft.portion;drawSheet();break;
  case 'pstep':{var cur=MD.draft.sh[id]||1,nv=Math.max(0.5,cur+parseFloat(b.dataset.d));MD.draft.sh[id]=nv;drawSheet();break;}
  case 'delitem':updShop(doc,UI.shop,function(s){s.items=s.items.filter(function(x){return x.id!==MD.data.id;});s.fees.forEach(function(f){f.ids=(f.ids||[]).filter(function(i){return i!==MD.data.id;});});});closeSheet();render();break;
  case 'newfee':openSheet('fee',{});break;
  case 'editfee':{var sh3=get(doc,'h_'+UI.shop),fe=sh3.fees.filter(function(x){return x.id===id;})[0];var c3=JSON.parse(JSON.stringify(fe));MD={type:'fee',data:{id:id},draft:c3};drawSheet();break;}
  case 'fset':{
   var d=MD.draft,k=b.dataset.k,v=b.dataset.v;d[k]=v;
   if(k==='k'&&!MD.data.id){
    if(v==='pajak'){d.t='pct';d.v='10';d.af=true;d.m='harga';}
    else if(v==='servis'){d.t='pct';d.v='5';d.af=false;}
    else if(v==='diskon'){d.t='pct';d.v='';d.af=false;d.m='harga';}
    else if(v==='ongkir'){d.t='rp';d.v='';d.m='rata';d.af=false;}
    else{d.t='rp';d.v='';d.m='harga';}
   }
   if(k==='t'){d.v='';}
   drawSheet();break;}
  case 'fitem':{var ids=MD.draft.ids,j=ids.indexOf(id);if(j>=0)ids.splice(j,1);else ids.push(id);drawSheet();break;}
  case 'faf':MD.draft.af=!MD.draft.af;drawSheet();break;
  case 'delfee':updShop(doc,UI.shop,function(s){s.fees=s.fees.filter(function(x){return x.id!==MD.data.id;});});closeSheet();render();break;
  case 'ssave':ssave();break;
  case 'sclose':if(MD&&MD.type==='pass'&&PASSRES){var r=PASSRES;PASSRES=null;r('');}if(MD&&MD.type==='img'&&IMG){URL.revokeObjectURL(IMG.url);IMG=null;}closeSheet();break;
  case 'simg':showImage(doc,null).catch(function(){toast('Gagal membuat gambar');});break;
  case 'pimg':showImage(doc,id).catch(function(){toast('Gagal membuat gambar');});break;
  case 'imgsave':download(IMG.blob,IMG.name);break;
  case 'imgshare':navigator.share({files:[IMG.file]}).catch(function(e){if(e&&e.name!=='AbortError')toast('Gagal membagikan');});break;
  case 'cunit':put('cfg','unit',Number(b.dataset.v));render();break;
  case 'pal':openSheet('pal',{});break;
  case 'setacc':put('cfg','accent',b.dataset.c);applyCfg();drawSheet();break;
  case 'syncnow':syncNow(true);break;
  case 'disc':disconnect();break;
  case 'backup':download(new Blob([JSON.stringify({v:1,docs:DB.docs})],{type:'application/json'}),'bagi-tagihan-cadangan.json');break;
  case 'restore':{
   var i=document.createElement('input');i.type='file';i.accept='application/json,.json';i.style.display='none';document.body.appendChild(i);
   i.addEventListener('change',function(){
    var f=i.files[0];i.remove();if(!f)return;
    f.text().then(function(t){var j=JSON.parse(t);if(!j.docs)throw 0;try{localStorage.setItem(KB,JSON.stringify(DB));}catch(e){}DB.docs=j.docs;save();applyCfg();UI.screen='home';UI.sid=null;render();toast('Data dipulihkan');}).catch(function(){toast('File tidak valid');});
   });
   i.click();break;}
  case 'reset':openSheet('confirm',{title:'Hapus semua data',msg:'Semua sesi di perangkat ini akan dihapus. Data di Drive tidak ikut terhapus.',act:'resetok',label:'Hapus semua'});break;
  case 'resetok':try{localStorage.setItem(KB,JSON.stringify(DB));}catch(e){}DB={docs:{}};save();UI.screen='home';UI.sid=null;applyCfg();closeSheet();render();break;
 }
});
$('st').addEventListener('click',function(){refreshShared();if(!effCid()){go('setup');toast('Isi Client ID dulu');}else syncNow(true);});
document.addEventListener('input',function(e){
 var t=e.target;
 if(t.id==='f_p'||(t.id==='f_v'&&MD&&MD.draft&&MD.draft.t==='rp')){var n=pnum(t.value);t.value=n?num(n):'';}
});
document.addEventListener('change',function(e){
 if(e.target.id==='cid'){SY.clientId=e.target.value.trim();TC=null;SY.on=false;SY.fileId='';saveSY();}
});
document.addEventListener('focusin',function(e){if(e.target.closest&&e.target.closest('.sh')){setTimeout(function(){try{e.target.scrollIntoView({block:'center'});}catch(x){}},300);}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&MD){var r=PASSRES;if(MD.type==='pass'&&r){PASSRES=null;r('');}closeSheet();}});
if(window.visualViewport){visualViewport.addEventListener('resize',function(){document.body.classList.toggle('kb',window.innerHeight-visualViewport.height>150);});}

load();refreshShared();applyCfg();render();
(function(){
 var s=document.createElement('script');s.src='../auth.js';s.async=true;
 s.onload=s.onerror=function(){setTimeout(autoSync,500);};
 document.head.appendChild(s);
 setTimeout(autoSync,4000);
})();
})();
</script>
