<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Planner">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Planner & Journal</title>
<style>
/* Layout: sticky pill tabs over one view at a time. Neutral surfaces, with point colors per section, month and habit. */
:root{
  --bg:#F4F5FA; --surface:#FFFFFF; --ink:#1C2236; --muted:#667089; --line:#E2E5EF; --soft:#ECEEF6; --field:#F6F7FB;
  --blue:#3B82F6; --pink:#EC4899; --green:#22B573; --teal:#14B8C4; --amber:#F5A524; --orange:#FB7C2D; --coral:#EF5B5B; --violet:#8B5CF6;
  --acc:#3B82F6; --on:#FFFFFF;
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'Figtree','Segoe UI',system-ui,sans-serif;
  --shadow:0 1px 2px rgba(28,34,54,.05),0 6px 18px rgba(28,34,54,.05);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1220; --surface:#171B2E; --ink:#E8EAF4; --muted:#9AA1BC; --line:#2A3050; --soft:#20264A; --field:#1D2240;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1220; --surface:#171B2E; --ink:#E8EAF4; --muted:#9AA1BC; --line:#2A3050; --soft:#20264A; --field:#1D2240;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button{font-family:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px 56px}
.top{padding:26px 0 6px}
.brand{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font:800 clamp(30px,6vw,48px)/1 var(--display);letter-spacing:-.02em;margin:0;text-wrap:balance}
h1 span{color:var(--acc)}
.sub{color:var(--muted);margin:8px 0 0}
.status{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 12px}
.status i{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.status[data-s="cloud"] i{background:var(--green)}
.status[data-s="saving"] i,.status[data-s="syncing"] i,.status[data-s="pending"] i{background:var(--amber)}
.status{cursor:pointer}
.syhelp{margin-top:6px;font-size:13.5px}
.syhelp summary{cursor:pointer;color:var(--acc);font-weight:600}
.syhelp ol{padding-left:20px;margin:8px 0}
.syhelp li{margin:4px 0}
.status[data-s="error"] i{background:var(--coral)}
.status[data-s="local"] i{background:var(--blue)}
.yearbar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:16px}
.yearbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--teal),var(--green),var(--amber),var(--orange),var(--coral),var(--pink),var(--violet))}
nav.tabs{position:sticky;top:0;z-index:5;display:flex;gap:8px;overflow-x:auto;padding:10px 0;margin:6px 0 10px;scrollbar-width:none;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px)}
nav.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;font-weight:600;font-size:14px}
.tab::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.tab.on{background:var(--c);border-color:var(--c);color:var(--on)}
.tab.on::before{background:var(--on)}
.tab:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.vh h2{font:800 clamp(24px,4vw,32px)/1.1 var(--display);letter-spacing:-.01em;margin:10px 0 4px}
.vh p{color:var(--muted);margin:0 0 16px;max-width:68ch}
.grid{display:grid;gap:16px;margin-bottom:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 18px 16px;box-shadow:var(--shadow);overflow:hidden;min-width:0}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--cc,var(--acc))}
.card h3{font:800 18px/1.2 var(--display);margin:2px 0 4px}
.card .hint{color:var(--muted);font-size:13px;margin:0 0 10px}
.lab{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:12px 0 4px}
.f{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1px solid transparent;border-bottom-color:var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.f::placeholder{color:color-mix(in srgb,var(--muted) 65%,transparent)}
.f:focus{outline:none;border-color:var(--acc);background:var(--surface);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
.ta{resize:vertical;min-height:2.7em;overflow:hidden;line-height:1.45}
.big{font:800 clamp(22px,4vw,30px)/1.2 var(--display);padding:10px 12px}
.row{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.row:has(input[type=checkbox]:checked) .f{text-decoration:line-through;color:var(--muted)}
.chk{position:relative;display:inline-flex;flex:none;cursor:pointer}
.chk input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.chk .box{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center}
.chk input:checked+.box{background:var(--acc);border-color:var(--acc)}
.chk input:checked+.box::after{content:"";width:6px;height:11px;border:solid var(--on);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chk input:focus-visible+.box{outline:2px solid var(--acc);outline-offset:2px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.pill{display:inline-block;font-size:11px;font-weight:700;border-radius:99px;padding:2px 8px;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--ink);border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.ssc{border-radius:12px;padding:12px 12px 8px;background:color-mix(in srgb,var(--c) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 35%,var(--line))}
.ssc h4{margin:0 0 6px;font:800 15px var(--display);display:flex;align-items:center;gap:8px}
.goalhead,.goal{display:grid;grid-template-columns:190px 1.3fr 1fr 140px 130px 150px;gap:8px;align-items:center}
.goalhead{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-bottom:6px}
.goal{padding:10px 0;border-top:1px solid var(--line)}
.gname{display:flex;gap:8px;align-items:center;font-weight:700}
.gp{display:flex;align-items:center;gap:8px}
.gp input{flex:1;min-width:0;accent-color:var(--c)}
.gp b{min-width:38px;text-align:right;font-variant-numeric:tabular-nums}
.st{font-weight:600}
.st[data-v="Done"]{background:color-mix(in srgb,var(--green) 22%,var(--field))}
.st[data-v="In progress"]{background:color-mix(in srgb,var(--blue) 22%,var(--field))}
.st[data-v="On hold"]{background:color-mix(in srgb,var(--amber) 28%,var(--field))}
@media (max-width:900px){
  .goalhead{display:none}
  .goal{grid-template-columns:1fr 1fr}
  .gname,.gp{grid-column:1/-1}
}
.hol{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:8px}
.hi{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--field);border-left:4px solid var(--c)}
.hi b{min-width:48px;font-variant-numeric:tabular-nums}
.hi span.n{flex:1;font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.mchip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:6px 12px;font-weight:600;font-size:13.5px;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.mchip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.mchip.on{background:var(--c);border-color:var(--c);color:var(--on)}
.mchip.on::before{background:var(--on)}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.mhead h3{font:800 clamp(22px,4vw,30px) var(--display);margin:0;color:var(--acc)}
.nav2{display:flex;gap:6px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:7px 12px;font-weight:600;font-size:13.5px;cursor:pointer}
.btn:hover{border-color:var(--acc)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dh{font:700 11.5px var(--body);color:var(--muted);text-align:center;padding:2px 0;text-transform:uppercase;letter-spacing:.06em}
.day{min-height:84px;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:5px 6px;display:flex;flex-direction:column;gap:2px;min-width:0}
.day.blank{background:transparent;border-color:transparent}
.day.we .dn{color:var(--coral)}
.day.hn{background:color-mix(in srgb,var(--coral) 13%,var(--surface));border-color:color-mix(in srgb,var(--coral) 45%,var(--line))}
.day.hc{background:color-mix(in srgb,var(--amber) 16%,var(--surface));border-color:color-mix(in srgb,var(--amber) 55%,var(--line))}
.day.today{box-shadow:0 0 0 2px var(--acc)}
.dn{font:800 14px var(--display)}
.hl{font-size:10.5px;line-height:1.15;font-weight:700;color:var(--coral);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.day.hc .hl{color:color-mix(in srgb,var(--amber) 70%,var(--ink))}
.dayin{border:0;border-top:1px dashed transparent;background:transparent;font:inherit;font-size:12.5px;width:100%;padding:3px 0 0;color:var(--ink);outline:none;min-width:0}
.dayin:focus{border-top-color:var(--acc)}
.mlay{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:16px;margin-bottom:16px;align-items:start}
@media (max-width:900px){.mlay{grid-template-columns:minmax(0,1fr)}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
@media (max-width:560px){
  .hl{display:none}
  .day{min-height:62px;padding:4px}
  .dayin{font-size:11px}
}
.wstrip{display:flex;flex-wrap:wrap;gap:5px}
.wb{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:11.5px;font-weight:700;color:var(--muted);cursor:pointer;padding:0}
.wb.fill{background:color-mix(in srgb,var(--c) 30%,var(--surface));color:var(--ink);border-color:color-mix(in srgb,var(--c) 60%,var(--line))}
.wb.on{background:var(--c);color:var(--on);border-color:var(--c)}
.wb.now{box-shadow:0 0 0 2px var(--ink)}
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px}
.dcard{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--field);border-top:4px solid var(--c)}
.dcard.hn{border-top-color:var(--coral)}
.dcard.hc{border-top-color:var(--amber)}
.dcard header{display:flex;justify-content:space-between;gap:6px;align-items:baseline;margin-bottom:6px;font-weight:700}
.dcard header small{color:var(--muted);font-weight:600}
.dcard .f{background:var(--surface)}
.pick{display:flex;gap:6px;flex-wrap:wrap}
.pick button{flex:1;min-width:58px;padding:9px 4px;border-radius:10px;background:var(--field);border:1px solid var(--line);font:600 13px var(--body);color:var(--ink);cursor:pointer}
.pick button.on{background:var(--c);border-color:var(--c);color:var(--on)}
.stars{display:inline-flex;gap:2px}
.stars button{border:0;background:none;padding:0 1px;font-size:22px;line-height:1;color:var(--line);cursor:pointer}
.stars button.on{color:var(--amber)}
.jgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.jd{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--muted);font-weight:700;font-size:13px;cursor:pointer;padding:0;position:relative}
.jd.fill::after{content:"";position:absolute;right:5px;top:5px;width:6px;height:6px;border-radius:50%;background:var(--ink);opacity:.55}
.jd.sel{box-shadow:0 0 0 2px var(--acc)}
.jd.hn{border-color:var(--coral)}
.hwrap,.twrap{overflow-x:auto}
table.hg{border-collapse:separate;border-spacing:0;min-width:100%;font-size:12px}
.hg th,.hg td{padding:3px 2px;text-align:center;font-weight:600;color:var(--muted)}
.hg th.we{color:var(--coral)}
.hg .hn{position:sticky;left:0;z-index:1;background:var(--surface);min-width:190px;text-align:left;padding-right:10px}
.hg .tg{width:58px}
.hg .tg input{text-align:center;padding:6px 2px}
.hname{display:flex;align-items:center;gap:8px}
.hc2{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line);background:var(--field);cursor:pointer;padding:0;display:block;margin:0 auto}
.hc2.on{background:var(--c);border-color:var(--c)}
.hd{min-width:92px;text-align:left!important;padding-left:8px!important;color:var(--ink)!important}
.hd .mb{height:6px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:3px}
.hd .mb i{display:block;height:100%;background:var(--c)}
table.hm{border-collapse:separate;border-spacing:4px;width:100%;font-size:13px}
.hm th{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase}
.hm td{text-align:center;border-radius:8px;padding:8px 2px;font-weight:700;font-variant-numeric:tabular-nums;background:color-mix(in srgb,var(--c) calc(var(--p)*100%),var(--field))}
.hm td.hh{text-align:left;background:none;padding-left:0;white-space:nowrap}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--surface);border:0;border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.tile b{display:block;font:800 clamp(20px,3vw,26px)/1.15 var(--display);font-variant-numeric:tabular-nums}
.tile span{font-size:12.5px;color:var(--muted);font-weight:600}
table.ft{width:100%;border-collapse:collapse;min-width:640px}
.ft th{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:right;padding:6px 6px}
.ft th:first-child,.ft td:first-child{text-align:left}
.ft td{padding:3px 4px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.ft td:first-child{font-weight:700;padding-left:6px;white-space:nowrap}
.ft td input{text-align:right}
.ft td.calc{text-align:right;padding:3px 8px;font-weight:700}
.ft tfoot td{font-weight:800;border-top:2px solid var(--ink)}
.pos{color:var(--green)}.neg{color:var(--coral)}
.bars{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:8px;align-items:end;height:160px;margin-top:8px}
.bcol{display:flex;gap:3px;align-items:end;height:100%}
.bcol i{flex:1;border-radius:5px 5px 0 0;min-height:2px}
.bl{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:8px;margin-top:6px;font-size:11.5px;color:var(--muted);text-align:center;font-weight:600}
.fgoal{display:grid;grid-template-columns:130px 1fr 1fr 1.3fr;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.fgoal .pb{height:10px;border-radius:99px;background:var(--soft);overflow:hidden}
.fgoal .pb i{display:block;height:100%;background:var(--c);border-radius:99px}
.fgoal .pt{font-size:12px;color:var(--muted);margin-top:3px}
@media (max-width:700px){.fgoal{grid-template-columns:1fr 1fr}.fgoal>:first-child,.fgoal>:last-child{grid-column:1/-1}}
.book{display:grid;grid-template-columns:1.5fr 1fr 130px 130px 120px 1.5fr;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.bookh{display:grid;grid-template-columns:1.5fr 1fr 130px 130px 120px 1.5fr;gap:8px;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
@media (max-width:900px){.bookh{display:none}.book{grid-template-columns:1fr 1fr}.book>:first-child,.book>:last-child{grid-column:1/-1}}
.bar{height:10px;border-radius:99px;background:var(--soft);overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.foot{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:13px}
.foot .grow{flex:1;min-width:200px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:no-preference){.f,.tab,.mchip,.btn{transition:background-color .15s,border-color .15s,box-shadow .15s}}

.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--on)}
.btn.pri:hover{filter:brightness(.95)}
.lnk{border:0;background:none;color:var(--acc);font:inherit;font-weight:700;cursor:pointer;padding:0;text-decoration:underline}
.x{border:0;background:none;color:var(--muted);font-size:22px;line-height:1;cursor:pointer;padding:2px 8px;border-radius:8px;flex:none}
.x:hover{color:var(--coral)}
.x.arm{color:#fff;background:var(--coral);font-size:12px;font-weight:700;padding:4px 8px}
.qa{display:grid;grid-template-columns:1fr 190px 150px auto;gap:8px;margin:10px 0 0}
@media (max-width:820px){.qa{grid-template-columns:1fr 1fr}.qa>:first-child{grid-column:1/-1}.qa .btn{grid-column:1/-1}}
.hlcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px;margin-top:14px}
.it{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--field);margin-bottom:6px;border-left:4px solid var(--c);min-width:0}
.itb{width:100%;border-top:0;border-right:0;border-bottom:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.itb:hover{background:var(--soft)}
.it .itx{flex:1;min-width:0;overflow-wrap:anywhere}
.it .itx.done{text-decoration:line-through;color:var(--muted)}
.it small{color:var(--muted);font-weight:600;white-space:nowrap;font-size:12px}
.ycal{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:14px}
.mini{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:14px;padding:10px 10px 12px;box-shadow:var(--shadow)}
.mt{border:0;background:none;font:800 17px var(--display);color:var(--c);cursor:pointer;padding:2px 4px 8px}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.mg .dw{font-size:10.5px;text-align:center;color:var(--muted);font-weight:700;padding-bottom:2px}
.md{aspect-ratio:1/1;border:0;background:transparent;border-radius:8px;font:600 12.5px var(--body);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0;min-width:0}
.md:hover{background:var(--soft)}
.md.we{color:var(--coral)}
.md.hn{background:color-mix(in srgb,var(--coral) 20%,transparent)}
.md.hc{background:color-mix(in srgb,var(--amber) 26%,transparent)}
.md.today{box-shadow:inset 0 0 0 2px var(--acc)}
.md.sel{outline:2px solid var(--ink);outline-offset:-2px}
.mdots{display:flex;gap:2px;height:5px;justify-content:center}
.mdots i,.dots i{width:5px;height:5px;border-radius:50%;background:var(--c)}
button.day{text-align:left;font:inherit;color:inherit;cursor:pointer;min-height:76px}
button.day:hover{border-color:var(--acc)}
button.day.sel{outline:2px solid var(--ink);outline-offset:1px}
.dots{display:flex;gap:3px;margin-top:auto;flex-wrap:wrap}
.dots i{width:9px;height:9px}

function build(){
  var byDate={},tasks=[],undated=[],notes=[];
  function add(n){
    notes.push(n);
    if(n.c==='todo')tasks.push(n);
    if(n.d)(byDate[n.d]=byDate[n.d]||[]).push(n);else if(n.c==='todo')undated.push(n);
  }
  YEARS.forEach(function(y){
    var ed=DNy('ev',y),o=S[ed]||{},tdd=DNy('td',y),t=S[tdd]||{};
    Object.keys(o).sort().forEach(function(k){
      var v=o[k];if(k.charAt(0)!=='e'||!v||typeof v!=='object')return;
      var c=String(v.c==null?'0':v.c);
      if(!v.d&&c!=='todo')return;
      add({id:k,doc:ed,tf:'t',t:v.t||'',c:c,d:v.d||'',k:v.k?1:0,l:Array.isArray(v.l)?v.l:[]});
    });
    Object.keys(t).sort().forEach(function(k){
      var v=t[k];if(k.charAt(0)!=='t'||!v||typeof v!=='object')return;
      add({id:k,doc:tdd,tf:'x',t:v.x||'',c:'todo',d:v.d||'',k:v.k?1:0,l:Array.isArray(v.l)?v.l:[]});
    });
  });
  return {byDate:byDate,tasks:tasks,undated:undated,notes:notes};
}

function jList(ds){
  var o=S[jdocD(ds)]||{},r=[];
  Object.keys(o).forEach(function(k){var v=o[k];if(k.charAt(0)==='e'&&v&&typeof v==='object'&&v.d===ds)r.push({id:k,tm:v.tm||'',at:v.at||0,x:v.x||'',d:v.d,k:v.k||'log',a:+v.a||0,r:+v.r||0,to:v.to||'',v:v.v||'',s:v.s||'',te:v.te||'',du:v.du||''});});

function entryFrom(base,kind,o){
  var e={d:base.d,tm:base.tm,at:base.at,x:o.x||''};
  if(base.du)e.du=base.du;
  if(kind!=='log')e.k=kind;

  if(kind==='ac')e.s=o.s||'prog';

}

function hChecks(i,m){return get(hdocY(YEAR),'c'+i+'_'+m,'');}
function hRemove(i){
  var n=hcount(),o=S.hab||(S.hab={}),j,m;
  for(j=i;j<n-1;j++){
    ['n','t'].forEach(function(p){var v=o[p+(j+1)];if(v===undefined)delete o[p+j];else o[p+j]=v;});
  }
  delete o['n'+(n-1)];delete o['t'+(n-1)];o.cnt=String(n-1);dirty.hab=1;
  var cf2=S.cfg;if(cf2){for(j=i;j<n-1;j++){var cvv=cf2['ch'+(j+1)];if(cvv===undefined)delete cf2['ch'+j];else cf2['ch'+j]=cvv;}delete cf2['ch'+(n-1)];dirty.cfg=1;}
  YEARS.forEach(function(y){
    var id=hdocY(y),d=S[id];if(!d)return;
    for(j=i;j<n-1;j++)for(m=0;m<12;m++){var v2=d['c'+(j+1)+'_'+m];if(v2===undefined)delete d['c'+j+'_'+m];else d['c'+j+'_'+m]=v2;}
    for(m=0;m<12;m++)delete d['c'+(n-1)+'_'+m];
    dirty[id]=1;
  });
  schedule();render();
}
function hMatrix(){
  var N=hcount(),h='',i,m;
  for(i=0;i<N;i++){
    var tot=0,t=hTarget(i),cells='';
    for(m=0;m<12;m++){var n=ones(hChecks(i,m));tot+=n;var p=t>0?Math.min(n/t,1):0;cells+='<div class="yc" style="--p:'+p.toFixed(2)+'"><small>'+MON3[m]+'</small><b>'+(n||'–')+'</b></div>';}
    h+='<div class="yrow" style="--c:'+hcl(i)+'"><div class="yhead"><span class="hnm"><i class="dot"></i> '+esc(hLabel(i))+'</span><span class="ytot">'+tot+' check-ins</span></div><div class="ygr">'+cells+'</div></div>';
  }
  return h;
}
function vHabits(){
  var m=parseD(UI.sel).m,n=dim(m),fd=firstDow(m),N=hcount(),cards='',i,d,b;
  var hdr=DOWL.map(function(x,ci){return '<span class="hw'+(isWE(ci)?' we':'')+'">'+x+'</span>';}).join('');
  for(i=0;i<N;i++){
    var s=hChecks(i,m),g=hdr;
    for(b=0;b<fd;b++)g+='<span></span>';
    for(d=1;d<=n;d++){var on=s.charAt(d-1)==='1';g+='<button type="button" class="hc2'+(on?' on':'')+'" data-h="'+i+'" data-d="'+d+'" aria-pressed="'+on+'" aria-label="'+esc(hLabel(i))+' tanggal '+d+'">'+d+'</button>';}
    cards+='<section class="card hcard" style="'+cv(hcl(i))+';--cc:'+hcl(i)+'"><div class="hhead"><span class="hnm"><i class="dot"></i> '+esc(hLabel(i))+'</span><span class="hsm" id="hd'+i+'"></span></div><div class="hgr">'+g+'</div></section>';
  }
  return vh('Habit Tracker','Ketuk tanggal yang habitnya berhasil. Nama habit dan target per bulan diatur di tab Setup.')+
  '<p class="hint" style="margin:-6px 0 10px">Bulan: <b>'+MONTHS[m]+' '+YEAR+'</b> · <button type="button" class="lnk" data-go="monthly">ganti di Monthly</button> · <button type="button" class="lnk" data-go="setup">atur habit di Setup</button></p>'+
  '<div class="mhead" style="margin-bottom:10px"><h3 style="color:'+mc(m)+'">'+MONTHS[m]+'</h3><span class="pill" style="--c:'+mc(m)+'" id="hsum"></span></div>'+
  '<div class="hgrid">'+cards+'</div>'+
  '<section class="card" style="--cc:#22B573;margin-top:16px"><h3>Year overview</h3><div class="hwrap" id="hmat">'+hMatrix()+'</div></section>';
}
function aHabits(){
  var m=parseD(UI.sel).m,tot=0,tt=0,N=hcount();
  for(var i=0;i<N;i++){
    var n=ones(hChecks(i,m)),t=hTarget(i),p=t>0?Math.min(100,Math.round(n/t*100)):0;tot+=n;tt+=t;
    var e=$('#hd'+i);if(e)e.innerHTML=n+'/'+t+' · '+p+'%<div class="mb"><i style="width:'+p+'%"></i></div>';
  }
  var s=$('#hsum');if(s)s.textContent=tot+' check-ins · '+(tt?Math.round(Math.min(tot,tt)/tt*100):0)+'% dari target';
  var mx=$('#hmat');if(mx)mx.innerHTML=hMatrix();
}

/* ---------- Overview ---------- */
function vOverview(){
  var ix=build(),M=[],m,i,N=hcount(),T=TYPES(),tc={};
  for(m=0;m<12;m++)M.push({ev:0,td:0,tdone:0,jr:0,days:{},hb:0,sp:0});
  var X={ev:0,td:0,tdone:0,jr:0,days:0,hb:0,sp:0},over=0;
  ix.notes.forEach(function(n){
    if(n.d?!sameYear(n.d):(n.doc!==DN('ev')&&n.doc!==DN('td')))return;
    var mm=n.d?parseD(n.d).m:-1;
    if(n.c==='todo'){X.td++;if(n.k)X.tdone++;else if(n.d&&n.d<NOWS)over++;if(mm>=0){M[mm].td++;if(n.k)M[mm].tdone++;}}
    else{X.ev++;var id=typeOf(n.c).id;tc[id]=(tc[id]||0)+1;if(mm>=0)M[mm].ev++;}
  });
  for(m=0;m<12;m++){
    var jo=S[jdoc(m)]||{};
    Object.keys(jo).forEach(function(k){var v=jo[k];if(k.charAt(0)==='e'&&v&&typeof v==='object'&&v.d){M[m].jr++;M[m].days[v.d]=1;}});
    M[m].sp=monthSpend(m);
    for(i=0;i<N;i++)M[m].hb+=ones(hChecks(i,m));
  }
  M.forEach(function(x){X.jr+=x.jr;X.days+=Object.keys(x.days).length;X.hb+=x.hb;X.sp+=x.sp;});
  var tgt=0;for(i=0;i<N;i++)tgt+=hTarget(i)*12;
  var hn=0,hc=0;holEntries(YEAR).forEach(function(e){if(e.k==='n')hn++;else hc++;});
  var pt={};Object.keys(tc).forEach(function(id){var nm=tname(typeOf(id));pt[nm]=(pt[nm]||0)+tc[id];});
  var perType=Object.keys(pt).map(function(nm){return esc(nm)+' '+pt[nm];}).join(' · ')||'Belum ada catatan';
  var tiles=[
    ['Catatan di Monthly',X.ev,perType,TYCOL[0]],
    ['To-do selesai',X.tdone+'/'+X.td,over?over+' lewat tenggat':'Tidak ada yang terlambat','#14B8C4'],
    ['Entri Journal',X.jr,X.days+' hari ada catatan','#F5A524'],
    ['Spending (Journal)',fmtRp(X.sp),'Total tahun '+YEAR,'#22B573'],
    ['Habit check-ins',X.hb,(tgt?Math.round(Math.min(X.hb,tgt)/tgt*100):0)+'% dari target setahun','#22B573'],
    ['Libur & cuti bersama',(hn+hc)+' hari',hn+' libur nasional · '+hc+' cuti bersama','#EF4444']
  ].map(function(t){return '<div class="tile" style="--c:'+t[3]+'"><span>'+t[0]+'</span><b>'+t[1]+'</b><em class="ts">'+t[2]+'</em></div>';}).join('');
  var rows=M.map(function(x,mm){
    var z=function(n){return n?n:'–';},bs=budState(mm);
    var spc=x.sp?'<span class="'+(bs.st==='warn'||bs.st==='over'?'wn':'')+'">'+fmtRp(x.sp)+'</span>'+(bs.b?'<em class="ts">dari '+fmtRp(bs.b)+'</em>':''):'–';
    return '<tr style="--c:'+mc(mm)+'"><td class="mn"><button type="button" class="lnk" data-gom="'+mm+'" style="text-decoration:none;color:var(--ink)"><i class="dot"></i> '+MONTHS[mm]+'</button></td><td>'+z(x.ev)+'</td><td>'+(x.td?x.tdone+'/'+x.td:'–')+'</td><td>'+z(x.jr)+'</td><td>'+spc+'</td><td>'+z(x.hb)+'</td></tr>';
  }).join('');
  var habs='';
  for(i=0;i<N;i++){
    var tot=0;for(m=0;m<12;m++)tot+=ones(hChecks(i,m));
    var tt=hTarget(i)*12,p=tt?Math.min(100,Math.round(tot/tt*100)):0;
    habs+='<div class="li hb" style="--c:'+hcl(i)+'"><i class="dot"></i><span class="lit">'+esc(hLabel(i))+'</span><span class="hbn">'+tot+' check-ins · '+p+'%</span><div class="pb"><i style="width:'+p+'%;background:'+hcl(i)+'"></i></div></div>';
  }
  return vh('Overview','Rangkuman tahun '+YEAR+', dihitung otomatis dari isianmu.')+
  '<div class="tiles">'+tiles+'</div>'+
  '<section class="card" style="--cc:#EF4444;margin-bottom:16px"><h3>Per bulan</h3><div class="twrap"><table class="ft ov"><thead><tr><th>Bulan</th><th>Catatan</th><th>To-do</th><th>Journal</th><th>Spending</th><th>Habit</th></tr></thead><tbody>'+rows+'</tbody></table></div></section>'+
  '<section class="card" style="--cc:#22B573"><h3>Habit</h3>'+habs+'</section>';
}

function vGuide(){
  var sec=function(t,body,open){return '<details'+(open?' open':'')+'><summary>'+t+'</summary>'+body+'</details>';};
  return vh('Panduan')+'<div class="guide">'+
  sec('Mulai cepat','<ul><li>Semua isian tersimpan otomatis di perangkat ini.</li><li>Ganti tahun lewat tombol 2026–2030 di atas.</li><li>Roda gigi di pojok kanan atas membuka Setup. Ketuk lagi untuk kembali.</li></ul>'+gimg('setup','Tampilan Setup'),true)+
  sec('Beranda','<ul><li>Kolom di atas untuk catatan cepat tanpa tanggal. Hasilnya berupa to-do tanpa tanggal.</li><li>Kalender setahun hanya untuk dilihat. Ketuk nama bulan untuk membukanya di Monthly.</li></ul>'+gimg('calendar','Tampilan Beranda'))+
  sec('Monthly','<ul><li>Ketuk satu kali untuk memilih tanggal, dua kali untuk menambah catatan di tanggal itu.</li><li>Teks catatan bisa diedit langsung di daftar. Ketuk tombol tiga titik untuk sub-list, ganti tanggal, atau hapus.</li><li>Centang to-do untuk menandai selesai. Selesai tercatat otomatis di Journal dengan jam saat itu.</li><li>Isi budget cap di kartu Budget. Spending dihitung dari Journal; peringatan muncul saat mencapai 90%.</li></ul>'+gimg('monthly','Tampilan Monthly'))+
  sec('Journal','<ul><li>Pilih jenis entri lalu tulis di kotak Log. Jam terekam otomatis.</li><li>Aktivitas dan Travel: jam rekam dianggap jam selesai. Isi Mulai bila ingin rentang waktu.</li><li>Ketuk dua kali sebuah catatan untuk mengubah jam, isi, atau menghapus.</li><li>To-do di tanggal itu tampil di bawah kotak Log. Mencentangnya menambah entri &ldquo;Selesai: &hellip;&rdquo;; menghapus centang menghapus entri itu.</li></ul>'+gimg('journal','Tampilan Journal'))+
  sec('Habit','<ul><li>Nama dan target habit diatur di Setup.</li><li>Ketuk tanggal untuk menandai habit berhasil di bulan yang dipilih.</li></ul>'+gimg('habits','Tampilan Habit Tracker'))+
  sec('Overview','<ul><li>Rangkuman tahun yang dihitung otomatis: catatan, to-do selesai, entri Journal, spending, dan habit.</li><li>Tabel per bulan memperlihatkan bulan mana yang melewati budget.</li></ul>'+gimg('overview','Tampilan Overview'))+
  sec('Warna dan jenis catatan','<ul><li>Setup &rarr; Warna: pilih warna bulan, tahun, tab, dan aksen dari palet lengkap.</li><li>Warna habit dan jenis catatan dipilih di barisnya masing-masing.</li><li>To-do adalah jenis bawaan. Jenis lain bisa ditambah di Setup.</li></ul>')+
  sec('Backup dan pindah data','<ul><li>Export membuka share sheet. Simpan file ke Files atau Drive.</li><li>Import mengganti bagian yang sama dengan isi file. Export dan Import mencakup semua tahun.</li></ul>')+
  sec('Sync Google Drive terenkripsi','<ol><li>Buka console.cloud.google.com dan buat project baru.</li><li>APIs &amp; Services &rarr; Library &rarr; aktifkan <b>Google Drive API</b>.</li><li>OAuth consent screen &rarr; External. Tambahkan scope <b>drive.appdata</b> dan akun Google-mu sebagai Test user. Tekan Publish app agar izin tidak kedaluwarsa tiap 7 hari.</li><li>Credentials &rarr; Create credentials &rarr; OAuth client ID &rarr; Web application. Di Authorized JavaScript origins isi: <b>'+esc(location.protocol==='file:'?'(alamat https tempat planner ini dihosting)':location.origin)+'</b></li><li>Salin Client ID ke Setup &rarr; Sync, isi kata sandi enkripsi (minimal 8 karakter), lalu Sambungkan.</li></ol><ul><li>Data dienkripsi di perangkat sebelum dikirim. Kalau kata sandi hilang, data di Drive tidak bisa dipulihkan.</li><li>Planner harus dibuka lewat alamat https, bukan dari file lokal.</li><li>Tiap bagian data memakai versi yang terbaru. Dua perangkat yang mengedit bagian yang sama saat offline bisa saling menimpa.</li></ul>')+
  '</div>';
}

}
async function driveGet(fid){var r=await dfetch('https://www.googleapis.com/drive/v3/files/'+fid+'?alt=media');return r.text();}
async function drivePut(fid,body){
  if(fid){await dfetch('https://www.googleapis.com/upload/drive/v3/files/'+fid+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body:body});return fid;}
  var bd='plannerbd'+Date.now(),meta=JSON.stringify({name:FNAME,parents:['appDataFolder'],mimeType:'application/json'});
  var mp='--'+bd+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+meta+'\r\n--'+bd+'\r\nContent-Type: application/json\r\n\r\n'+body+'\r\n--'+bd+'--';
  var r=await dfetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+bd},body:mp}),j=await r.json();
  return j.id;
}
function mergeRemote(rem){
  var ch=false,push=false,ids={},has=function(o,k){return !!o&&Object.prototype.hasOwnProperty.call(o,k);};
  Object.keys(S).forEach(function(k){ids[k]=1;});Object.keys(rem.docs||{}).forEach(function(k){if(/^[A-Za-z0-9_-]{1,40}$/.test(k))ids[k]=1;});
  Object.keys(ids).forEach(function(id){
    var hr=has(rem.docs,id),hl=has(S,id),rm=hr?(+(rem.mt&&rem.mt[id])||0):-1,lm=hl?(MT[id]||0):-1;
    if(hr&&(!hl||rm>lm)){
      var nv=rem.docs[id];if(!nv||typeof nv!=='object'||Array.isArray(nv))return;
      if(!hl||JSON.stringify(S[id])!==JSON.stringify(nv)){S[id]=nv;ch=true;}
      LASTJ[id]=JSON.stringify(S[id]);MT[id]=rm;
    }else if(hl&&(!hr||lm>rm))push=true;
  });
  return {changed:ch,push:push};
}
function syErr(e,interactive){
  if(!e)return 'Sync gagal.';
  if(e.code==='bad_pass')return 'Kata sandi salah, atau file di Drive dibuat dengan kata sandi lain.'+(SY.sh?' Lupa? Reset data Drive di halaman index.':'');
  if(e.code==='bad_file')return 'File di Drive bukan milik planner ini.';
  if(e.code==='auth')return interactive?'Tidak bisa masuk ke Google'+(e.detail?' ('+e.detail+')':'')+'. Cek Client ID, origin, dan izin pop-up.':'Ketuk status untuk menyambung ke Google.';
  if(e.code==='http')return e.status===403?'Google menolak (403). Pastikan Drive API aktif dan akunmu terdaftar sebagai test user.':'Drive error '+e.status+'.';
  if(e.code==='net'||e instanceof TypeError)return 'Tidak ada koneksi ke Google.';
  return 'Sync gagal.';
}
function syUI(){var m=$('#sy-msg');if(m)m.textContent=SY.msg||'';}
async function syncNow(interactive){
  if(SY.busy)return;
  adoptShared();
  if(!SY.cid||!SY.pass){SY.msg='Isi Client ID dan kata sandi di Setup.';syUI();return;}
  if(!(window.crypto&&crypto.subtle)){SY.msg='Enkripsi butuh koneksi aman. Buka planner lewat https.';syUI();return;}
  SY.busy=true;clearTimeout(syT);setStatus('syncing');SY.msg='Menyinkronkan…';syUI();
  try{
    await getToken(interactive);
    var fid=await driveFind(),ctx=null,rem=null;
    if(fid){var d=await decPayload(await driveGet(fid));rem=d.obj;ctx=d.ctx;}
    if(!SY.on&&rem){try{localStorage.setItem('planner2027.prebackup',JSON.stringify(S));}catch(e){}}
    var res=rem?mergeRemote(rem):{changed:false,push:true};
    if(res.push||!fid){
      var docs={},mt={};Object.keys(S).forEach(function(id){docs[id]=S[id];mt[id]=MT[id]||(MT[id]=Date.now());});
      await drivePut(fid,await encPayload({v:1,docs:docs,mt:mt},ctx));
    }
    SY.on=true;SY.last=Date.now();SY.pending=false;SY.msg='Tersinkron '+hm(SY.last)+(res.changed?' · data dari perangkat lain dimuat.':'.');saveSY();saveLocal();
    setStatus('cloud');
    if(res.changed){applyCfg();rerenderSoon();}
  }catch(e){
    SY.pending=true;SY.msg=syErr(e,interactive);
    if(e&&e.code==='auth'&&!interactive)setStatus('pending');else setStatus('error');
  }finally{SY.busy=false;syUI();if(UI.view==='setup'&&!$('#sy-msg'))return;}
}
function syncSoon(){clearTimeout(syT);syT=setTimeout(function(){if(SY.on)syncNow(false);},4000);}
function syncConnect(){
  var cid=($('#sy-cid').value||'').trim(),pw=$('#sy-pass').value||SY.pass,rem=$('#sy-rem').checked;
  if(!/\.apps\.googleusercontent\.com$/.test(cid)){SY.msg='Client ID tidak valid. Biasanya berakhir .apps.googleusercontent.com';syUI();$('#sy-cid').focus();return;}
  if(pw.length<8){SY.msg='Kata sandi minimal 8 karakter.';syUI();$('#sy-pass').focus();return;}
  if(cid!==SY.cid)TOK=null;
  SY.cid=cid;SY.pass=pw;SY.rem=rem;saveSY();
  syncNow(true);
}
function syncOff(){SY.on=false;TOK=null;SY.msg='Sync dimatikan. Data di Drive tetap ada.';saveSY();setStatus('local');render();}
function syncCard(){
  if(SY.sh)return '<section class="card" style="--cc:#3B82F6"><h3>Sync Google Drive (terenkripsi)</h3>'+
    '<p class="hint" style="margin:0 0 10px">Memakai login dari halaman index.</p>'+

    '<p class="hint" id="sy-msg" style="margin:4px 0 0">'+esc(SY.msg||(SY.last?'Terakhir sync '+hm(SY.last)+'.':'Belum tersinkron.'))+'</p></section>';
  var on=SY.on,origin=location.protocol==='file:'?'(tidak ada: file lokal)':location.origin;
  return '<section class="card" style="--cc:#3B82F6"><h3>Sync Google Drive (terenkripsi)</h3>'+
    ''+
    lab('Client ID Google')+'<input class="f" id="sy-cid" value="'+esc(SY.cid)+'" placeholder="xxxx.apps.googleusercontent.com" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Client ID Google">'+
    lab('Kata sandi enkripsi')+'<input class="f" id="sy-pass" type="password" value="'+esc(SY.pass)+'" placeholder="Minimal 8 karakter" autocomplete="new-password" aria-label="Kata sandi enkripsi">'+
    '<label class="nodate"><input type="checkbox" id="sy-rem"'+(SY.rem?' checked':'')+'> Ingat kata sandi di perangkat ini</label>'+
    '<div class="row" style="flex-wrap:wrap;margin:10px 0 6px"><button type="button" class="btn pri" id="sy-go">'+(on?'Simpan &amp; sync sekarang':'Sambungkan')+'</button>'+(on?'<button type="button" class="btn" id="sy-off">Putuskan</button>':'')+'</div>'+
    '<p class="hint" id="sy-msg" style="margin:4px 0 8px">'+esc(SY.msg||(on&&SY.last?'Terakhir sync '+hm(SY.last)+'.':'Belum tersambung.'))+'</p>'+
    '<details class="syhelp"><summary>Cara mendapat Client ID (sekali saja)</summary><ol>'+
      '<li>Buka console.cloud.google.com, buat project baru.</li>'+
      '<li>APIs &amp; Services &rarr; Library &rarr; aktifkan <b>Google Drive API</b>.</li>'+
      '<li>OAuth consent screen &rarr; External. Tambahkan <b>drive.appdata</b> sebagai scope dan akun Google-mu sebagai Test user. Agar izin tidak kedaluwarsa tiap 7 hari, tekan Publish app (scope ini tidak butuh verifikasi).</li>'+
      '<li>Credentials &rarr; Create credentials &rarr; OAuth client ID &rarr; Web application. Pada Authorized JavaScript origins isi: <b>'+esc(origin)+'</b></li>'+
      '<li>Salin Client ID-nya ke kolom di atas.</li></ol>'+
      '</details></section>';
}

(function(){
  var vv=window.visualViewport;
  function fit(){
    var el=$('.mdl');if(!el||!vv)return;
    el.style.top=vv.offsetTop+'px';el.style.bottom='auto';el.style.height=vv.height+'px';
    var c=$('.mdlc',el);if(c)c.style.maxHeight=Math.max(200,vv.height-16)+'px';
  }
  if(vv){vv.addEventListener('resize',fit);vv.addEventListener('scroll',fit);}
  function isField(t){return t&&/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)&&t.type!=='checkbox'&&t.type!=='radio'&&t.type!=='file';}
  document.addEventListener('focusin',function(e){
    var t=e.target;if(!isField(t))return;
    document.body.classList.add('kb');fit();
    setTimeout(function(){if(document.activeElement===t&&!t.closest('.mdl')){try{t.scrollIntoView({block:'center',behavior:'smooth'});}catch(x){}}fit();},350);
  });
  document.addEventListener('focusout',function(){setTimeout(function(){if(!isField(document.activeElement))document.body.classList.remove('kb');},120);});
})();
