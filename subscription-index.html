<style>
:root{--on:#fff;--bg:#f2f2f7;--card:#fff;--tx:#000;--tx2:#6c6c70;--sep:rgba(60,60,67,.18);--ac:#007aff;--seg:rgba(118,118,128,.12);--segon:#fff;--red:#ff3b30;--green:#248a3d;--orange:#c93400;--bar:rgba(249,249,249,.82)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#1c1c1e;--tx:#fff;--tx2:#98989f;--sep:rgba(84,84,88,.6);--seg:rgba(118,118,128,.24);--segon:#636366;--green:#30d158;--orange:#ff9f0a;--bar:rgba(30,30,30,.82)}}
:root[data-theme="dark"]{--bg:#000;--card:#1c1c1e;--tx:#fff;--tx2:#98989f;--sep:rgba(84,84,88,.6);--seg:rgba(118,118,128,.24);--segon:#636366;--green:#30d158;--orange:#ff9f0a;--bar:rgba(30,30,30,.82)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
body{padding-top:env(safe-area-inset-top);padding-bottom:calc(30px + env(safe-area-inset-bottom));min-height:100vh;-webkit-user-select:none;user-select:none}
body.hasbar{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
body.kb .tabbar{display:none}
body.kb.hasbar{padding-bottom:30px}
#top{display:flex;align-items:center;justify-content:space-between;height:44px;padding:0 16px}
#top button{border:0;background:transparent;color:var(--ac);font:inherit;font-size:20px;font-weight:600;padding:6px 4px;min-width:40px}
#top svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;display:block}
h1{font-size:34px;font-weight:800;letter-spacing:-.4px;margin:0;padding:6px 20px 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#st{display:block;border:0;background:transparent;color:var(--ac);font:inherit;font-size:14px;font-weight:600;padding:2px 20px 12px;text-align:left;min-height:22px}
#st.err{color:var(--red)}
#view{padding:8px 16px 0}
.sec{font-size:13px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.3px;padding:4px 16px 8px}
.card{background:var(--card);border-radius:14px;margin:0 0 16px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;min-height:52px;padding:9px 16px;border-top:.5px solid var(--sep)}
.row:first-child{border-top:0}
.row.tap{cursor:pointer}
.row .nm{flex:1;min-width:0;font-size:17px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{font-size:13px;color:var(--tx2);font-weight:500;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub.soon{color:var(--orange);font-weight:700}
.row .lb{font-size:16px;font-weight:600;flex:none}
.row .val{font-size:16px;font-weight:700;flex:none;text-align:right}
.row .val.mut{color:var(--tx2);font-weight:600}
.row .val.up{color:var(--red)}
.row .val.dn{color:var(--green)}
.ib{flex:none;width:34px;height:34px;border:0;border-radius:17px;background:var(--seg);color:var(--tx);font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0}
.seg{display:flex;background:var(--seg);border-radius:9px;padding:2px;flex:1;min-width:0}
.seg button{flex:1;min-width:0;border:0;background:transparent;color:var(--tx);font:inherit;font-size:14px;font-weight:600;padding:7px 4px;border-radius:7px}
.seg button.on{background:var(--segon);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:50px;border:0;border-radius:14px;background:var(--ac);color:var(--on);font:inherit;font-size:17px;font-weight:700;margin:0 0 16px}
.btn.sec2{background:var(--card);color:var(--ac)}
.btn.red{color:var(--red)}
.btn:disabled{opacity:.35}
.btn.sm{height:34px;width:auto;padding:0 14px;font-size:15px;border-radius:17px;margin:0;flex:none}
.btn.sm.sec2{background:var(--seg)}

.bar{height:8px;border-radius:4px;background:var(--seg);overflow:hidden;margin-top:7px}

.srow{padding:12px 16px;border-top:.5px solid var(--sep)}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:6px 10px 14px}
.wk{text-align:center;font-size:12px;color:var(--tx2);font-weight:700;padding:4px 0}
.cd{aspect-ratio:1/1.1;border:0;border-radius:10px;background:transparent;color:var(--tx);font:inherit;font-size:16px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0}
.cd.td{box-shadow:inset 0 0 0 2px var(--ac)}
.cd.sel{background:var(--ac);color:var(--on)}
.cd.em{visibility:hidden}
.dots{display:flex;gap:3px;height:6px}
.dots i{width:6px;height:6px;border-radius:3px;background:var(--ac)}
.cd.sel .dots i{background:#fff}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:10}
.tabbar button{flex:1;border:0;background:transparent;color:var(--tx2);font:inherit;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0}
.tabbar button.on{color:var(--ac)}
.tabbar svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bk{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:40}
.sh{position:fixed;left:0;right:0;bottom:0;max-height:90vh;background:var(--bg);border-radius:16px 16px 0 0;z-index:41;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.shh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;flex:none}
.shh b{font-size:17px}
.lnk{border:0;background:transparent;color:var(--ac);font:inherit;font-size:17px;font-weight:500;padding:4px;min-width:60px}
.lnk.b{font-weight:700;text-align:right}
.lnk:first-child{text-align:left}
.shb{overflow:auto;padding:0 16px 24px;-webkit-overflow-scrolling:touch}
.pal{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;padding:8px 0}
.sw{aspect-ratio:1;border-radius:50%;border:3px solid transparent}
.sw.on{border-color:var(--tx)}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-140px);background:#2c2c2e;color:#fff;padding:12px 18px;border-radius:14px;font-size:15px;font-weight:600;max-width:88vw;z-index:60;transition:transform .25s}
.toast.show{transform:translate(-50%,0)}
.gh{padding:14px 16px;font-size:17px;font-weight:700;display:flex;justify-content:space-between;width:100%;border:0;background:transparent;color:var(--tx);font-family:inherit;text-align:left}
.gb{padding:0 16px 22px;font-size:15px;line-height:1.5}
.gb img{width:100%;max-width:340px;display:block;margin:12px auto 0;border-radius:12px;border:.5px solid var(--sep)}
.gb ol{margin:0;padding-left:20px}
.tri{width:10px;height:10px;fill:var(--tx2);flex:none;align-self:center}
#top button{display:flex;align-items:center}
#top svg.tri{fill:currentColor;stroke:none;width:11px;height:11px;margin-right:7px}
.ic{width:18px;height:18px;display:block;flex:none}
.ib .tri{fill:var(--tx)}
a.row .ic{width:22px;height:22px;color:var(--ac)}

.scard{background:var(--card);border-radius:14px;padding:16px;margin:0 0 16px;overflow:hidden}
.scard h3{font-size:17px;font-weight:600;line-height:1.2;margin:0 0 10px}
.scard .hint{color:var(--tx2);font-size:13px;margin:0 0 10px;line-height:1.4}
.lab{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--tx2);margin:14px 0 6px}
.scard h3+.lab{margin-top:4px}
.scard input.f{display:block;width:100%;flex:none;text-align:left;border:0;border-radius:10px;background:var(--bg);padding:10px 12px;font:inherit;font-size:16px;font-weight:500;color:var(--tx);outline:0;-webkit-user-select:text;user-select:text}
.scard input.f:focus{box-shadow:0 0 0 2px var(--ac)}
.scard .lst{margin:0 -16px}
.mchips,.swrow,.brow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.swrow{gap:10px}
.mchip{border:0;background:var(--seg);color:var(--tx);font:inherit;font-size:14px;font-weight:600;padding:7px 12px;border-radius:99px}
.mchip.on{background:var(--ac);color:var(--on)}
.swb{width:30px;height:30px;border-radius:50%;border:2px solid var(--card);background:var(--c);box-shadow:0 0 0 1px var(--sep);padding:0;flex:none}
.swb.on{box-shadow:0 0 0 2px var(--tx)}
.swb.more{background:conic-gradient(#EF4444,#F5A524,#84CC16,#14B8C4,#3B82F6,#A855F7,#EC4899,#EF4444)}
.swb.more.cus{background:var(--c)}
.bt{border:0;background:var(--seg);border-radius:10px;padding:9px 14px;font:inherit;font-weight:600;font-size:15px;color:var(--ac)}
.bt.pri{background:var(--ac);color:var(--on)}
.bt.red{color:var(--red)}
.tapc{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--tx);text-decoration:none;padding:14px 16px;cursor:pointer}
.tapc b{font-size:17px;font-weight:600}
.tapc svg:not(.tri){width:22px;height:22px;flex:none;color:var(--ac);fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pkg{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;padding:4px 0}
.pks{height:38px;border-radius:10px;border:2px solid var(--bg);background:var(--c);box-shadow:0 0 0 1px var(--sep);padding:0}
.pks.on{box-shadow:0 0 0 3px var(--tx)}
svg.tri{width:16px;height:16px;fill:none!important;stroke:currentColor!important;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;color:var(--tx2);flex:none}
#top svg.tri{width:20px;height:20px;margin-right:2px;color:inherit}
.ib svg.tri{width:16px;height:16px;color:var(--tx)}
</style>
</head>
<body>
<div id="top"></div>
<h1 id="ttl"></h1>
<button id="st"></button>
<div id="view"></div>
<nav class="tabbar" id="tabs" style="display:none"></nav>
<div id="sheet"></div>
<div class="toast" id="toast"></div>
<script>
(function(){
'use strict';
var KS='lgn.v1',KU='lgn.ui',KY='lgn.sync',KB='lgn.bak';
var DB={docs:{}};
var UI={screen:'home',tab:'list',sid:null,sort:'due',cat:'all',g:{}};
var CAL={y:0,m:0,sel:''};
var SY={clientId:'',on:false,last:0,fileId:'',sh:false};
var TOK=null,TOKEXP=0,PASS='',TC=null,TCRES=null,TCREJ=null,syncing=false,STAT='',STERR=false;
var MD=null,PASSRES=null;
var CATS=['Hiburan','Musik','Cloud','Kerja','Belajar','Lainnya'];
var UNITS=[['d','Hari'],['w','Minggu'],['m','Bulan'],['y','Tahun']];
var DAY=86400000;

/* ---------- util ---------- */
function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function uid(){return Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3);}
function p2(n){return ('0'+n).slice(-2);}
function num(n){return String(Math.round(Math.abs(n))).replace(/\B(?=(\d{3})+(?!\d))/g,'.');}
function rp(n){n=Math.round(n);return (n<0?'−':'')+'Rp '+num(n);}
function dec(v){var s=(Math.round(v*100)/100).toFixed(2).replace(/\.00$/,''),a=s.split('.');return a[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.')+(a[1]?','+a[1]:'');}
function fmtAmt(v,c){return c==='IDR'?rp(v):c+' '+dec(v);}
function sum(a){var s=0;for(var i=0;i<a.length;i++)s+=a[i];return s;}
var MON=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
var MONF=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
function fdate(s){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?(+m[3])+' '+MON[+m[2]-1]+' '+m[1]:'';}
function pd(s){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?Date.UTC(+m[1],+m[2]-1,+m[3]):NaN;}
function fd(ms){var d=new Date(ms);return d.getUTCFullYear()+'-'+p2(d.getUTCMonth()+1)+'-'+p2(d.getUTCDate());}
function today(){var d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
var tt;function toast(m){var t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('show');},3200);}
function parseAmt(s){
 s=String(s).trim().replace(/[^\d.,]/g,'');
 if(!s)return 0;
 if(s.indexOf(',')>=0)return parseFloat(s.replace(/\./g,'').replace(',','.'))||0;
 var m=/^(\d+)\.(\d{1,2})$/.exec(s);
 if(m)return parseFloat(s);
 return parseFloat(s.replace(/\./g,''))||0;
}

/* ---------- storage ---------- */
function load(){
 try{var j=JSON.parse(localStorage.getItem(KS));if(j&&j.docs)DB=j;}catch(e){}
 try{touchIM();}catch(e){}
 try{var u=JSON.parse(localStorage.getItem(KU));if(u)for(var k in u)if(k in UI)UI[k]=u[k];}catch(e){}
 try{var y=JSON.parse(localStorage.getItem(KY));if(y)for(var k2 in y)if(k2 in SY)SY[k2]=y[k2];}catch(e){}
}
function save(){try{touchIM();localStorage.setItem(KS,JSON.stringify(DB));}catch(e){}}
function saveUI(){try{localStorage.setItem(KU,JSON.stringify({screen:UI.screen,tab:UI.tab,sid:UI.sid,sort:UI.sort,cat:UI.cat}));}catch(e){}}
function saveSY(){try{localStorage.setItem(KY,JSON.stringify({clientId:SY.clientId,on:SY.on,last:SY.last,fileId:SY.fileId}));}catch(e){}}
function put(doc,id,val){var d=DB.docs[doc]||(DB.docs[doc]={mt:0,d:{}});d.d[id]=val;d.mt=Date.now();save();}
function get(doc,id){var d=DB.docs[doc];return d?d.d[id]:undefined;}
function cfg(k,def){var v=get('cfg',k);return v===undefined?def:v;}

/* ---------- currency ---------- */
function curList(){return cfg('cur',[]);}
function rateOf(c){if(c==='IDR')return 1;var l=curList();for(var i=0;i<l.length;i++)if(l[i].c===c)return l[i].r||0;return 0;}
function toIDR(v,c){return v*rateOf(c);}

/* ---------- date / cycle ---------- */
function addM(ms,n,day){
 var d=new Date(ms),m=d.getUTCMonth()+n,ny=d.getUTCFullYear()+Math.floor(m/12),nm=((m%12)+12)%12;
 var last=new Date(Date.UTC(ny,nm+1,0)).getUTCDate();
 return Date.UTC(ny,nm,Math.min(day,last));
}
function nth(s,k){
 var a=pd(s.anchor),N=s.every,ad=new Date(a).getUTCDate();
 if(s.unit==='d')return a+k*N*DAY;
 if(s.unit==='w')return a+k*N*7*DAY;
 if(s.unit==='m')return addM(a,k*N,ad);
 return addM(a,k*N*12,ad);
}
function firstK(s,from){
 var a=pd(s.anchor),N=s.every;
 if(s.unit==='d')return Math.ceil((from-a)/(N*DAY));
 if(s.unit==='w')return Math.ceil((from-a)/(N*7*DAY));
 var A=new Date(a),F=new Date(from),md=(F.getUTCFullYear()-A.getUTCFullYear())*12+F.getUTCMonth()-A.getUTCMonth();
 var per=s.unit==='m'?N:12*N,k=Math.floor(md/per)-1;
 while(nth(s,k)<from)k++;
 return k;
}
function nextDue(s){
 if(s.status==='berhenti')return null;
 var t=Math.max(pd(today()),pd(s.anchor)),k=firstK(s,t),d=nth(s,k);
 return fd(d);
}
function occIn(s,from,to){
 if(s.status==='jeda')return [];
 if(s.status==='berhenti'&&s.end)to=Math.min(to,pd(s.end));
 var lo=pd(s.start&&s.start<s.anchor?s.start:s.anchor);if(from<lo)from=lo;
 var out=[],k=firstK(s,from),d;
 while(out.length<1000){d=nth(s,k);if(d>to)break;out.push(fd(d));k++;}
 return out;
}
function daysTo(iso){return Math.round((pd(iso)-pd(today()))/DAY);}
function dueLabel(iso){
 var n=daysTo(iso);
 if(n===0)return 'Hari ini';if(n===1)return 'Besok';
 if(n>1&&n<=30)return n+' hari lagi';
 return fdate(iso);
}
function cycleLabel(s){
 var u={d:'hari',w:'minggu',m:'bulan',y:'tahun'}[s.unit];
 if(s.every===1)return {d:'Harian',w:'Mingguan',m:'Bulanan',y:'Tahunan'}[s.unit];
 return 'Tiap '+s.every+' '+u;
}
function priceAt(s,iso){var p=s.prices,c=p[0].p;for(var i=0;i<p.length;i++)if(p[i].from<=iso)c=p[i].p;return c;}
function mine(s,iso){return priceAt(s,iso)/(s.people||1);}
function mineIDR(s,iso){return toIDR(mine(s,iso),s.cur);}
function fac(s){
 var N=s.every;
 if(s.unit==='d')return 30.4375/N;
 if(s.unit==='w')return 30.4375/(7*N);
 if(s.unit==='m')return 1/N;
 return 1/(12*N);
}
function monthlyIDR(s){return mineIDR(s,today())*fac(s);}

/* ---------- model ---------- */
function subs(){
 return Object.keys(DB.docs).filter(function(n){return n.indexOf('u_')===0;}).map(function(n){return DB.docs[n].d.sub;}).filter(function(s){return s&&!s.gone;});
}
function getSub(id){var s=get('u_'+id,'sub');return s&&!s.gone?s:null;}
function putSub(s){s.ts=Date.now();put('u_'+s.id,'sub',s);}
function missingRate(list){return list.filter(function(s){return !rateOf(s.cur);}).length;}

/* ---------- icons ---------- */
var ICP={"book-open":"<path d=\"M12 5v16\" /><path d=\"M20.001 19A2 2 0 0022 17V5a2 2 0 00-1.999-2L16 3.002A5 5 0 0012 5a5 5 0 00-4-2H4a2 2 0 00-2 2v12a2 2 0 001.999 2H8a5 5 0 014 2 5 5 0 014-2z\" />","settings":"<path d=\"M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915\" /><circle cx=\"12\" cy=\"12\" r=\"3\" />","house":"<path d=\"M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8\" /><path d=\"M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z\" />","x":"<path d=\"M18 6 6 18\" /><path d=\"m6 6 12 12\" />","plus":"<path d=\"M5 12h14\" /><path d=\"M12 5v14\" />","minus":"<path d=\"M5 12h14\" />","list":"<path d=\"M3 5h.01\" /><path d=\"M3 12h.01\" /><path d=\"M3 19h.01\" /><path d=\"M8 5h13\" /><path d=\"M8 12h13\" /><path d=\"M8 19h13\" />","calendar":"<path d=\"M8 2v3\" /><path d=\"M16 2v3\" /><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"2\" /><path d=\"M3 9h18\" />","chart-column":"<path d=\"M3 3v16a2 2 0 0 0 2 2h16\" /><path d=\"M18 17V9\" /><path d=\"M13 17V5\" /><path d=\"M8 17v-3\" />"};
function ico(n,cls){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"'+(cls?' class="'+cls+'"':'')+'>'+ICP[n]+'</svg>';}
var IC={
 list:ico('list'),cal:ico('calendar'),stats:ico('chart-column'),gear:ico('settings'),book:ico('book-open','ic'),house:ico('house','ic'),x:ico('x','ic'),plus:ico('plus','ic'),minus:ico('minus','ic'),
 tri:'<svg class="tri" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>',
 triL:'<svg class="tri" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>',
 triD:'<svg class="tri" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>'
};
function seg(k,opts,cur,act){
 return '<div class="seg">'+opts.map(function(o){return '<button data-act="'+act+'" data-k="'+k+'" data-v="'+o[0]+'" class="'+(String(cur)===String(o[0])?'on':'')+'">'+o[1]+'</button>';}).join('')+'</div>';
}
function subLine(s){
 var p=[cycleLabel(s)];
 if(s.status==='aktif'){var nd=nextDue(s);p.push(dueLabel(nd));}
 else if(s.status==='berhenti')p.push('Berhenti '+fdate(s.end));
 else p.push('Dijeda');
 if(s.cur!=='IDR')p.push(fmtAmt(mine(s,today()),s.cur));
 if(s.people>1)p.push('÷'+s.people);
 return p.join(' · ');
}

/* ---------- views ---------- */
function subRow(s){
 var soon=s.status==='aktif'&&daysTo(nextDue(s))<=cfg('remind',7);
 var amt=rateOf(s.cur)?rp(mineIDR(s,today())):fmtAmt(mine(s,today()),s.cur);
 return '<div class="row tap" data-act="open" data-id="'+s.id+'"><div class="nm">'+esc(s.n)+'<div class="sub'+(soon?' soon':'')+'">'+esc(subLine(s))+'</div></div><span class="val">'+amt+'</span>'+IC.tri+'</div>';
}
function vList(){
 var all=subs(),cat=UI.cat,h='';
 var set=all.filter(function(s){return cat==='all'||s.cat===cat;});
 var act=set.filter(function(s){return s.status==='aktif';}),jeda=set.filter(function(s){return s.status==='jeda';}),stop=set.filter(function(s){return s.status==='berhenti';});
 var mo=sum(act.map(monthlyIDR)),nr=missingRate(act);
 h+='<div class="card"><div style="display:flex;gap:12px;padding:16px"><div style="flex:1;min-width:0"><div class="cap">Per bulan</div><div class="big">'+rp(mo)+'</div></div><div style="flex:1;min-width:0;text-align:right"><div class="cap">Per tahun</div><div class="big">'+rp(mo*12)+'</div></div></div><div class="row"><div class="nm" style="font-weight:600;font-size:15px;color:var(--tx2)">'+act.length+' aktif'+(jeda.length?' · '+jeda.length+' dijeda':'')+(nr?' · '+nr+' tanpa kurs':'')+'</div></div></div>';
 h+='<button class="btn" data-act="newsub">Langganan baru</button>';
 h+='<div class="sec">Jenis langganan</div><div class="chips sc"><button class="chip'+(cat==='all'?' on':'')+'" data-act="catf" data-v="all">Semua</button>'+CATS.map(function(c){return '<button class="chip'+(cat===c?' on':'')+'" data-act="catf" data-v="'+c+'">'+c+'</button>';}).join('')+'</div>';
 var rem=cfg('remind',7),soon=act.filter(function(s){return daysTo(nextDue(s))<=rem;}).sort(function(a,b){return pd(nextDue(a))-pd(nextDue(b));});
 if(soon.length)h+='<div class="sec">Jatuh tempo</div><div class="card">'+soon.map(subRow).join('')+'</div>';
 if(act.length){
  var sorted=act.slice().sort(function(a,b){
   if(UI.sort==='price')return monthlyIDR(b)-monthlyIDR(a);
   if(UI.sort==='name')return a.n.localeCompare(b.n);
   return pd(nextDue(a))-pd(nextDue(b));
  });
  h+='<div class="sec">Aktif</div><div class="card"><div class="row" style="padding:10px 16px">'+seg('sort',[['due','Terdekat'],['price','Termahal'],['name','Nama']],UI.sort,'cset')+'</div>'+sorted.map(subRow).join('')+'</div>';
 }
 if(jeda.length)h+='<div class="sec">Dijeda</div><div class="card">'+jeda.map(subRow).join('')+'</div>';
 if(stop.length)h+='<div class="sec">Berhenti</div><div class="card">'+stop.map(subRow).join('')+'</div>';
 return h;
}
function monthOcc(y,m){

 });

function vGuide(){
 return '<div class="card">'+GUIDE.map(function(g,i){
  var open=UI.g[i];
  return '<div style="border-top:'+(i?'.5px solid var(--sep)':'0')+'"><button class="gh" data-act="gtog" data-i="'+i+'">'+g[0]+(open?IC.triD:IC.tri)+'</button>'+
   (open?'<div class="gb"><ol>'+g[1].map(function(s){return '<li>'+s+'</li>';}).join('')+'</ol><img src="'+g[2]+'" alt=""></div>':'')+'</div>';
 }).join('')+'</div>';
}
function render(){
 var s=UI.screen,title='',back='',gear='',st=false,hasbar=false,body='';
 if(s==='sub'&&!getSub(UI.sid)){UI.screen=s='home';}
 if(s==='home'){title='Langganan';gear=1;st=true;hasbar=true;body={list:vList,cal:vCal,stats:vStats}[UI.tab]();}
 else if(s==='sub'){title=getSub(UI.sid).n;back='Daftar';body=vDetail(UI.sid);}
 else if(s==='setup'){title='Setup';back='Kembali';body=vSetup();}
 else if(s==='guide'){title='Panduan';back='Setup';body=vGuide();}
 $('top').innerHTML=(back?'<button data-act="back">'+IC.triL+back+'</button>':'<span></span>')+(gear?'<button data-act="setup">'+IC.gear+'</button>':'<span></span>');
 $('ttl').textContent=title;
 var b=$('st');b.style.display=st?'block':'none';b.textContent=STAT||syncLabel();b.className=STERR?'err':'';
 $('view').innerHTML=body;
 var tb=$('tabs');tb.style.display=hasbar?'flex':'none';
 document.body.classList.toggle('hasbar',hasbar);
 if(hasbar)tb.innerHTML=[['list','Daftar'],['cal','Kalender'],['stats','Statistik']].map(function(t){return '<button data-act="tab" data-v="'+t[0]+'" class="'+(UI.tab===t[0]?'on':'')+'">'+IC[t[0]]+'<span>'+t[1]+'</span></button>';}).join('');
 saveUI();
}
function syncLabel(){
 if(!SY.clientId&&!SY.sh)return 'Sinkron belum diatur';
 if(!SY.on)return SY.sh?'Ketuk untuk sinkron':'Ketuk untuk menghubungkan';
 return 'Tersinkron '+(SY.last?new Date(SY.last).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}):'')+' · ketuk untuk sinkron';
}
function setStat(t,err){STAT=t||'';STERR=!!err;var b=$('st');b.textContent=STAT||syncLabel();b.className=STERR?'err':'';}

/* ---------- sheets ---------- */
function fld(label,inner){return '<div class="row"><span class="lb">'+label+'</span>'+inner+'</div>';}
function openSheet(type,data,draft){MD={type:type,data:data||{},draft:draft||null};drawSheet();}
function closeSheet(){MD=null;$('sheet').innerHTML='';}
function priceStr(d){return d.p?(d.cur==='IDR'?num(d.p):String(d.p).replace('.',',')):'';}
function drawSheet(){
 if(!MD){$('sheet').innerHTML='';return;}
 var t=MD.type,d=MD.data,dr=MD.draft,title='',body='',save=true;
 if(t==='sub'){
  title=d.id?'Ubah langganan':'Langganan baru';
  body='<div class="card">'+fld('Nama','<input type="text" id="f_n" value="'+esc(dr.n)+'" placeholder="Netflix">')+
   '<div class="row" style="border-top:.5px solid var(--sep)"><span class="lb">Kategori</span></div><div class="chips">'+CATS.map(function(c){return '<button class="chip'+(dr.cat===c?' on':'')+'" data-act="scat" data-v="'+c+'">'+c+'</button>';}).join('')+'</div></div>';
  body+='<div class="card">'+fld('Harga','<input type="text" id="f_p" inputmode="decimal" value="'+esc(priceStr(dr))+'" placeholder="0">')+
   '<div class="row" style="border-top:.5px solid var(--sep)"><span class="lb">Mata uang</span></div><div class="chips">'+['IDR'].concat(curList().map(function(c){return c.c;})).map(function(c){return '<button class="chip'+(dr.cur===c?' on':'')+'" data-act="scur" data-v="'+c+'">'+c+'</button>';}).join('')+'</div>'+
   (d.id?fld('Harga berlaku sejak','<input type="date" id="f_s" value="'+esc(dr.since)+'">'):'')+'</div>';
  body+='<div class="card">'+fld('Tiap','<input type="text" id="f_e" inputmode="numeric" value="'+esc(dr.every)+'" style="max-width:70px;margin-left:auto">')+'<div class="row" style="padding:10px 16px">'+seg('unit',UNITS,dr.unit,'sunit')+'</div>'+
   fld('Tanggal tagih','<input type="date" id="f_d" value="'+esc(dr.anchor)+'">')+fld('Mulai (opsional)','<input type="date" id="f_st" value="'+esc(dr.start)+'">')+
   '<div class="row"><span class="lb">Dibagi untuk</span><span class="nm"></span><div class="step"><button class="ib" data-act="ppl" data-d="-1">'+IC.minus+'</button><b>'+dr.people+'</b><button class="ib" data-act="ppl" data-d="1">'+IC.plus+'</button></div></div></div>';
  body+='<div class="card"><div class="row"><textarea id="f_note" placeholder="Catatan">'+esc(dr.note)+'</textarea></div></div>';
 }else if(t==='cur'){
  title=d.c?d.c:'Mata uang baru';
  body='<div class="card">'+(d.c?'':fld('Kode','<input type="text" id="f_c" value="'+esc(dr.c)+'" placeholder="USD" autocapitalize="characters" autocorrect="off" spellcheck="false">'))+fld('1 '+(d.c||'unit')+' =','<input type="text" id="f_r" inputmode="decimal" value="'+esc(dr.r)+'" placeholder="Rp">')+'</div>';
  if(!d.c)body+='<div class="chips">'+['USD','EUR','SGD','GBP','JPY','AUD','MYR'].map(function(c){return '<button class="chip'+(dr.c===c?' on':'')+'" data-act="curpick" data-v="'+c+'">'+c+'</button>';}).join('')+'</div>';
  else body+='<button class="btn sec2 red" data-act="curdel">Hapus mata uang</button>';
 }else if(t==='act'){
  title=d.title||'';save=false;
  body=d.items.map(function(a){return '<button class="btn sec2'+(a.red?' red':'')+'" data-act="'+a.act+'"'+(a.i!==undefined?' data-i="'+a.i+'"':'')+'>'+a.l+'</button>';}).join('');
 }else if(t==='confirm'){
  title=d.title;save=false;
  body='<div class="card"><div class="row"><div class="nm" style="white-space:normal">'+esc(d.msg)+'</div></div></div><button class="btn sec2 red" data-act="'+d.act+'">'+d.label+'</button>';
 }else if(t==='pass'){
  title='Kata sandi';
  body='<div class="card">'+fld('Sandi','<input type="text" id="f_pw" value="" autocapitalize="off" autocorrect="off" spellcheck="false" style="-webkit-text-security:disc">')+'</div>';

 return '<section class="scard"><h3>Sync Google Drive (terenkripsi)</h3>'+lab('Client ID Google')+'<input class="f" type="text" id="cid" value="'+esc(SY.clientId)+'" placeholder="xxxx.apps.googleusercontent.com" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Client ID Google"><div class="brow" style="margin-top:12px"><button class="bt pri" data-act="syncnow">'+(SY.on?'Sync sekarang':'Hubungkan')+'</button>'+(SY.on?'<button class="bt" data-act="disc">Putuskan</button>':'')+'</div><p class="hint" style="margin:10px 0 0">'+esc(SY.on?(last?'Terakhir sync '+last+'.':'Tersambung.'):'Belum tersambung.')+'</p></section>';
}

/* ---------- events ---------- */
function go(s,extra){UI.screen=s;if(extra)for(var k in extra)UI[k]=extra[k];render();window.scrollTo(0,0);}
document.addEventListener('click',function(e){
 var b=e.target.closest('[data-act]');if(!b||b.disabled)return;
 var a=b.dataset.act,id=b.dataset.id;
 if(MD)syncDraft();
 switch(a){
  case 'back':
   if(UI.screen==='guide')UI.screen='setup';else UI.screen='home';
   if(UI.screen==='home')UI.sid=null;
   render();window.scrollTo(0,0);break;
  case 'setup':refreshShared();go('setup');break;
  case 'guide':go('guide');break;
  case 'gtog':UI.g[b.dataset.i]=!UI.g[b.dataset.i];render();break;
  case 'tab':UI.tab=b.dataset.v;render();window.scrollTo(0,0);break;
  case 'cset':UI[b.dataset.k]=b.dataset.v;render();break;
  case 'catf':UI.cat=b.dataset.v;render();break;
  case 'open':go('sub',{sid:id});break;
  case 'cmo':{CAL.m+=Number(b.dataset.d);if(CAL.m<0){CAL.m=11;CAL.y--;}if(CAL.m>11){CAL.m=0;CAL.y++;}CAL.sel=CAL.y+'-'+p2(CAL.m+1)+'-01';render();break;}
  case 'calday':CAL.sel=b.dataset.d;render();break;
  case 'newsub':openSheet('sub',{},newDraft());break;
  case 'editsub':{var s=getSub(UI.sid),dr={n:s.n,cat:s.cat,cur:s.cur,p:priceAt(s,today()),every:String(s.every),unit:s.unit,anchor:s.anchor,people:s.people||1,note:s.note||'',since:today(),start:s.start||''};openSheet('sub',{id:s.id},dr);break;}
  case 'scat':MD.draft.cat=b.dataset.v;drawSheet();break;
  case 'scur':MD.draft.cur=b.dataset.v;drawSheet();break;
  case 'sunit':MD.draft.unit=b.dataset.v;drawSheet();break;
  case 'ppl':MD.draft.people=Math.max(1,MD.draft.people+Number(b.dataset.d));drawSheet();break;
  case 'jeda':{var s1=getSub(UI.sid);s1.status='jeda';putSub(s1);render();break;}
  case 'aktif':{var s2=getSub(UI.sid);s2.status='aktif';s2.end='';putSub(s2);render();break;}
  case 'stopq':openSheet('confirm',{title:'Berhenti berlangganan',msg:'Langganan dipindah ke daftar Berhenti dan tidak dihitung lagi mulai hari ini.',act:'stopok',label:'Berhenti'});break;
  case 'stopok':{var s3=getSub(UI.sid);s3.status='berhenti';s3.end=today();putSub(s3);closeSheet();render();break;}
  case 'delq':openSheet('confirm',{title:'Hapus langganan',msg:'Langganan beserta riwayat harganya akan dihapus.',act:'delok',label:'Hapus'});break;
  case 'delok':DB.docs['u_'+UI.sid]={mt:Date.now(),d:{sub:{gone:1}}};save();UI.screen='home';UI.sid=null;closeSheet();render();break;
  case 'hist':{var s4=getSub(UI.sid);if(s4.prices.length<2){toast('Minimal satu harga');break;}openSheet('act',{title:'Riwayat harga',items:[{l:'Hapus entri ini',act:'histdel',i:b.dataset.i,red:1}]});break;}
  case 'histdel':{var s5=getSub(UI.sid);s5.prices.splice(Number(b.dataset.i),1);putSub(s5);closeSheet();render();break;}
  case 'newcur':openSheet('cur',{},{c:'',r:''});break;
  case 'editcur':{var cc=curList().filter(function(x){return x.c===b.dataset.c;})[0];openSheet('cur',{c:cc.c},{c:cc.c,r:String(cc.r).replace('.',',')});break;}
  case 'curpick':MD.draft.c=b.dataset.v;drawSheet();break;
  case 'curdel':{
   var cd=MD.data.c;
   if(subs().some(function(x){return x.cur===cd;})){toast('Masih dipakai langganan');break;}
   put('cfg','cur',curList().filter(function(x){return x.c!==cd;}));closeSheet();render();break;}
  case 'cremind':put('cfg','remind',Number(b.dataset.v));render();break;
  case 'ssave':ssave();break;
  case 'sclose':if(MD&&MD.type==='pass'&&PASSRES){var r=PASSRES;PASSRES=null;r('');}closeSheet();break;
  case 'pal':openSheet('pal',{});break;
  case 'setacc':put('cfg','accent',b.dataset.c);applyCfg();if(MD)closeSheet();render();break;
  case 'settheme':put('cfg','theme',b.dataset.v);applyCfg();render();break;
  case 'icsone':exportIcs([getSub(UI.sid)],'langganan-'+getSub(UI.sid).n.replace(/[^\w\-]+/g,'-')+'.ics');break;
  case 'icsall':exportIcs(subs().filter(function(x){return x.status==='aktif';}),'langganan.ics');break;
  case 'syncnow':syncNow(true);break;
  case 'disc':disconnect();break;
  case 'backup':download(new Blob([JSON.stringify({v:1,docs:DB.docs})],{type:'application/json'}),'langganan-cadangan.json');break;
  case 'restore':{
   var i=document.createElement('input');i.type='file';i.accept='application/json,.json';i.style.display='none';document.body.appendChild(i);
   i.addEventListener('change',function(){
    var f=i.files[0];i.remove();if(!f)return;
    f.text().then(function(t){var j=JSON.parse(t);if(!j.docs)throw 0;bak();DB.docs=j.docs;save();applyCfg();UI.screen='home';UI.sid=null;render();toast('Data dipulihkan');}).catch(function(){toast('File tidak valid');});
   });
   i.click();break;}
  case 'restoremiss':{var rn=restoreMissing();toast(rn<0?'Belum ada cadangan':rn?rn+' data dipulihkan':'Tidak ada yang hilang');render();break;}
  case 'reset':openSheet('confirm',{title:'Hapus semua data',msg:'Semua langganan di perangkat ini akan dihapus. Data di Drive tidak ikut terhapus.',act:'resetok',label:'Hapus semua'});break;
  case 'resetok':bak();DB.docs={};save();UI.screen='home';UI.sid=null;applyCfg();closeSheet();render();break;
 }
});
$('st').addEventListener('click',function(){refreshShared();if(!effCid()){go('setup');toast('Isi Client ID dulu');}else syncNow(true);});
document.addEventListener('input',function(e){
 var t=e.target;
 if(t.id==='f_p'&&MD&&MD.draft&&MD.draft.cur==='IDR'){var n=parseInt(t.value.replace(/\D/g,''),10)||0;t.value=n?num(n):'';}
});
document.addEventListener('change',function(e){
 if(e.target.id==='cid'){SY.clientId=e.target.value.trim();TC=null;SY.on=false;SY.fileId='';saveSY();}
});
document.addEventListener('focusin',function(e){if(e.target.closest&&e.target.closest('.sh')){setTimeout(function(){try{e.target.scrollIntoView({block:'center'});}catch(x){}},300);}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&MD){if(MD.type==='pass'&&PASSRES){var r=PASSRES;PASSRES=null;r('');}closeSheet();}});
if(window.visualViewport){visualViewport.addEventListener('resize',function(){document.body.classList.toggle('kb',window.innerHeight-visualViewport.height>150);});}

load();refreshShared();applyCfg();render();
(function(){
 var s=document.createElement('script');s.src='../auth.js';s.async=true;
 s.onload=s.onerror=function(){setTimeout(autoSync,500);};
 document.head.appendChild(s);
 setTimeout(autoSync,4000);
})();
})();
</script>
