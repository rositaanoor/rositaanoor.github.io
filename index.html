<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cloudy Clouds">
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="theme-color" content="#f2f2f7">
<title>Cloudy Clouds</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--tx:#000;--mu:#8e8e93;--sep:#e5e5ea;--acc:#0ea5e9}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--tx:#fff;--mu:#98989f;--sep:#38383a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 56px) 16px calc(env(safe-area-inset-bottom) + 32px)}
h1{font-size:34px;font-weight:800;letter-spacing:-.02em;margin:0 0 20px 4px}
.list{background:var(--card);border-radius:14px;overflow:hidden}
.app{display:flex;align-items:center;gap:14px;padding:12px 16px;color:inherit;text-decoration:none}
.app+.app{border-top:.5px solid var(--sep)}
.app:active{background:var(--sep)}
.ic{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;color:#fff;font-size:22px;font-weight:800;flex:none}
.tt{flex:1;min-width:0}
.tt b{display:block;font-weight:700}
.tt span{display:block;color:var(--mu);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.go{color:var(--mu);flex:none}
h2{font-size:13px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.02em;margin:28px 0 8px 16px}
.acct{background:var(--card);border-radius:14px;padding:16px}
.acct input{width:100%;font:inherit;color:inherit;background:var(--bg);border:0;border-radius:10px;padding:11px 12px;margin:0 0 10px;outline:none}
.acct input:focus{box-shadow:0 0 0 2px var(--acc)}
.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:11px 18px;background:var(--bg);color:var(--tx)}
.btn.pri{background:var(--acc);color:#fff}
.btn:active{opacity:.7}
.btn.arm{background:#EF4444;color:#fff}
.sep{border-top:.5px solid var(--sep);margin:14px 0 0;padding-top:14px}
.msg{margin:10px 0 0;color:var(--mu);font-size:14px;min-height:1.35em}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.row b{display:block}
</style>
</head>
<body>
<main>
<h1>Cloudy Clouds</h1>
<div class="list" id="list"></div>
<h2>Akun Google</h2>
<div class="acct" id="acct"></div>
</main>
<script src="./auth.js"></script>
<script>
var APPS=[
  {name:'Planner',desc:'Jurnal interstitial, to-do, kalender, habit',href:'./planner/',color:'#0ea5e9',icon:'P'},
  {name:'Pemulihan',desc:'Riwayat versi dan pemulihan data Drive',href:'./pemulihan/',color:'#64748B',icon:'<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>'}
];
document.getElementById('list').innerHTML=APPS.map(function(a){
  return '<a class="app" href="'+a.href+'"><div class="ic" style="background:'+a.color+'">'+a.icon+'</div><div class="tt"><b>'+a.name+'</b><span>'+a.desc+'</span></div><svg class="go" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7.5 5.2c-.9-.6-2 0-2 1.1v11.4c0 1.1 1.1 1.7 2 1.1L18 12.9c.8-.5.8-1.3 0-1.8z"/></svg></a>';
}).join('');

var acct=document.getElementById('acct');
function hint(c){return c.length>18?'…'+c.slice(-18):c;}
function drawAcct(msg){
  var o=window.SharedAuth&&SharedAuth.read();
  if(!window.SharedAuth){acct.innerHTML='<p class="msg">auth.js tidak ditemukan.</p>';return;}
  if(o){
    acct.innerHTML='<div class="row"><div><b>Tersambung</b><span style="color:var(--mu);font-size:14px">'+hint(o.cid)+'</span></div><button class="btn" id="out" type="button">Keluar</button></div><div class="sep row"><div><b>Reset data di Drive</b><span style="color:var(--mu);font-size:14px">Hapus semua file app di Drive</span></div><button class="btn" id="rst" type="button">Reset</button></div><p class="msg" id="m">'+(msg||'')+'</p>';
  }else{
    acct.innerHTML=(SharedAuth.cid?'':'<input id="cid" placeholder="Client ID Google" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Client ID Google">')+'<input id="pw" type="password" placeholder="Kata sandi enkripsi (min. 8 karakter)" autocomplete="new-password" aria-label="Kata sandi enkripsi"><button class="btn pri" id="in" type="button">Masuk dengan Google</button><p class="msg" id="m">'+(msg||'')+'</p>';
  }
}
acct.addEventListener('click',function(e){
  var m=function(t){var x=document.getElementById('m');if(x)x.textContent=t;};
  if(e.target.closest('#out')){SharedAuth.logout();drawAcct();return;}
  var rb=e.target.closest('#rst');
  if(rb){
    if(!rb.classList.contains('arm')){rb.classList.add('arm');rb.textContent='Ketuk lagi';clearTimeout(window.__rt);window.__rt=setTimeout(function(){rb.classList.remove('arm');rb.textContent='Reset';},4000);return;}
    clearTimeout(window.__rt);rb.disabled=true;m('Menghapus…');
    SharedAuth.reset().then(function(n){drawAcct(n?'Selesai. '+n+' file dihapus. Buka app untuk sync ulang dengan kata sandi baru.':'Tidak ada file di Drive.');},function(er){drawAcct('Gagal'+(er&&er.status?' ('+er.status+')':'')+'. Coba lagi.');});
    return;
  }
  if(!e.target.closest('#in'))return;
  var cid=SharedAuth.cid||document.getElementById('cid').value.trim(),pw=document.getElementById('pw').value;
  if(!/\.apps\.googleusercontent\.com$/.test(cid)){m('Client ID tidak valid. Biasanya berakhir .apps.googleusercontent.com');return;}
  if(pw.length<8){m('Kata sandi minimal 8 karakter.');return;}
  m('Membuka Google…');SharedAuth.login(cid,pw);
  SharedAuth.token(true).then(function(){drawAcct('Berhasil. Semua app memakai login ini.');},function(er){SharedAuth.logout();drawAcct('Tidak bisa masuk ke Google'+(er&&er.detail?' ('+er.detail+')':'')+'. Cek Client ID, origin, dan izin pop-up.');});
});
drawAcct();
</script>
</body>
</html>
