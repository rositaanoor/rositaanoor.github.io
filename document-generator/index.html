*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;scroll-padding-bottom:40vh}

button,input,select{font-family:inherit;color:inherit}
button,a,.row{touch-action:manipulation}
.wrap{max-width:720px;margin:0 auto;padding:0 16px calc(104px + var(--sat-bot))}
body.kb nav.tabs{display:none}

.tab svg{width:26px;height:26px}.tab.on{color:var(--c)}
.card,.grp{background:var(--surface);border-radius:14px;margin:0 0 16px;overflow:hidden}
.card{padding:16px}.card.slim{padding:6px 16px}
.card h3{font:600 17px/1.2 var(--display);margin:0 0 10px}
.setgrid{display:grid;gap:16px;max-width:860px}.setgrid>.card{margin:0}
.lab{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:12px 0 4px}
.lab:first-of-type{margin-top:0}
.fld{padding:12px 16px 4px}.fld:last-child{padding-bottom:14px}
.fld .lab{margin:0 0 5px}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:48px;cursor:pointer;width:100%;border:0;background:none;text-align:left}
.row+.row{border-top:.5px solid var(--line)}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .d{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.indent{padding-left:34px}.row.sel .t{color:var(--acc)}.row.danger .t{color:var(--coral)}
.badge{font-size:11px;font-weight:700;color:var(--acc);background:var(--acc-soft);border-radius:6px;padding:2px 7px;white-space:nowrap}
.round{width:36px;height:36px;border-radius:50%;border:0;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--acc);flex-shrink:0;cursor:pointer}
.f{width:100%;border:0;border-radius:10px;padding:10px 12px;font-size:16px;background:var(--field);color:var(--ink);min-height:44px;outline:none;-webkit-appearance:none;appearance:none;min-width:0}
.f::placeholder{color:color-mix(in srgb,var(--muted) 70%,transparent)}
.f:focus{box-shadow:0 0 0 2px var(--acc)}
.f.bad{box-shadow:0 0 0 2px var(--coral)}
.f[readonly]{color:var(--acc);font-weight:700;background:var(--acc-soft)}
select.f{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
input[type=date].f{min-height:44px}
.hint{font-size:12.5px;color:var(--muted);margin-top:5px}.hint.ok{color:var(--green)}.hint.err{color:var(--coral)}.hint:empty{display:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;background:var(--soft);border-radius:10px;padding:9px 14px;font-weight:600;font-size:15px;color:var(--acc);cursor:pointer}
.btn.pri{background:var(--acc);color:var(--on)}.btn.dng{color:var(--coral)}.btn.arm{background:var(--coral);color:#fff}.ricons{display:flex;align-items:center;gap:6px}
.btn.blk{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;margin-bottom:10px;font-size:16px}
.btn:disabled{opacity:.4}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.mchip{display:inline-flex;align-items:center;gap:7px;border:0;background:var(--soft);color:var(--ink);border-radius:99px;padding:7px 12px;font-weight:600;font-size:14px;cursor:pointer}
.mchip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.mchip.on{background:var(--c);color:var(--on)}.mchip.on::before{background:var(--on)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.mchip.op{min-width:44px;justify-content:center;font-size:17px;padding:5px 12px;color:var(--acc)}.mchip.op::before{display:none}

.pkg{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}

.pks.on{box-shadow:0 0 0 3px var(--ink)}
.pkt{font:600 17px var(--display);margin:2px 0 14px;text-align:center}
.mdla{display:flex;gap:8px;margin-top:16px;align-items:center}
.lnkrow{display:flex;justify-content:space-between;align-items:center;width:100%;padding:12px 0;background:none;border:0;font:inherit;font-weight:600;color:var(--acc);text-decoration:none;cursor:pointer}
a.lnkrow{color:inherit}
.sw{position:relative;width:51px;height:31px;flex-shrink:0}
.sw input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:16px;background:var(--soft);transition:.2s}
.sw i::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:.2s}
.sw input:checked+i{background:var(--green)}.sw input:checked+i::after{transform:translateX(20px)}
.empty{text-align:center;color:var(--muted);padding:44px 20px;font-weight:600}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;max-height:90vh;display:flex;flex-direction:column;background:var(--bg);border-radius:20px 20px 0 0;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-width:560px;margin:0 auto}
.sheet.on{transform:none}
.sheet::before{content:"";display:block;width:36px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0;flex:none}
.sh-h{display:flex;align-items:center;gap:8px;padding:10px 16px 8px}
.sh-h h2{flex:1;text-align:center;font:600 17px var(--display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-h button{border:0;background:none;color:var(--acc);font-weight:600;font-size:16px;min-width:56px;cursor:pointer;padding:6px}
.sh-h button.r{text-align:right}.sh-h button.l{text-align:left}
.sh-b{overflow-y:auto;padding:4px 16px calc(20px + var(--sat-bot));-webkit-overflow-scrolling:touch}
#toast{position:fixed;left:50%;bottom:calc(86px + var(--sat-bot));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;font-weight:600;font-size:14px;z-index:80;opacity:0;pointer-events:none;transition:.25s;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.guide details.g,details.g{background:var(--surface);border-radius:14px;margin-bottom:10px;overflow:hidden;padding:0 16px}
details.g summary{list-style:none;padding:16px 0;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:10px}
details.g summary::-webkit-details-marker{display:none}
details.g summary .tri{transition:transform .2s}details.g[open] summary .tri{transform:rotate(90deg)}
details.g[open] summary{padding-bottom:12px}
details.g .gb{padding:0 0 20px;font-size:15px;line-height:1.5}
details.g .gb p{margin-bottom:10px}
details.g .gb img{width:100%;max-width:300px;display:block;margin:6px auto 14px;border-radius:14px;border:1px solid var(--line)}
details.g code{background:var(--field);padding:1px 6px;border-radius:5px;font-size:13.5px}
.syhelp{margin-top:6px;font-size:13.5px}.syhelp summary{list-style:none;display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--acc);font-weight:600}.syhelp summary::-webkit-details-marker{display:none}.syhelp summary .tri{transition:transform .2s}.syhelp[open] summary .tri{transform:rotate(90deg)}.syhelp ol{padding-left:20px;margin:8px 0}.syhelp li{margin:4px 0}
</style>
</head>

 while(n>0){const r=n%1000;if(r>0){if(g===1&&r===1)parts.unshift('Seribu');else parts.unshift(tbRatusan(r)+(G[g]?' '+G[g]:''))}n=Math.floor(n/1000);g++}
 return parts.join(' ')+' Rupiah'}
const HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const BULAN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
function terbilangTahun(y){if(y<1000)return tbRatusan(y);const r=Math.floor(y/1000),s=y%1000;return(r===1?'Seribu':tbRatusan(r)+' Ribu')+(s?' '+tbRatusan(s):'')}
function parseDate(v){if(!v)return null;let d;
 if(/^\d{4}-\d{2}-\d{2}$/.test(v))d=new Date(v+'T00:00:00');
 else if(/^\d{2}[\/\-]\d{2}[\/\-]\d{4}$/.test(v)){const[a,b,c]=v.split(/[\/\-]/);d=new Date(+c,+b-1,+a)}
 else d=new Date(v);return isNaN(d.getTime())?null:d}
function terbilangTanggal(v){const d=parseDate(v);if(!d)return v||'';
 return HARI[d.getDay()]+', tanggal '+tbRatusan(d.getDate())+', bulan '+BULAN[d.getMonth()]+', tahun '+terbilangTahun(d.getFullYear())}
function fmtTanggal(v){const d=parseDate(v);return d?d.getDate()+' '+BULAN[d.getMonth()]+' '+d.getFullYear():(v||'')}

function parseNum(s){s=String(s==null?'':s).trim().replace(/^Rp\s*/i,'').replace(/\s/g,'');if(s==='')return NaN;
 const neg=s[0]==='-';if(neg)s=s.slice(1);
 const dots=(s.match(/\./g)||[]).length,com=(s.match(/,/g)||[]).length;
 if(dots&&com){if(s.lastIndexOf(',')>s.lastIndexOf('.'))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(/,/g,'')}
 else if(com>1)s=s.replace(/,/g,'');
 else if(com===1)s=s.replace(',','.');
 else if(dots>1||/^\d{1,3}\.\d{3}$/.test(s))s=s.replace(/\./g,'');

 const n=parseFloat(s);return neg?-n:n}
function fmtRp(v){const n=parseFloat(v)||0,[i,d]=Math.abs(n).toFixed(2).split('.');return(n<0?'-':'')+'Rp'+i.replace(/\B(?=(\d{3})+(?!\d))/g,'.')+','+d}
function fmtPct(dec){return((parseFloat(dec)||0)*100).toFixed(2).replace('.',',')+'%'}
function applyFormat(v,mode){v=String(v);

async function inflateRaw(data){const ds=new DecompressionStream('deflate-raw'),w=ds.writable.getWriter(),r=ds.readable.getReader();
 w.write(data);w.close();const ch=[];for(;;){const{done,value}=await r.read();if(done)break;ch.push(value)}

 for(let i=buf.byteLength-22;i>=0;i--)if(v.getUint32(i,true)===0x06054b50){eocd=i;break}
 if(eocd<0)throw new Error('Bukan file ZIP/DOCX yang valid');
 const cdOff=v.getUint32(eocd+16,true),cnt=v.getUint16(eocd+8,true);let p=cdOff;
 for(let i=0;i<cnt;i++){if(v.getUint32(p,true)!==0x02014b50)break;
  const fl=v.getUint16(p+28,true),el=v.getUint16(p+30,true),cl=v.getUint16(p+32,true),lh=v.getUint32(p+42,true);
  const name=new TextDecoder().decode(new Uint8Array(buf,p+46,fl));
  const lv=new DataView(buf,lh),ds=lh+30+lv.getUint16(26,true)+lv.getUint16(28,true);
  const method=v.getUint16(p+10,true),raw=new Uint8Array(buf,ds,v.getUint32(p+20,true));
  files[name]=method===8?await inflateRaw(raw):raw.slice();p+=46+fl+el+cl}

const CT=(()=>{const t=new Uint32Array(256);for(let i=0;i<256;i++){let c=i;for(let j=0;j<8;j++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[i]=c}return t})();

  const lh=new Uint8Array(30+nb.length),lv=new DataView(lh.buffer);
  lv.setUint32(0,0x04034b50,true);lv.setUint16(4,20,true);lv.setUint32(14,cr,true);lv.setUint32(18,sz,true);lv.setUint32(22,sz,true);lv.setUint16(26,nb.length,true);lh.set(nb,30);lp.push(lh,d);
  const ch=new Uint8Array(46+nb.length),cv=new DataView(ch.buffer);
  cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);cv.setUint32(16,cr,true);cv.setUint32(20,sz,true);cv.setUint32(24,sz,true);cv.setUint16(28,nb.length,true);cv.setUint32(42,off,true);ch.set(nb,46);cd.push(ch);off+=lh.length+d.length}

// ===== placeholder <<nama>> =====
const PH_RE='&lt;&lt;(\\w+)&gt;&gt;';
const XML_PARTS=/^word\/(document|header\d*|footer\d*)\.xml$/;
// gabungkan run <w:r> yang memotong satu <<nama>> (Word sering memecah run)
function normalizePlaceholders(xml){
 return xml.replace(/<w:p\b[\s\S]*?<\/w:p>/g,para=>{
  if(para.indexOf('&lt;&lt;')<0&&para.indexOf('&lt;')<0)return para;
  para=para.replace(/<w:proofErr\b[^>]*\/>/g,'');
  const RUN=/<w:r(?:\s[^>]*)?>(?:<w:rPr>[\s\S]*?<\/w:rPr>)?<w:t(?:\s[^>]*)?>([^<]*)<\/w:t><\/w:r>/g;
  for(let guard=0;guard<200;guard++){
   const runs=[...para.matchAll(RUN)];let merged=false;
   // rantai run yang bersebelahan
   let i=0;
   while(i<runs.length&&!merged){
    let j=i;while(j+1<runs.length&&!/\S/.test(para.slice(runs[j].index+runs[j][0].length,runs[j+1].index)))j++;
    if(j>i){
     let text='',offs=[];for(let k=i;k<=j;k++){offs.push(text.length);text+=runs[k][1]}
     const re=new RegExp(PH_RE,'g');let m;
     while((m=re.exec(text))){const s=m.index,e=s+m[0].length;
      let a=-1,b=-1;for(let k=0;k<offs.length;k++){const rs=offs[k],re2=rs+runs[i+k][1].length;if(a<0&&s<re2)a=k;if(e<=re2||k===offs.length-1){if(b<0&&e<=re2){b=k}}}
      if(a>=0&&b>a){
       const r1=runs[i+a],r2=runs[i+b];let t='';for(let k=a;k<=b;k++)t+=runs[i+k][1];
       const rpr=(r1[0].match(/<w:rPr>[\s\S]*?<\/w:rPr>/)||[''])[0];
       const nr='<w:r>'+rpr+'<w:t xml:space="preserve">'+t+'</w:t></w:r>';
       para=para.slice(0,r1.index)+nr+para.slice(r2.index+r2[0].length);merged=true;break}}
    }
    i=j+1}
   if(!merged)break}
  return para})}
function scanNames(xml){xml=normalizePlaceholders(xml);const out=[],seen=new Set(),re=new RegExp(PH_RE,'g');let m;
 while((m=re.exec(xml)))if(!seen.has(m[1].toLowerCase())){seen.add(m[1].toLowerCase());out.push(m[1])}return out}
function replacePlaceholders(xml,fields){xml=normalizePlaceholders(xml);
 const map=new Map(Object.entries(fields).map(([k,v])=>[k.toLowerCase(),v]));
 return xml.replace(new RegExp(PH_RE,'gi'),(all,n)=>map.has(n.toLowerCase())?escX(map.get(n.toLowerCase())):all)}

const SUFFIX=[['_terbilang','terbilang'],['_upper','upper'],['_lower','lower'],['_title','title']];
const FMT_LBL={none:'Tidak ada',upper:'UPPERCASE',lower:'lowercase',title:'Titlecase',terbilang:'Terbilang'};
function guessType(name){const lc=name.toLowerCase(),tk=lc.split('_');
 if(lc==='bulan')return'bulan';if(lc==='tahun')return'tahun';
 if(/tanggal|tgl|date/.test(lc))return'tanggal';
 if(/naik|turun/.test(lc))return'naik_turun';
 if(/selisih|persen|pct/.test(lc))return'selisih_pct';
 if(/kas|jumlah|nilai|nominal|saldo|pajak|hibah|penerimaan|rupiah|biaya|harga/.test(lc)||tk.some(t=>['ls','tup','up'].includes(t)))return'rupiah';

function blankField(name){return{name,label:name,type:guessType(name),format_mode:'none',maxlen:0,formula:'',periodId:false,tracked:false,linkedTo:'',linkedSource:'',manual:false}}
function deriveLink(name,lowerMap){const lc=name.toLowerCase();
 for(const[sfx,fmt]of SUFFIX)if(lc.endsWith(sfx)&&lc.length>sfx.length){const real=lowerMap.get(lc.slice(0,-sfx.length));if(real&&real!==name)return{linkedSource:real,format_mode:fmt}}
 return null}
function buildFields(names,old){old=old||[];
 const oldMap=new Map(old.map(f=>[f.name.toLowerCase(),f])),lower=new Map(names.map(n=>[n.toLowerCase(),n]));
 const out=names.map(name=>{const o=oldMap.get(name.toLowerCase()),b=blankField(name),link=deriveLink(name,lower);
  if(link)return{...b,...(o?{label:o.label}:{}),type:'text',...link};
  return o?{...b,...o,name,linkedSource:'',manual:false}:b});

 return out}
function periodSortKey(doc,e){const pf=doc.fields.filter(f=>f.periodId);if(!pf.length)return e._pkey||'';
 const rank={tahun:0,bulan:1,tanggal:2};
 return pf.map(f=>{const v=String(e['_v_'+f.name]??e[f.name]??'');
  if(f.type==='bulan'){const i=BULAN.indexOf(v);return[1,i<0?v:String(i+1).padStart(2,'0')]}
  if(f.type==='tahun')return[0,v.padStart(4,'0')];
  if(f.type==='tanggal'){const d=parseDate(v);return[2,d?d.toISOString().slice(0,10):v]}

function formulaCheck(d,expr){expr=(expr||'').trim();if(!expr)return'';const bad=[];
 const r=expr.replace(/\{([\w.]+)\}/g,(m,n)=>{if(!d.fields.some(x=>x.name===n))bad.push(n);return'1'});
 if(bad.length)return'Field tidak dikenal: '+bad.join(', ');
 if(!/^[\d\s+\-*/().]+$/.test(r))return'Hanya angka, field, dan operator + - * / ( )';
 try{const x=Function('"use strict";return('+r+')')();return isFinite(x)?'':'Hasil tidak valid'}catch(e){return'Formula tidak valid'}}
function evalFormula(doc,expr,V,depth){depth=depth||0;if(depth>5||!expr)return NaN;
 try{const r=expr.replace(/\{([\w.]+)\}/g,(m,n)=>{const f=doc.fields.find(x=>x.name===n);if(!f)return 0;
   if(f.type==='formula'){const x=evalFormula(doc,f.formula,V,depth+1);return isNaN(x)?0:x}
   const x=parseNum(V[n]);return isNaN(x)?0:x});
  if(!/^[\d\s+\-*/().]+$/.test(r))return NaN;
  const x=Function('"use strict";return('+r+')')();return isFinite(x)?x:NaN}catch(e){return NaN}}
function formulaIsRp(doc,expr){return[...expr.matchAll(/\{([\w.]+)\}/g)].some(m=>{const f=doc.fields.find(x=>x.name===m[1]);return f&&f.type==='rupiah'})}
function display(doc,f,V){const v=String(V[f.name]==null?'':V[f.name]).trim();
 if(f.type==='formula'){const r=evalFormula(doc,f.formula,V);return isNaN(r)?'':formulaIsRp(doc,f.formula)?fmtRp(r):String(Math.round(r*100)/100)}
 if(f.type==='rupiah')return v===''?'':fmtRp(isNaN(parseNum(v))?0:parseNum(v));
 if(f.type==='tanggal')return fmtTanggal(v);
 return v}
function rawNum(doc,f,V){return f.type==='formula'?evalFormula(doc,f.formula,V):parseNum(V[f.name])}
function fmtOne(doc,f,V,mode){
 if(mode==='terbilang'){
  if(f.type==='tanggal')return terbilangTanggal(String(V[f.name]||'').trim());
  if(['rupiah','number','formula'].includes(f.type)){const n=rawNum(doc,f,V);return isNaN(n)?'':terbilangUang(n)}
  return''}
 return applyFormat(display(doc,f,V),mode)}
function fieldOut(doc,f,V){if(f.linkedSource){const b=doc.fields.find(x=>x.name===f.linkedSource);return b?fmtOne(doc,b,V,f.format_mode):''}
 return fmtOne(doc,f,V,f.format_mode)}
function outputsFor(doc,V){const o={};for(const f of doc.fields)o[f.name]=fieldOut(doc,f,V);return o}
async function buildDocx(bytes,outputs){
 const buf=bytes.buffer.slice(bytes.byteOffset,bytes.byteOffset+bytes.byteLength);
 const files=await readZip(buf),enc=new TextEncoder(),dec=new TextDecoder('utf-8'),left=new Set(),list=[];
 for(const[n,d]of Object.entries(files)){
  if(XML_PARTS.test(n)){const x=replacePlaceholders(dec.decode(d),outputs);leftover(x).forEach(l=>left.add(l));list.push({n,d:enc.encode(x)})}
  else list.push({n,d})}

async function scanTemplate(bytes){const buf=bytes.buffer.slice(bytes.byteOffset,bytes.byteOffset+bytes.byteLength);
 const files=await readZip(buf);if(!files['word/document.xml'])throw new Error('Bukan file Word yang valid');

function strHash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(36)+'.'+s.length}
function sigOf(doc,id,v){if(v===undefined||v===null)return'';if(doc==='tpl')return(v.name||'')+'|'+(v.mod||0);return strHash(JSON.stringify(v))}
const TOMB_MS=90*864e5;
// L, R = {docs:{doc:{id:value}}, mt:{doc:ms}, im:{doc:{id:ms}}}; im negatif = catatan dihapus
function mergeS(L,R,now){now=now||Date.now();R=R||{docs:{},mt:{},im:{}};
 const out={docs:{},mt:{},im:{}},names=new Set([...Object.keys(L.docs),...Object.keys(L.im),...Object.keys(R.docs),...Object.keys(R.im)]);
 const state=(v,im)=>v!==undefined?{v,s:im>0?im:0}:(im<0?{v:undefined,s:im}:null);
 for(const doc of names){const ld=L.docs[doc]||{},rd=R.docs[doc]||{},li=L.im[doc]||{},ri=R.im[doc]||{};
  const ids=new Set([...Object.keys(ld),...Object.keys(rd),...Object.keys(li),...Object.keys(ri)]);let mt=Math.max((L.mt||{})[doc]||0,(R.mt||{})[doc]||0);
  for(const id of ids){const a=state(ld[id],li[id]),b=state(rd[id],ri[id]);let p;
   if(!a&&!b)continue;if(!a)p=b;else if(!b)p=a;else p=Math.abs(b.s)>=Math.abs(a.s)?b:a;
   if(p.s<0){if(now-Math.abs(p.s)>TOMB_MS)continue;(out.im[doc]=out.im[doc]||{})[id]=p.s}
   else{(out.docs[doc]=out.docs[doc]||{})[id]=p.v;if(p.s>0)(out.im[doc]=out.im[doc]||{})[id]=p.s}
   mt=Math.max(mt,Math.abs(p.s))}
  if(mt)out.mt[doc]=mt}
 return out}

const PALETTE=(()=>{const r=[];[0,25,45,80,130,165,190,215,250,280,315,340].forEach(h=>[80,68,57,47,37,28].forEach(l=>r.push(h2x(h,78,l))));return r.concat(['#E2E8F0','#CBD5E1','#94A3B8','#64748B','#334155','#0F172A'])})();

function fieldRow(d,f){const id='f_'+f.name,l='<label class="lab" for="'+id+'">'+esc(f.label||f.name)+'</label>',a=' data-f="'+esc(f.name)+'" id="'+id+'"',hint='<div class="hint" data-h="'+esc(f.name)+'"></div>';
 const ml=f.maxlen?' maxlength="'+f.maxlen+'"':'';
 switch(f.type){
  case'bulan':return'<div class="fld">'+l+'<select class="f"'+a+'><option value="">Pilih</option>'+BULAN.map(m=>'<option>'+m+'</option>').join('')+'</select></div>';
  case'tahun':return'<div class="fld">'+l+'<input class="f" inputmode="numeric" autocomplete="off"'+a+' data-num="1">'+hint+'</div>';
  case'number':case'rupiah':return'<div class="fld">'+l+'<input class="f" inputmode="decimal" autocomplete="off" placeholder="0"'+a+ml+' data-num="1">'+hint+'</div>';
  case'tanggal':return'<div class="fld">'+l+'<input class="f" type="date"'+a+'>'+hint+'</div>';
  case'formula':return'<div class="fld">'+l+'<input class="f" readonly placeholder="otomatis"'+a+'></div>';
  case'selisih_pct':return'<div class="fld">'+l+'<input class="f" readonly placeholder="otomatis"'+a+'></div>';
  case'naik_turun':return'<div class="fld">'+l+'<select class="f"'+a+'><option value="mengalami kenaikan">Naik</option><option value="mengalami penurunan">Turun</option><option value="tidak mengalami perubahan">Tetap</option></select></div>';
  default:return'<div class="fld">'+l+'<input class="f" autocomplete="off"'+a+ml+'>'+hint+'</div>'}}
function viewForm(d){
 const shown=[],done=new Set();
 for(const f of d.fields){if(f.linkedSource||done.has(f.name))continue;
  if((f.type==='selisih_pct'||f.type==='naik_turun')&&f.linkedTo&&d.fields.some(x=>x.name===f.linkedTo))continue;
  shown.push(f);done.add(f.name);
  for(const x of d.fields)if((x.type==='selisih_pct'||x.type==='naik_turun')&&x.linkedTo===f.name&&!x.linkedSource&&!done.has(x.name)){shown.push(x);done.add(x.name)}}
 if(!shown.length)return'<div class="empty">Template belum punya field. Buka Editor.</div>';
 return'<div class="grp">'+shown.map(f=>fieldRow(d,f)).join('')+'</div><button class="btn pri blk" data-a="gen">'+ic('download')+'Generate &amp; Unduh .docx</button><button class="btn blk" data-a="clear">Kosongkan</button>'}
function loadDraft(){const d=curDoc();V=d?LS.get(K.draft+d.id,{}):{};if(d)for(const f of d.fields)if(f.type==='tahun'&&!V[f.name])V[f.name]=String(new Date().getFullYear());
 if(d)for(const f of d.fields)if(f.type==='naik_turun'&&!V[f.name])V[f.name]='mengalami kenaikan'}
const saveDraft=()=>{const d=curDoc();if(d)LS.set(K.draft+d.id,V)};
function pkeyOf(d){return d.fields.filter(f=>f.periodId).map(f=>String(V[f.name]||'').trim()).join('__')}
function plabelOf(d){return d.fields.filter(f=>f.periodId).map(f=>display(d,f,V)||String(V[f.name]||'')).join(' ')}
function prevEntry(d){if(!d.logEnabled)return null;
 if(!d.fields.some(f=>f.periodId)){const l=getLog(d.id).entries.slice().sort((a,b)=>b._id-a._id);return l[0]||null}const cur=periodSortKey(d,Object.fromEntries(d.fields.filter(f=>f.periodId).map(f=>['_v_'+f.name,V[f.name]||''])));
 if(!d.fields.some(f=>f.periodId)||d.fields.filter(f=>f.periodId).some(f=>!String(V[f.name]||'').trim()))return null;
 const l=getLog(d.id).entries.filter(e=>periodSortKey(d,e)<cur).sort((a,b)=>periodSortKey(d,b).localeCompare(periodSortKey(d,a)));return l[0]||null}
function refreshForm(){const d=curDoc();if(!d||UI.tab!=='isi')return;
 const root=$('#view'),prev=prevEntry(d);
 // formula + selisih + naik/turun
 for(const f of d.fields)if(f.type==='formula'){const e=root.querySelector('[data-f="'+f.name+'"]');if(e)e.value=display(d,f,V)||''}
 for(const f of d.fields){if(f.type!=='rupiah'&&f.type!=='number'&&f.type!=='formula')continue;
  const selF=d.fields.find(x=>x.type==='selisih_pct'&&x.linkedTo===f.name),ntF=d.fields.find(x=>x.type==='naik_turun'&&x.linkedTo===f.name);
  if(!selF&&!ntF)continue;
  const cur=rawNum(d,f,V),pv=prev&&f.tracked?parseFloat(prev[f.name]):NaN;
  if(pv&&!isNaN(cur)&&cur>0){const s=(cur-pv)/pv;
   if(selF){V[selF.name]=fmtPct(Math.abs(s));const e=root.querySelector('[data-f="'+selF.name+'"]');if(e)e.value=V[selF.name]}
   if(ntF){V[ntF.name]=s>0?'mengalami kenaikan':s<0?'mengalami penurunan':'tidak mengalami perubahan';const e=root.querySelector('[data-f="'+ntF.name+'"]');if(e)e.value=V[ntF.name]}}
  else if(selF&&d.logEnabled){V[selF.name]='';const e=root.querySelector('[data-f="'+selF.name+'"]');if(e)e.value=''}}
 // nilai ke input + hint
 root.querySelectorAll('[data-f]').forEach(e=>{const n=e.dataset.f,f=d.fields.find(x=>x.name===n);if(!f)return;
  if(document.activeElement!==e&&!e.readOnly&&e.value!==(V[n]||''))e.value=V[n]||''
  const h=root.querySelector('[data-h="'+n+'"]'),parts=[];let cls='';
  const bad=e.dataset.num&&e.value.trim()!==''&&isNaN(parseNum(e.value));e.classList.toggle('bad',!!bad);
  if(f.maxlen&&['text','number','rupiah'].includes(f.type)){parts.push(e.value.length+'/'+f.maxlen);if(e.value.length>f.maxlen){cls='err'}}
  const hasTb=f.format_mode==='terbilang'||d.fields.some(x=>x.linkedSource===f.name&&x.format_mode==='terbilang');
  if(hasTb&&e.value.trim()&&!bad){parts.push(f.type==='tanggal'?terbilangTanggal(e.value):terbilangUang(parseNum(e.value)));cls=cls||'ok'}
  if(prev&&f.tracked&&(f.type==='rupiah'||f.type==='number')&&d.fields.some(x=>x.linkedTo===f.name)){parts.push('Periode lalu ('+(prev._label||prev._pkey)+'): '+fmtRp(prev[f.name]));cls=cls||'ok'}
  if(h){h.textContent=parts.join(' · ');h.className='hint'+(cls?' '+cls:'')}})}
function onFormInput(e){const t=e.target,n=t.dataset&&t.dataset.f;if(!n)return;V[n]=t.value;saveDraft();refreshForm()}
function validateBeforeGen(d){
 for(const f of d.fields){if(f.linkedSource||f.type==='formula')continue;const v=String(V[f.name]||'').trim();if(!v)continue;
  if((f.type==='rupiah'||f.type==='number'||f.type==='tahun')&&isNaN(parseNum(v)))return(f.label||f.name)+': harus berupa angka.';
  if(f.maxlen&&['text','number','rupiah'].includes(f.type)&&v.length>f.maxlen)return(f.label||f.name)+': maksimal '+f.maxlen+' karakter.'}
 const emp=d.fields.filter(f=>f.periodId&&!String(V[f.name]||'').trim());if(emp.length)return emp.map(f=>f.label||f.name).join(', ')+' wajib diisi.';
 if(d.logEnabled){const pk=pkeyOf(d);if(pk&&getLog(d.id).entries.find(x=>x._pkey===pk))return'Periode "'+plabelOf(d)+'" sudah ada di log. Edit atau hapus dulu.'}
 return''}
function fileNameFor(d,V,label){const pat=(d.fileName||'').trim();let n='';
 if(pat){const out=outputsFor(d,V),keys=Object.keys(out);
  n=pat.replace(/\{(\w+)\}/g,(m,k)=>{if(k.toLowerCase()==='judul')return d.title;const key=keys.find(x=>x.toLowerCase()===k.toLowerCase());return key?out[key]:''})}
 n=n.replace(/[\\/:*?"<>|\r\n]+/g,'-').replace(/\s+/g,' ').trim().replace(/^\.+/,'');
 if(!n)n=d.title.replace(/\s+/g,'_')+(label?'_'+label.replace(/\s+/g,'_'):'');
 return n+'.docx'}
async function loadTpl(d){try{return await IDB.get(d.id)}catch(e){return null}}
async function actGen(){const d=curDoc();if(!d||busy)return;
 const err=validateBeforeGen(d);if(err){toast(err,3600);return}
 const rec=await loadTpl(d);if(!rec){toast('Template belum ada. Buka Editor.');return}
 busy=true;const btn=document.querySelector('[data-a=gen]');if(btn)btn.disabled=true;
 try{const out=outputsFor(d,V),{blob,left}=await buildDocx(rec.bytes,out);
  const label=plabelOf(d);download(blob,fileNameFor(d,V,label));
  if(d.logEnabled){const hasP=d.fields.some(f=>f.periodId),ts=new Date().toLocaleString('id-ID',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}),pk=hasP?pkeyOf(d):String(Date.now());if(pk){
   const en={_id:Date.now(),_ts:ts,_pkey:pk,_label:hasP?label:ts};
   for(const f of d.fields){if(f.linkedSource)continue;
    if(f.tracked){const n=f.type==='formula'?evalFormula(d,f.formula,V):parseNum(V[f.name]);en[f.name]=isNaN(n)?0:n}
    else en['_v_'+f.name]=f.type==='formula'?display(d,f,V):String(V[f.name]||'')}
   const lg=getLog(d.id);lg.entries.push(en);setLog(d.id,lg)}}
  toast(left.length?'Selesai. Belum terisi: '+left.join(', '):'Selesai. Cek folder Unduhan / Files.',left.length?5200:2800)
 }catch(e){toast('Error: '+e.message,4200)}
 busy=false;if(btn)btn.disabled=false}

 const rows=lg.map(e=>'<div class="row" data-a="logOpen" data-id="'+e._id+'"><div class="grow"><div class="t">'+esc(e._label||e._pkey||'')+'</div><div class="d">'
  +esc(tf.map(f=>(f.label||f.name)+' '+(e[f.name]==null?'-':f.type==='rupiah'?fmtRp(e[f.name]):e[f.name])).join(' · ')||e._ts||'')+'</div></div>'+tri('r')+'</div>').join('');
 return sw+(lg.length?'<div class="glabel">'+lg.length+' entri</div><div class="grp">'+rows+'</div>':'<div class="empty">Belum ada riwayat.</div>')
  +'<div class="grp"><button class="row" data-a="csvExp">'+ic('file-down','s')+'<div class="grow t">Ekspor CSV</div></button><button class="row" data-a="csvImp">'+ic('file-up','s')+'<div class="grow t">Impor CSV</div></button></div>'}
function csvEsc(x){return'"'+String(x).replace(/"/g,'""')+'"'}
function exportCSV(){const d=curDoc();if(!d)return;const lg=getLog(d.id).entries;if(!lg.length){toast('Log kosong');return}
 const cf=d.fields.filter(f=>!f.linkedSource);
 const csv='﻿'+['Dibuat','Periode',...cf.map(f=>f.label||f.name)].map(csvEsc).join(',')+'\n'+lg.map(e=>[e._ts||'',e._label||e._pkey||'',...cf.map(f=>e[f.name]!==undefined?e[f.name]:(e['_v_'+f.name]??''))].map(csvEsc).join(',')).join('\n');
 download(new Blob([csv],{type:'text/csv;charset=utf-8;'}),'log_'+d.title.replace(/\W+/g,'_')+'.csv')}
function parseCSVRow(row){const c=[];let cur='',q=false;for(let i=0;i<row.length;i++){const ch=row[i];
 if(ch==='"'&&!q)q=true;else if(ch==='"'&&q&&row[i+1]==='"'){cur+='"';i++}else if(ch==='"'&&q)q=false;else if(ch===','&&!q){c.push(cur);cur=''}else cur+=ch}c.push(cur);return c}
function importCSV(text){const d=curDoc();if(!d)return;
 const lines=text.replace(/^﻿/,'').split(/\r?\n/).filter(l=>l.trim());if(lines.length<2){toast('CSV kosong');return}
 const H=parseCSVRow(lines[0]),lg=getLog(d.id),cf=d.fields.filter(f=>!f.linkedSource&&f.type!=='selisih_pct'&&f.type!=='formula'),pf=d.fields.filter(f=>f.periodId);let add=0,skip=0;
 for(let i=1;i<lines.length;i++){const c=parseCSVRow(lines[i]),row={};H.forEach((h,j)=>row[h]=(c[j]||'').trim());
  const en={_id:Date.now()+i,_ts:row['Dibuat']||new Date().toLocaleString('id-ID'),_pkey:'',_label:''};
  for(const f of pf){const v=row[f.label||f.name]||'';if(v){en['_v_'+f.name]=v;en._pkey+=(en._pkey?'__':'')+v;en._label+=(en._label?' ':'')+v}}
  if(!en._pkey||lg.entries.find(x=>x._pkey===en._pkey)){skip++;continue}
  for(const f of cf){const v=row[f.label||f.name];if(v!==undefined&&v!==''){if(f.tracked){const n=parseNum(v);en[f.name]=isNaN(n)?v:n}else en['_v_'+f.name]=v}}
  lg.entries.push(en);add++}
 setLog(d.id,lg);render();toast(add+' entri diimpor'+(skip?' ('+skip+' dilewati)':''))}

const SALT=crypto.getRandomValues(new Uint8Array(16)),KC=new Map();
async function keyFor(pass,saltU8){const k=pass+'|'+b64(saltU8);if(KC.has(k))return KC.get(k);

 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:saltU8,iterations:250000,hash:'SHA-256'},raw,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);KC.set(k,key);return key}

async function keyFor(pass,saltU8,iter){const k=pass+'|'+b64(saltU8)+'|'+iter;if(KC.has(k))return KC.get(k);
 const raw=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:saltU8,iterations:iter,hash:'SHA-256'},raw,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);KC.set(k,key);return key}

async function decEnvelope(text,pass){let j;try{j=JSON.parse(text)}catch(e){throw syErr('File sync rusak','corrupt')}
 const sl=j.salt||j.s,iv=j.iv||j.i,ct=j.ct||j.c;if(!sl||!iv||!ct)throw syErr('File sync rusak','corrupt');
 try{const key=await keyFor(pass,unb64(sl),j.iter||ITER),pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(iv)},key,unb64(ct));return JSON.parse(new TextDecoder().decode(pt))}

const GUIDE=[{"t": "Menyiapkan template Word", "h": "<p>Ketik penanda langsung di Word, formatnya <code>&lt;&lt;nama_field&gt;&gt;</code>. Nama hanya boleh huruf, angka, dan garis bawah. Bisa diketik dari Word di iPhone, tidak perlu fitur MergeField.</p><p>Format teks (tebal, miring, ukuran) mengikuti penandanya. Header dan footer ikut terbaca.</p><p>Satu isian bisa muncul beberapa kali dengan format berbeda lewat akhiran nama: <code>&lt;&lt;bulan_upper&gt;&gt;</code> menjadi MARET, <code>&lt;&lt;bulan_lower&gt;&gt;</code> menjadi maret, <code>&lt;&lt;bulan_title&gt;&gt;</code> menjadi Maret, dan <code>&lt;&lt;nominal_terbilang&gt;&gt;</code> menjadi teks terbilang. Isiannya cukup satu, yaitu field dasar.</p>"}, {"t": "Menambah dokumen", "h": "<p>Buka tab Dokumen, ketuk Tambah dokumen, lalu pilih file .docx. Aplikasi membaca semua penanda dan langsung membuka Editor.</p><img alt=\"\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCAKJASwDASIAAhEBAxEB/8QAHAABAAIDAQEBAAAAAAAAAAAAAAQHAgMFBgEI/8QARRAAAgEDAgMEBgkDAQYFBQAAAAECAwQRBRIGITETQVGRBxYiUmGTFDJCVGRxgdHhFaGxIxczNGJywSQ3c7PwU3SisvH/xAAaAQEBAQEBAQEAAAAAAAAAAAAAAQIDBAYF/8QALhEBAAEBBgUDBAIDAQAAAAAAAAERAgMEEhUhUWGRodExcfATQYHhBcEUsfE0/9oADAMBAAIRAxEAPwC5gAaAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA+NqKzJpLxbwfTwnpuePRxqGP/q0P/cRB7qMoyztkpY64eT6VZq3o70vSuFp63w1UvNN1W0tFdQrUrmbU3GKk002+T5nWn6QKtPhTh28oWH03WdaiqdC0hLZGVRcpyb7o5/yB70HjdD4t1P1mp8OcUaVRsL64outaVbev2lKslnMefRrD8vyIHrzr2q1NSuOFOHqN9pmn1JU5V69zsncSjzkqcV/br1X5AWCDxuqcbV7WlwtVpabOmtbuo0KlG7UoVLfLSfLx5v8APkTdT4lrWXHWi8OwtqU6OoUalSdZye6Dipckun2QPSgrWHpB4hu7fW62l8OW9xT0e6qwr1JXLgnThnournhNvuSx1yL30lapb6ZZ8Qx4dXq5XqRpuvO4Xb8+TkoLosqSWeuO7IqLKB5LiXi28tNctdA4d06lqGqV6P0ifbVuzpUKXdKT+Ph+XiRbLjm5npnEUdQ02FprWh0JVqtsqu+nVW1uMoyXPD/7oD24Kwr+krXrfQLLiOrwvBaLU2KvW+k4qZbw5R const INDEXLINK=location.protocol!=='file:'&&!/^\/(index\.html)?$/.test(location.pathname);
function viewSetup(){const sh=shared(),acc=UI.acc,custom=acc&&!ACCS.includes(acc);
 const sw='<div class="swrow"><button type="button" class="mchip'+(acc?'':' on')+'" data-a="accSet" data-v="" style="'+cv('#475569')+'" aria-pressed="'+(!acc)+'">Otomatis</button>'
  +ACCS.map(c=>'<button type="button" class="swb'+(acc===c?' on':'')+'" data-a="accSet" data-v="'+c+'" style="--c:'+c+'" aria-label="Warna aksen '+c+'" aria-pressed="'+(acc===c)+'"></button>').join('')
  +'<button type="button" class="swb more'+(custom?' on cus':'')+'" data-a="pickOpen" data-k="acc" style="'+(custom?'--c:'+esc(acc):'')+'" aria-label="Pilih warna aksen lain dari palet lengkap"></button></div>';
 const pk=(key,c,l)=>'<button type="button" class="pkc" data-a="pickOpen" data-k="'+key+'" style="--c:'+c+'" aria-label="Ubah warna '+esc(l)+'"><i></i>'+esc(l)+'</button>';
 const panduan='<section class="card slim"><button type="button" class="lnkrow" data-a="guide"><span>Panduan penggunaan</span><span class="ricons">'+ic('book-open')+tri('r')+'</span></button></section>';
 const tampil='<section class="card"><h3>Tampilan</h3>'+labH('Judul aplikasi')+'<input class="f" data-ed="apptitle" value="'+esc(UI.title)+'" placeholder="Document Generator" aria-label="Judul aplikasi">'
  +labH('Nama (opsional)')+'<input class="f" data-ed="who" value="'+esc(UI.who||'')+'" placeholder="mis. nama kamu" aria-label="Nama pemilik">'+labH('Tema')+chipSel('theme',UI.theme,[['auto','Otomatis'],['light','Terang'],['dark','Gelap']])+labH('Warna aksen')+sw+'</section>';
 const warna='<section class="card"><h3>Warna</h3>'+labH('Tab')+'<div class="pkr">'+TABS.map(t=>pk('tc:'+t[0],tcl(t[0]),t[1])).join('')+'</div><div style="margin-top:14px"><button type="button" class="btn" data-a="resetColors">Kembalikan warna bawaan</button></div></section>';
 const origin=location.protocol==='file:'?'(tidak ada: file lokal)':location.origin;
 const msg='<p class="hint" id="sy-msg" style="margin:8px 0 0">'+esc(SYMSG)+'</p><p class="hint" style="margin:4px 0 0">Versi '+APP_VERSION+'</p>';
 const sync=sh?'<section class="card"><h3>Sync Google Drive (terenkripsi)</h3><p class="hint" style="margin:0 0 10px">Memakai login dari halaman index.</p><div class="btns"><button type="button" class="btn pri" data-a="syncNow">Sync sekarang</button></div>'+msg+'</section>'
  :'<section class="card"><h3>Sync Google Drive (terenkripsi)</h3>'+labH('Client ID Google')+'<input class="f" id="sy_cid" value="'+esc(SY.cid)+'" placeholder="xxxx.apps.googleusercontent.com" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Client ID Google">'
   +labH('Kata sandi enkripsi')+'<input class="f" id="sy_pass" type="password" value="'+esc(SY.pass)+'" placeholder="Minimal 8 karakter" autocomplete="new-password" aria-label="Kata sandi enkripsi">'

function setPick(k,c){if(k==='acc')UI.acc=c;else{const id=k.slice(3);UI.tc=UI.tc||{};if(c)UI.tc[id]=c;else delete UI.tc[id]}saveUI();render()}
async function backupExport(){const o={v:1,docs:DOCS,logs:{},tpl:{}};
 for(const d of DOCS){o.logs[d.id]=getLog(d.id);try{const r=await IDB.get(d.id);if(r)o.tpl[d.id]={name:r.name,mod:r.mod,b64:b64(r.bytes)}}catch(e){}}
 download(new Blob([JSON.stringify(o)],{type:'application/json'}),'docgen-backup-'+new Date().toISOString().slice(0,10)+'.json')}
async function backupImport(text){try{const o=JSON.parse(text);if(!o.docs)throw new Error('Format salah');
 DOCS=o.docs;saveDocs();
 for(const d of DOCS){LS.set(K.log+d.id,(o.logs||{})[d.id]||{mod:0,entries:[]});const t=(o.tpl||{})[d.id];if(t)await IDB.put(d.id,{bytes:unb64(t.b64),name:t.name,mod:t.mod})}
 UI.cur=DOCS[0]?DOCS[0].id:'';saveUI();loadDraft();render();toast('Backup dipulihkan');schedSync()}catch(e){toast('Error: '+e.message,4000)}}
async function resetAll(){for(const d of DOCS){LS.del(K.log+d.id);LS.del(K.draft+d.id);try{await IDB.del(d.id)}catch(e){}}
 DOCS=[];saveDocs();UI.cur='';UI.tab='dok';saveUI();V={};schedSync();render()}

// ===== aksi =====
const A={
 tab:(a)=>setTab(a.dataset.t),
 setup:()=>{if(UI.tab==='guide')return setTab('setup');if(UI.tab==='setup')return setTab(UI.prev||'isi');UI.prev=UI.tab;setTab('setup')},
 guide:()=>setTab('guide'),
 theme:(a)=>{UI.theme=a.dataset.v;saveUI();applyTheme();render()},
 accSet:(a)=>{UI.acc=a.dataset.v;saveUI();render()},
 pickOpen:(a)=>openSheet('colorpick',{k:a.dataset.k}),
 pc:(a)=>{const k=MD.k;closeSheet();setPick(k,a.dataset.c)},
 pkDef:()=>{const k=MD.k;closeSheet();setPick(k,'')},
 resetColors:()=>{UI.tc={};saveUI();render()},
 ss:()=>syncNow(true),
 sheetClose:()=>closeSheet(),sheetSave:()=>sheetSave(),
 pick:()=>openSheet('pick'),
 pickDoc:(a)=>{UI.cur=a.dataset.id;saveUI();loadDraft();closeSheet();render()},
 openDoc:(a)=>{UI.cur=a.dataset.id;UI.tab='isi';saveUI();loadDraft();render()},
 docMenu:(a,e)=>{e.stopPropagation();openSheet('docMenu',{id:a.dataset.id})},
 addDoc:()=>{tplMode=null;$('#fileTpl').click()},
 tplReplace:()=>{tplMode={id:UI.cur};$('#fileTpl').click()},
 docRename:()=>{const x=DOCS.find(y=>y.id===MD.id);openSheet('rename',{id:x.id,val:x.title})},
 docDup:async()=>{const x=DOCS.find(y=>y.id===MD.id);const n=JSON.parse(JSON.stringify(x));n.id=uid();n.title+=' (salinan)';n.mod=Date.now();
  const r=await IDB.get(x.id);if(r)await IDB.put(n.id,{...r,bytes:r.bytes.slice()});DOCS.push(n);LS.set(K.log+n.id,{mod:Date.now(),entries:[]});saveDocs();schedSync();closeSheet();render();toast('Diduplikat')},
 docDelAsk:()=>{const x=DOCS.find(y=>y.id===MD.id);openSheet('confirm',{title:'Hapus "'+x.title+'"?',label:'Hapus dokumen dan log-nya',yes:async()=>{
  DOCS=DOCS.filter(y=>y.id!==x.id);saveDocs();LS.del(K.log+x.id);LS.del(K.draft+x.id);try{await IDB.del(x.id)}catch(e){}
  if(UI.cur===x.id)UI.cur=DOCS[0]?DOCS[0].id:'';saveUI();loadDraft();closeSheet();render();schedSync()}})},
 confirmYes:()=>{const y=MD.yes;if(y)y()},
 gen:()=>actGen(),clear:()=>actClear(),
 logToggle:(a)=>{const d=curDoc();d.logEnabled=a.checked;touch(d);render()},
 logOpen:(a)=>{const d=curDoc(),e=getLog(d.id).entries.find(x=>String(x._id)===a.dataset.id);if(e)openSheet('logEntry',{e:JSON.parse(JSON.stringify(e))})},
 logDel:()=>{const d=curDoc(),lg=getLog(d.id),id=MD.e._id;lg.entries=lg.entries.filter(x=>x._id!==id);setLog(d.id,lg);closeSheet();render()},
 logDl:async()=>{const d=curDoc(),e=getLog(d.id).entries.find(x=>x._id===MD.e._id);if(!e)return;const rec=await loadTpl(d);if(!rec){toast('Template belum ada');return}
  const V2={};for(const f of d.fields){if(f.linkedSource)continue;V2[f.name]=e[f.name]!==undefined?String(e[f.name]):e['_v_'+f.name]!==undefined?String(e['_v_'+f.name]):''}
  try{const{blob}=await buildDocx(rec.bytes,outputsFor(d,V2));download(blob,fileNameFor(d,V2,String(e._label||e._pkey||e._id)));toast('Diunduh')}catch(err){toast('Error: '+err.message)}},
 csvExp:()=>exportCSV(),csvImp:()=>$('#fileCsv').click(),
 fieldEdit:(a)=>{const d=curDoc(),i=+a.dataset.i;openSheet('field',{i,f:JSON.parse(JSON.stringify(d.fields[i]))})},
 fieldAdd:()=>openSheet('fieldAdd'),
 fUp:()=>{readField();const d=curDoc(),i=MD.i;if(i>0){d.fields[i]=MD.f;[d.fields[i-1],d.fields[i]]=[d.fields[i],d.fields[i-1]];MD.i=i-1;touch(d);reSheet();render()}},
 fDown:()=>{readField();const d=curDoc(),i=MD.i;if(i<d.fields.length-1){d.fields[i]=MD.f;[d.fields[i+1],d.fields[i]]=[d.fields[i],d.fields[i+1]];MD.i=i+1;touch(d);reSheet();render()}},
 fDel:()=>{const d=curDoc();d.fields.splice(MD.i,1);touch(d);closeSheet();render()},
 ins:(a)=>{const i=document.getElementById(a.dataset.t);if(!i)return;const v=a.dataset.v,txt=/^[+\-*\/]$/.test(v)?' '+v+' ':v;
  const s0=i.selectionStart==null?i.value.length:i.selectionStart,e0=i.selectionEnd==null?s0:i.selectionEnd;
  i.value=i.value.slice(0,s0)+txt+i.value.slice(e0);const p=s0+txt.length;try{i.setSelectionRange(p,p)}catch(x){}
  i.dispatchEvent(new Event('input',{bubbles:true}))},
 syncNow:()=>syncNow(true),
 syCon:()=>{const c=$('#sy_cid'),p=$('#sy_pass');if(c){SY.cid=c.value.trim();SY.pass=p.value}saveSY();if(!synced()){toast('Isi Client ID dan passphrase');return}syncNow(true)},
 syOff:()=>{SY.cid='';SY.pass='';SY.consented=false;saveSY();gisTok={t:'',exp:0};refreshSS();render()},
 bakExp:()=>backupExport(),bakImp:()=>$('#fileBak').click(),
 bakRestore:async()=>{const m=await restoreMissing(),n=$('#setnote');if(n)n.textContent=m;toast(m)},
 armDel:(a)=>{if(a.classList.contains('arm')){clearTimeout(a._t);const k=a.dataset.k;
   if(k==='all')resetAll();
   else{const d=curDoc();if(d){const lg=getLog(d.id);lg.entries=[];setLog(d.id,lg);const n=$('#setnote');if(n)n.textContent='Log '+d.title+' dihapus.';a.classList.remove('arm');a.textContent='Hapus log '+d.title}}}
  else{a.classList.add('arm');a._o=a.textContent;a.textContent='Ketuk lagi';a._t=setTimeout(()=>{a.classList.remove('arm');a.textContent=a._o},4000)}}
};
document.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(!a||a.tagName==='INPUT'&&a.type==='checkbox')return;const f=A[a.dataset.a];if(f)f(a,e)});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='fe_type'){readField();reSheet();return}
 if(t.type==='checkbox'&&t.dataset.a&&A[t.dataset.a])A[t.dataset.a](t,e);
 if(t.dataset&&t.dataset.ed==='title'){const d=curDoc();if(d&&t.value.trim()){d.title=t.value.trim();touch(d)}}
 if(t.dataset&&t.dataset.ed==='apptitle'){UI.title=t.value.trim();saveUI();applyTheme()}
 if(t.dataset&&t.dataset.ed==='who'){UI.who=t.value.trim();saveUI();applyTheme()}
 if(t.dataset&&t.dataset.ed==='fname'){const d=curDoc();if(d){d.fileName=t.value.trim();touch(d)}}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.f)onFormInput(e);
 if(t.dataset&&t.dataset.ed==='fname'){const d=curDoc();if(d){d.fileName=t.value.trim();touch(d)}}
 if(t.id==='fe_formula'){const d=curDoc(),h=document.getElementById('fe_fhint');if(d&&h){const m=formulaCheck(d,t.value);h.textContent=m;h.className='hint'+(m?' err':'')}}});
document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.f)onFormInput(e)});
$('#fileTpl').addEventListener('change',e=>handleTpl(e.target.files[0]));
$('#fileCsv').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>importCSV(r.result);r.readAsText(f,'utf-8');e.target.value=''});
$('#fileBak').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>backupImport(r.result);r.readAsText(f,'utf-8');e.target.value=''});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&MD)closeSheet()});
if(window.visualViewport){const kb=()=>document.body.classList.toggle('kb',innerHeight-visualViewport.height>120);visualViewport.addEventListener('resize',kb)}

// ===== init =====
applyTheme();if(!curDoc()&&DOCS.length)UI.cur=DOCS[0].id;if(!DOCS.length)UI.tab='dok';initIM();loadDraft();render();refreshSS();
if(eff().cid)loadGIS().catch(()=>{});
if(synced())setTimeout(()=>syncNow(false),1200);
</script>
</body>
</html>
