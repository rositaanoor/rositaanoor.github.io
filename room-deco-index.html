<style>
:root{--on:#fff;--bg:#f2f2f7;--card:#fff;--tx:#000;--tx2:#6c6c70;--sep:rgba(60,60,67,.18);--ac:#007aff;--seg:rgba(118,118,128,.12);--segon:#fff;--red:#ff3b30;--green:#248a3d;--orange:#c93400;--bar:rgba(249,249,249,.82)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#1c1c1e;--tx:#fff;--tx2:#98989f;--sep:rgba(84,84,88,.6);--seg:rgba(118,118,128,.24);--segon:#636366;--green:#30d158;--orange:#ff9f0a;--bar:rgba(30,30,30,.82)}}
:root[data-theme="dark"]{--bg:#000;--card:#1c1c1e;--tx:#fff;--tx2:#98989f;--sep:rgba(84,84,88,.6);--seg:rgba(118,118,128,.24);--segon:#636366;--green:#30d158;--orange:#ff9f0a;--bar:rgba(30,30,30,.82)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
body{padding-top:env(safe-area-inset-top);padding-bottom:calc(30px + env(safe-area-inset-bottom));min-height:100vh;-webkit-user-select:none;user-select:none}
body.hasbar{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
body.kb .tabbar{display:none}
body.kb.hasbar{padding-bottom:30px}
#top{display:flex;align-items:center;justify-content:space-between;height:44px;padding:0 16px}
#top button{border:0;background:transparent;color:var(--ac);font:inherit;font-size:20px;font-weight:600;padding:6px 4px;min-width:40px}
#top svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;display:block}
h1{font-size:34px;font-weight:800;letter-spacing:-.4px;margin:0;padding:6px 20px 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#st{display:block;border:0;background:transparent;color:var(--ac);font:inherit;font-size:14px;font-weight:600;padding:2px 20px 12px;text-align:left;min-height:22px}
#st.err{color:var(--red)}
#view{padding:8px 16px 0}
.sec{font-size:13px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.3px;padding:4px 16px 8px}
.card{background:var(--card);border-radius:14px;margin:0 0 16px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;min-height:52px;padding:9px 16px;border-top:.5px solid var(--sep)}
.row:first-child{border-top:0}
.row.tap{cursor:pointer}
.row .nm{flex:1;min-width:0;font-size:17px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{font-size:13px;color:var(--tx2);font-weight:500;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub.soon{color:var(--orange);font-weight:700}
.row .lb{font-size:16px;font-weight:600;flex:none}
.row .val{font-size:16px;font-weight:700;flex:none;text-align:right}
.row .val.mut{color:var(--tx2);font-weight:600}
.row .val.up{color:var(--red)}
.row .val.dn{color:var(--green)}
.ib{flex:none;width:34px;height:34px;border:0;border-radius:17px;background:var(--seg);color:var(--tx);font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0}

<script>
(function(){
'use strict';
var KS='brg.v1',KU='brg.ui',KY='brg.sync',KB='brg.bak';
var DB={docs:{}};
var UI={screen:'home',tab:'list',sid:null,st:'all',loc:'all',q:'',pil:'q',g:{}};
var SY={clientId:'',on:false,last:0,fileId:'',sh:false};
var TOK=null,TOKEXP=0,PASS='',TC=null,TCRES=null,TCREJ=null,syncing=false,STAT='',STERR=false;
var MD=null,PASSRES=null;
var CATS=['Dapur','Makanan','Alat tulis','Pakaian','Elektronik','Kebersihan','Obat & mandi','Dekorasi','Lainnya'];
var DEFLOCS=['Lemari','Laci meja','Rak','Kolong kasur','Kamar mandi','Ruang belakang'];
var UNITS=[['d','Hari'],['w','Minggu'],['m','Bulan'],['y','Tahun']];
var ST={baru:'Belum dipilah',simpan:'Simpan',jual:'Jual',donasi:'Donasi',buang:'Buang',ragu:'Ragu-ragu',selesai:'Dilepas'};
var STC={baru:'var(--tx2)',simpan:'var(--green)',jual:'var(--ac)',donasi:'#8B5CF6',buang:'var(--red)',ragu:'var(--orange)',selesai:'var(--tx2)'};
var DAY=86400000;
/* ---------- util ---------- */
function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function uid(){return Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3);}
function p2(n){return ('0'+n).slice(-2);}
function num(n){return String(Math.round(Math.abs(n))).replace(/\B(?=(\d{3})+(?!\d))/g,'.');}
function rp(n){n=Math.round(n);return (n<0?'−':'')+'Rp '+num(n);}
function dec(v){var s=(Math.round(v*100)/100).toFixed(2).replace(/\.00$/,''),a=s.split('.');return a[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.')+(a[1]?','+a[1]:'');}
function fmtAmt(v,c){return c==='IDR'?rp(v):c+' '+dec(v);}
function sum(a){var s=0;for(var i=0;i<a.length;i++)s+=a[i];return s;}
var MON=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
var MONF=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
function fdate(s){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?(+m[3])+' '+MON[+m[2]-1]+' '+m[1]:'';}
function pd(s){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?Date.UTC(+m[1],+m[2]-1,+m[3]):NaN;}
function fd(ms){var d=new Date(ms);return d.getUTCFullYear()+'-'+p2(d.getUTCMonth()+1)+'-'+p2(d.getUTCDate());}
function today(){var d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
var tt;function toast(m){var t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('show');},3200);}
function parseAmt(s){
 s=String(s).trim().replace(/[^\d.,]/g,'');
 if(!s)return 0;
 if(s.indexOf(',')>=0)return parseFloat(s.replace(/\./g,'').replace(',','.'))||0;
 var m=/^(\d+)\.(\d{1,2})$/.exec(s);
 if(m)return parseFloat(s);
 return parseFloat(s.replace(/\./g,''))||0;
}


/* ---------- storage ---------- */
function load(){
 try{var j=JSON.parse(localStorage.getItem(KS));if(j&&j.docs)DB=j;}catch(e){}
 try{touchIM();}catch(e){}
 try{var u=JSON.parse(localStorage.getItem(KU));if(u)for(var k in u)if(k in UI)UI[k]=u[k];}catch(e){}
 try{var y=JSON.parse(localStorage.getItem(KY));if(y)for(var k2 in y)if(k2 in SY)SY[k2]=y[k2];}catch(e){}
}
function save(){try{touchIM();localStorage.setItem(KS,JSON.stringify(DB));}catch(e){}}
function saveUI(){try{localStorage.setItem(KU,JSON.stringify({screen:UI.screen,tab:UI.tab,sid:UI.sid,st:UI.st,loc:UI.loc,pil:UI.pil}));}catch(e){}}
function saveSY(){try{localStorage.setItem(KY,JSON.stringify({clientId:SY.clientId,on:SY.on,last:SY.last,fileId:SY.fileId}));}catch(e){}}
function put(doc,id,val){var d=DB.docs[doc]||(DB.docs[doc]={mt:0,d:{}});d.d[id]=val;d.mt=Date.now();save();}
function get(doc,id){var d=DB.docs[doc];return d?d.d[id]:undefined;}
function cfg(k,def){var v=get('cfg',k);return v===undefined?def:v;}
/* ---------- model ---------- */
function items(){return Object.keys(DB.docs).filter(function(k){return k.slice(0,2)==='b_';}).map(function(k){return DB.docs[k].d.it;}).filter(function(x){return x&&!x.gone;});}
function getIt(id){var s=get('b_'+id,'it');return s&&!s.gone?s:null;}
function putIt(s){s.ts=Date.now();put('b_'+s.id,'it',s);}
function locs(){return cfg('locs',DEFLOCS);}
function daysTo(iso){return Math.round((pd(iso)-pd(today()))/DAY);}
function dueLabel(iso){var n=daysTo(iso);return n<0?'Lewat '+(-n)+' hari':n===0?'Hari ini':n===1?'Besok':n+' hari lagi';}
function addU(iso,n,u){
 var t=pd(iso);if(isNaN(t))return '';
 if(u==='d')return fd(t+n*DAY);
 if(u==='w')return fd(t+7*n*DAY);
 var d=new Date(t),mm=d.getUTCMonth()+(u==='m'?n:12*n),ty=d.getUTCFullYear()+Math.floor(mm/12),tm=((mm%12)+12)%12;
 var last=new Date(Date.UTC(ty,tm+1,0)).getUTCDate();
 return fd(Date.UTC(ty,tm,Math.min(d.getUTCDate(),last)));
}
function cycNext(s){return s.cyc&&s.cyc.last?addU(s.cyc.last,Number(s.cyc.every)||1,s.cyc.unit):'';}
function dueOf(s){var a=s.exp||'',b=cycNext(s);if(!a)return b;if(!b)return a;return pd(a)<=pd(b)?a:b;}
function dueText(s){var n=dueOf(s);if(!n)return '';return (s.exp&&n===s.exp?'Kedaluwarsa ':'Ganti ')+fdate(n);}
function cycLabel(c){return 'Tiap '+c.every+' '+({d:'hari',w:'minggu',m:'bulan',y:'tahun'})[c.unit];}
function suggest(a,s){
 if(s.exp&&daysTo(s.exp)<0)return 'buang';
 if(a.sen==='y'||a.use==='b')return 'simpan';
 if(a.use==='m')return a.rep==='y'?'ragu':'simpan';
 if(a.rep==='y')return s.p>0?'jual':'donasi';
 return 'ragu';
}
function active(){return items().filter(function(x){return x.st!=='selesai';});}
function qty(s){return Number(s.q)||0;}
function sellText(s){
 return 'Dijual: '+s.n+(s.q>1?' ('+s.q+(s.u?' '+s.u:'')+')':'')+'\nKondisi: bekas, masih layak pakai\nHarga: '+(s.p?rp(s.p):'bisa nego')+'\nLokasi: '+(s.loc||'-')+(s.note?'\n'+s.note:'')+'\nBisa COD. Silakan chat.';
}
/* ---------- icons ---------- */
var ICP={"layout-grid":"<rect width=\"7\" height=\"7\" x=\"3\" y=\"3\" rx=\"1\" /><rect width=\"7\" height=\"7\" x=\"14\" y=\"3\" rx=\"1\" /><rect width=\"7\" height=\"7\" x=\"14\" y=\"14\" rx=\"1\" /><rect width=\"7\" height=\"7\" x=\"3\" y=\"14\" rx=\"1\" />","package":"<path d=\"M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z\" /><path d=\"M12 22V12\" /><polyline points=\"3.29 7 12 12 20.71 7\" /><path d=\"m7.5 4.27 9 5.15\" />","clipboard-check":"<rect width=\"8\" height=\"4\" x=\"8\" y=\"2\" rx=\"1\" ry=\"1\" /><path d=\"M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2\" /><path d=\"m9 14 2 2 4-4\" />","clock":"<circle cx=\"12\" cy=\"12\" r=\"10\" /><path d=\"M12 6v6l4 2\" />","search":"<path d=\"m21 21-4.34-4.34\" /><circle cx=\"11\" cy=\"11\" r=\"8\" />","settings":"<path d=\"M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915\" /><circle cx=\"12\" cy=\"12\" r=\"3\" />","book-open":"<path d=\"M12 5v16\" /><path d=\"M20.001 19A2 2 0 0022 17V5a2 2 0 00-1.999-2L16 3.002A5 5 0 0012 5a5 5 0 00-4-2H4a2 2 0 00-2 2v12a2 2 0 001.999 2H8a5 5 0 014 2 5 5 0 014-2z\" />","house":"<path d=\"M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8\" /><path d=\"M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z\" />","x":"<path d=\"M18 6 6 18\" /><path d=\"m6 6 12 12\" />","plus":"<path d=\"M5 12h14\" /><path d=\"M12 5v14\" />","minus":"<path d=\"M5 12h14\" />"};
function ico(n,cls){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"'+(cls?' class="'+cls+'"':'')+'>'+ICP[n]+'</svg>';}
var IC={
 list:ico('package'),pil:ico('clipboard-check'),jad:ico('clock'),search:ico('search',''),gear:ico('settings'),book:ico('book-open','ic'),house:ico('house','ic'),other:ico('layout-grid','ic'),x:ico('x','ic'),plus:ico('plus','ic'),minus:ico('minus','ic'),
 tri:'<svg class="tri" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>',
 triL:'<svg class="tri" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>',
 triD:'<svg class="tri" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>'
};
function seg(k,opts,cur,act){
 return '<div class="seg">'+opts.map(function(o){return '<button data-act="'+act+'" data-k="'+k+'" data-v="'+o[0]+'" class="'+(String(cur)===String(o[0])?'on':'')+'">'+o[1]+'</button>';}).join('')+'</div>';
}

function pill(st){return '<span class="pill" style="--k:'+STC[st]+'">'+ST[st]+'</span>';}
function itRow(s,right){
 var due=s.st!=='selesai'&&dueOf(s),soon=due&&daysTo(due)<=cfg('remind',7);
 var sub=[s.cat,(s.q?s.q+(s.u?' '+s.u:''):''),s.loc].filter(Boolean).join(' · ');
 return '<div class="row tap" data-act="open" data-id="'+s.id+'"><div class="nm">'+esc(s.n)+'<div class="sub'+(soon?' soon':'')+'">'+esc(soon?dueText(s)+' · '+dueLabel(due):sub)+'</div></div>'+(right===undefined?pill(s.st):right)+IC.tri+'</div>';
}
function filtered(){
 var q=UI.q.trim().toLowerCase();
 return items().filter(function(s){
  if(UI.st==='all'?false:s.st!==UI.st)return false;
  if(UI.st==='all'&&s.st==='selesai')return false;
  if(UI.loc!=='all'&&s.loc!==UI.loc)return false;
  if(q&&(s.n+' '+(s.cat||'')+' '+(s.loc||'')+' '+(s.note||'')).toLowerCase().indexOf(q)<0)return false;
  return true;
 }).sort(function(a,b){return a.n.toLowerCase()<b.n.toLowerCase()?-1:1;});
}
function listRows(){
 var l=filtered();
 if(!l.length)return '<div class="card"><div class="row"><div class="nm" style="color:var(--tx2)">Tidak ada barang</div></div></div>';
 return '<div class="card">'+l.map(function(s){return itRow(s);}).join('')+'</div>';
}
function vList(){

function vPilah(){
 var h='<div class="card"><div class="row" style="padding:10px 16px">'+seg('pil',[['q','Antrean'],['r','Kotak ragu'],['d','Dilepas']],UI.pil,'cset')+'</div></div>';
 if(UI.pil==='q'){
  var q=items().filter(function(s){return s.st==='baru';});
  if(q.length)h+='<button class="btn" data-act="quiz">Mulai memilah ('+q.length+')</button><div class="card">'+q.map(function(s){return itRow(s,'');}).join('')+'</div>';
  else h+='<div class="card"><div class="row"><div class="nm" style="color:var(--tx2)">Semua barang sudah dipilah</div></div></div>';
 }else if(UI.pil==='r'){
  var r=items().filter(function(s){return s.st==='ragu';}).sort(function(a,b){return pd(a.rs||'')-pd(b.rs||'');}),rd=cfg('rd',30);
  if(!r.length)h+='<div class="card"><div class="row"><div class="nm" style="color:var(--tx2)">Kotak ragu-ragu kosong</div></div></div>';
  else h+='<div class="card">'+r.map(function(s){
   var n=-daysTo(s.rs||today()),due=n>=rd;
   return '<div class="row tap" data-act="open" data-id="'+s.id+'"><div class="nm">'+esc(s.n)+'<div class="sub'+(due?' soon':'')+'">'+(due?'Sudah '+n+' hari, lepas saja?':'Masuk kotak '+n+' hari lalu')+'</div></div>'+(due?'<span class="pill" style="--k:var(--orange)">Lepas</span>':'')+IC.tri+'</div>';
  }).join('')+'</div>';
 }else{
  var d=items().filter(function(s){return s.st==='selesai';}).sort(function(a,b){return pd(b.rel||'')-pd(a.rel||'');});
  if(!d.length)h+='<div class="card"><div class="row"><div class="nm" style="color:var(--tx2)">Belum ada yang dilepas</div></div></div>';
  else h+='<div class="card">'+d.map(function(s){return '<div class="row tap" data-act="open" data-id="'+s.id+'"><div class="nm">'+esc(s.n)+'<div class="sub">'+esc(ST[s.how||'buang']+' · '+fdate(s.rel))+'</div></div>'+IC.tri+'</div>';}).join('')+'</div>';
 }
 return h;
}
function vJadwal(){
 var l=active().filter(function(s){return dueOf(s);}).sort(function(a,b){return pd(dueOf(a))-pd(dueOf(b));}),h='';
 if(!l.length)return '<div class="card"><div class="row"><div class="nm" style="color:var(--tx2)">Belum ada jadwal. Isi kedaluwarsa atau ganti berkala di barang.</div></div></div>';
 var rem=cfg('remind',7),g={late:[],soon:[],later:[]};
 l.forEach(function(s){var n=daysTo(dueOf(s));(n<0?g.late:n<=rem?g.soon:g.later).push(s);});
 [['late','Terlambat'],['soon','Segera'],['later','Nanti']].forEach(function(p){
  if(!g[p[0]].length)return;
  h+='<div class="sec">'+p[1]+'</div><div class="card">'+g[p[0]].map(function(s){
   var d=dueOf(s),n=daysTo(d);
   return '<div class="row tap" data-act="open" data-id="'+s.id+'"><div class="nm">'+esc(s.n)+'<div class="sub'+(n<0?' late':n<=rem?' soon':'')+'">'+esc(dueText(s)+(s.cyc&&!(s.exp&&d===s.exp)?' · '+cycLabel(s.cyc):''))+'</div></div><span class="val'+(n<0?' up':'')+'">'+dueLabel(d)+'</span>'+IC.tri+'</div>';
  }).join('')+'</div>';
 });
 return h;
}
function drow(l,v){return '<div class="row"><span class="lb">'+l+'</span><span class="nm" style="text-align:right;white-space:normal">'+v+'</span></div>';}
function vDetail(id){
 var s=getIt(id),h='';
 var rows=drow('Status',pill(s.st))+drow('Jumlah',esc(s.q+(s.u?' '+s.u:'')))+drow('Kategori',esc(s.cat||'-'))+drow('Lokasi',esc(s.loc||'-'));
 if(s.exp)rows+=drow('Kedaluwarsa',esc(fdate(s.exp))+' · '+dueLabel(s.exp));
 if(s.cyc){rows+=drow('Ganti berkala',esc(cycLabel(s.cyc)));rows+=drow('Terakhir diganti',esc(fdate(s.cyc.last)));rows+=drow('Giliran berikut',esc(fdate(cycNext(s))+' · '+dueLabel(cycNext(s))));}
 if(s.p)rows+=drow('Harga perkiraan',rp(s.p));
 if(s.st==='ragu'&&s.rs)rows+=drow('Masuk kotak ragu',esc(fdate(s.rs)));
 if(s.st==='selesai')rows+=drow('Dilepas',esc((ST[s.how||'buang'])+' · '+fdate(s.rel)));
 if(s.note)rows+=drow('Catatan',esc(s.note));
 h+='<div class="card">'+rows+'</div>';
 h+='<button class="btn" data-act="edititem">Ubah</button>';
 if(s.st!=='selesai'){
  h+='<div class="card"><div class="row"><span class="lb">Nasib barang</span></div><div class="chips">'+['simpan','jual','donasi','buang','ragu'].map(function(k){return '<button class="chip'+(s.st===k?' on':'')+'" data-act="setst" data-v="'+k+'">'+ST[k]+'</button>';}).join('')+'</div></div>';
  if(s.st==='jual')h+='<button class="btn sec2" data-act="sell">Salin teks jual</button>';
  if(s.st==='jual'||s.st==='donasi'||s.st==='buang')h+='<button class="btn sec2" data-act="done">Tandai sudah dilepas</button>';
  if(s.cyc)h+='<button class="btn sec2" data-act="replaced">Sudah diganti hari ini</button>';
  if(s.exp)h+='<button class="btn sec2" data-act="expdone">Sudah habis atau dibuang</button>';
 }else h+='<button class="btn sec2" data-act="undo">Kembalikan ke daftar</button>';
 return h+'<button class="btn sec2 red" data-act="delq">Hapus barang</button>';
}

function vGuide(){
 return '<div class="card">'+GUIDE.map(function(g,i){
  var open=UI.g[i];
  return '<div style="border-top:'+(i?'.5px solid var(--sep)':'0')+'"><button class="gh" data-act="gtog" data-i="'+i+'">'+g[0]+(open?IC.triD:IC.tri)+'</button>'+
   (open?'<div class="gb"><ol>'+g[1].map(function(s){return '<li>'+s+'</li>';}).join('')+'</ol>'+(g[2]?'<img src="'+g[2]+'" alt="">':'')+'</div>':'')+'</div>';
 }).join('')+'</div>';
}
function render(){
 var s=UI.screen,title='',back='',gear='',st=false,hasbar=false,body='';
 if(s==='item'&&!getIt(UI.sid)){UI.screen=s='home';}
 if(s==='home'){title={list:'Barang',pil:'Pilah',jad:'Jadwal'}[UI.tab];gear=1;st=true;hasbar=true;body={list:vList,pil:vPilah,jad:vJadwal}[UI.tab]();}
 else if(s==='item'){title=getIt(UI.sid).n;back='Kembali';body=vDetail(UI.sid);}
 else if(s==='setup'){title='Setup';back='Kembali';body=vSetup();}
 else if(s==='guide'){title='Panduan';back='Setup';body=vGuide();}
 $('top').innerHTML=(back?'<button data-act="back">'+IC.triL+back+'</button>':'<span></span>')+(gear?'<button data-act="setup">'+IC.gear+'</button>':'<span></span>');
 $('ttl').textContent=title;
 var b=$('st');b.style.display=st?'block':'none';b.textContent=STAT||syncLabel();b.className=STERR?'err':'';
 $('view').innerHTML=body;
 var tb=$('tabs');tb.style.display=hasbar?'flex':'none';
 document.body.classList.toggle('hasbar',hasbar);
 if(hasbar)tb.innerHTML=[['list','Barang'],['pil','Pilah'],['jad','Jadwal']].map(function(t){return '<button data-act="tab" data-v="'+t[0]+'" class="'+(UI.tab===t[0]?'on':'')+'">'+IC[t[0]]+'<span>'+t[1]+'</span></button>';}).join('');
 saveUI();
}
function syncLabel(){
 if(!SY.clientId&&!SY.sh)return 'Sinkron belum diatur';
 if(!SY.on)return SY.sh?'Ketuk untuk sinkron':'Ketuk untuk menghubungkan';
 return 'Tersinkron '+(SY.last?new Date(SY.last).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}):'')+' · ketuk untuk sinkron';
}

function setStat(t,err){STAT=t||'';STERR=!!err;var b=$('st');b.textContent=STAT||syncLabel();b.className=STERR?'err':'';}

function fld(label,inner){return '<div class="row"><span class="lb">'+label+'</span>'+inner+'</div>';}
function openSheet(type,data,draft){MD={type:type,data:data||{},draft:draft||null};drawSheet();}
function closeSheet(){MD=null;$('sheet').innerHTML='';}
function drawSheet(){
 if(!MD){$('sheet').innerHTML='';return;}
 var t=MD.type,d=MD.data,dr=MD.draft,title='',body='',save=true,lk='Batal',rk='Simpan';
 if(t==='item'){
  title=d.id?'Ubah barang':'Barang baru';
  body='<div class="card">'+fld('Nama','<input type="text" id="f_n" value="'+esc(dr.n)+'" placeholder="Alat tulis">')+
   fld('Jumlah','<input type="text" id="f_q" inputmode="numeric" value="'+esc(dr.q)+'" style="max-width:70px;margin-left:auto">')+
   fld('Satuan','<input type="text" id="f_u" value="'+esc(dr.u)+'" placeholder="pcs" style="max-width:110px;margin-left:auto">')+'</div>';
  body+='<div class="card"><div class="row"><span class="lb">Kategori</span></div><div class="chips">'+CATS.map(function(c){return '<button class="chip'+(dr.cat===c?' on':'')+'" data-act="scat" data-v="'+esc(c)+'">'+esc(c)+'</button>';}).join('')+'</div></div>';
  body+='<div class="card">'+fld('Lokasi','<input type="text" id="f_l" value="'+esc(dr.loc)+'" placeholder="Laci meja">')+'<div class="chips">'+locs().map(function(l){return '<button class="chip'+(dr.loc===l?' on':'')+'" data-act="sloc" data-v="'+esc(l)+'">'+esc(l)+'</button>';}).join('')+'</div></div>';
  body+='<div class="card">'+fld('Kedaluwarsa','<input type="date" id="f_x" value="'+esc(dr.exp)+'">')+(dr.exp?'<div class="row"><button class="bt" data-act="xclr">Kosongkan tanggal</button></div>':'')+
   '<div class="row"><span class="lb">Ganti berkala</span><span class="nm"></span>'+seg('cyc',[['0','Tidak'],['1','Ya']],dr.cycOn?'1':'0','scyc')+'</div>'+
   (dr.cycOn?fld('Tiap','<input type="text" id="f_e" inputmode="numeric" value="'+esc(dr.every)+'" style="max-width:70px;margin-left:auto">')+'<div class="row" style="padding:10px 16px">'+seg('unit',UNITS,dr.unit,'sunit')+'</div>'+fld('Terakhir diganti','<input type="date" id="f_c" value="'+esc(dr.last)+'">'):'')+'</div>';
  body+='<div class="card">'+fld('Harga perkiraan','<input type="text" id="f_p" inputmode="numeric" value="'+(dr.p?num(dr.p):'')+'" placeholder="Rp">')+'<div class="row"><textarea id="f_note" placeholder="Catatan">'+esc(dr.note)+'</textarea></div></div>';
 }else if(t==='quiz'){
  var it=getIt(d.id);title='Pilah barang';lk='Tutup';rk='Terapkan';
  var all=dr.use&&dr.rep&&dr.sen;
  function qc(k,opts){return '<div class="chips">'+opts.map(function(o){return '<button class="chip'+(dr[k]===o[0]?' on':'')+'" data-act="qa" data-k="'+k+'" data-v="'+o[0]+'">'+o[1]+'</button>';}).join('')+'</div>';}
  body='<div class="card"><div class="row"><div class="nm" style="font-size:20px;font-weight:800">'+esc(it.n)+'<div class="sub">'+esc([it.q?it.q+(it.u?' '+it.u:''):'',it.loc].filter(Boolean).join(' · '))+'</div></div></div></div>';
  body+='<div class="sec">Terakhir dipakai</div><div class="card">'+qc('use',[['b','Bulan ini'],['m','1 sampai 6 bulan lalu'],['o','Lebih dari 6 bulan'],['l','Lupa']])+'</div>';
  body+='<div class="sec">Ada penggantinya</div><div class="card">'+qc('rep',[['y','Ya'],['n','Tidak']])+'</div>';
  body+='<div class="sec">Bernilai sentimental</div><div class="card">'+qc('sen',[['y','Ya'],['n','Tidak']])+'</div>';
  if(all){
   var sg=suggest(dr,it);
   body+='<div class="sec">Nasib barang</div><div class="card"><div class="chips">'+['simpan','jual','donasi','buang','ragu'].map(function(k){return '<button class="chip'+((dr.pick||sg)===k?' on':'')+'" data-act="qp" data-v="'+k+'">'+ST[k]+(k===sg?' (saran)':'')+'</button>';}).join('')+'</div></div>';
  }
  body+='<button class="btn sec2" data-act="qskip">Lewati</button>';
 }else if(t==='loc'){
  title=d.i===undefined?'Lokasi baru':'Ubah lokasi';
  body='<div class="card">'+fld('Nama','<input type="text" id="f_l" value="'+esc(dr.l)+'" placeholder="Lemari">')+'</div>';
  if(d.i!==undefined)body+='<button class="btn sec2 red" data-act="locdel">Hapus lokasi</button>';
 }else if(t==='act'){
  title=d.title||'';save=false;lk='Tutup';
  body=d.items.map(function(a){return '<button class="btn sec2'+(a.red?' red':'')+'" data-act="'+a.act+'"'+(a.i!==undefined?' data-i="'+a.i+'"':'')+'>'+a.l+'</button>';}).join('');
 }else if(t==='confirm'){
  title=d.title;save=false;lk='Tutup';
  body='<div class="card"><div class="row"><div class="nm" style="white-space:normal">'+esc(d.msg)+'</div></div></div><button class="btn sec2 red" data-act="'+d.act+'">'+d.label+'</button>';
 }else if(t==='pass'){
  title='Kata sandi';
  body='<div class="card">'+fld('Sandi','<input type="text" id="f_pw" value="" autocapitalize="off" autocorrect="off" spellcheck="false" style="-webkit-text-security:disc">')+'</div>';
 }else if(t==='pal'){
  title='Warna aksen';save=false;lk='Tutup';
  var cur=String(cfg('accent','')).toUpperCase();
  body='<div class="pkg">'+PALETTE.map(function(c){return '<button class="pks'+(c===cur?' on':'')+'" data-act="setacc" data-c="'+c+'" style="--c:'+c+'" aria-label="Warna '+c+'"></button>';}).join('')+'</div><div class="brow" style="margin:14px 0 4px"><button class="bt" data-act="setacc" data-c="">Bawaan</button></div>';
 }
 $('sheet').innerHTML='<div class="bk" data-act="sclose"></div><div class="sh"><div class="shh"><button class="lnk" data-act="sclose">'+lk+'</button><b>'+esc(title)+'</b>'+(save?'<button class="lnk b" data-act="ssave">'+rk+'</button>':'<span style="min-width:60px"></span>')+'</div><div class="shb">'+body+'</div></div>';
}

 switch(a){
  case 'back':
   if(UI.screen==='guide')UI.screen='setup';else UI.screen='home';
   if(UI.screen==='home')UI.sid=null;
   render();window.scrollTo(0,0);break;
  case 'setup':refreshShared();go('setup');break;
  case 'guide':go('guide');break;
  case 'gtog':UI.g[b.dataset.i]=!UI.g[b.dataset.i];render();break;
  case 'tab':UI.tab=b.dataset.v;render();window.scrollTo(0,0);break;
  case 'cset':UI[b.dataset.k]=b.dataset.v;render();break;
  case 'open':go('item',{sid:id});break;
  case 'newitem':openSheet('item',{},newDraft());break;
  case 'edititem':{var s=getIt(UI.sid);openSheet('item',{id:s.id},itemDraft(s));break;}
  case 'scat':MD.draft.cat=b.dataset.v;drawSheet();break;
  case 'sloc':MD.draft.loc=b.dataset.v;drawSheet();break;
  case 'xclr':MD.draft.exp='';drawSheet();break;
  case 'scyc':MD.draft.cycOn=b.dataset.v==='1';drawSheet();break;
  case 'sunit':MD.draft.unit=b.dataset.v;drawSheet();break;
  case 'quiz':{var q=nextBaru('');if(q)openQuiz(q.id);break;}
  case 'qa':MD.draft[b.dataset.k]=b.dataset.v;MD.draft.pick='';drawSheet();break;
  case 'qp':MD.draft.pick=b.dataset.v;drawSheet();break;
  case 'qskip':{var nx=nextBaru(MD.data.id);if(nx)openQuiz(nx.id);else closeSheet();break;}
  case 'setst':{var s1=getIt(UI.sid);s1.st=b.dataset.v;if(s1.st==='ragu')s1.rs=today();putIt(s1);render();break;}
  case 'done':{var s2=getIt(UI.sid);s2.how=s2.st;s2.st='selesai';s2.rel=today();putIt(s2);render();toast('Barang dilepas');break;}
  case 'undo':{var s3=getIt(UI.sid);s3.st='simpan';putIt(s3);render();break;}
  case 'sell':copyText(sellText(getIt(UI.sid)));break;
  case 'replaced':{var s4=getIt(UI.sid);s4.cyc.last=today();putIt(s4);render();toast('Siklus dimulai lagi');break;}
  case 'expdone':{var s5=getIt(UI.sid);s5.how='buang';s5.st='selesai';s5.rel=today();putIt(s5);render();break;}
  case 'delq':openSheet('confirm',{title:'Hapus barang',msg:'Barang ini akan dihapus dari daftar.',act:'delok',label:'Hapus'});break;
  case 'delok':DB.docs['b_'+UI.sid]={mt:Date.now(),d:{it:{gone:1}}};save();UI.screen='home';UI.sid=null;closeSheet();render();break;
  case 'newloc':openSheet('loc',{},{l:''});break;
  case 'editloc':openSheet('loc',{i:Number(b.dataset.i)},{l:locs()[Number(b.dataset.i)]});break;
  case 'locdel':{var li=MD.data.i,ln=locs()[li];put('cfg','locs',locs().filter(function(x,k){return k!==li;}));items().forEach(function(s){if(s.loc===ln){s.loc='';putIt(s);}});closeSheet();render();break;}
  case 'cremind':put('cfg','remind',Number(b.dataset.v));render();break;
  case 'crd':put('cfg','rd',Number(b.dataset.v));render();break;
  case 'ssave':ssave();break;
  case 'sclose':if(MD&&MD.type==='pass'&&PASSRES){var r=PASSRES;PASSRES=null;r('');}closeSheet();break;
  case 'pal':openSheet('pal',{});break;
  case 'setacc':put('cfg','accent',b.dataset.c);applyCfg();if(MD)closeSheet();render();break;
  case 'settheme':put('cfg','theme',b.dataset.v);applyCfg();render();break;
  case 'icsall':exportIcs(items(),'barang-jadwal.ics');break;
  case 'syncnow':syncNow(true);break;
  case 'disc':disconnect();break;
  case 'backup':download(new Blob([JSON.stringify({v:1,docs:DB.docs})],{type:'application/json'}),'barang-cadangan.json');break;
  case 'restore':{
   var i=document.createElement('input');i.type='file';i.accept='application/json,.json';i.style.display='none';document.body.appendChild(i);
   i.addEventListener('change',function(){
    var f=i.files[0];i.remove();if(!f)return;
    f.text().then(function(t){var j=JSON.parse(t);if(!j.docs)throw 0;bak();DB.docs=j.docs;save();applyCfg();UI.screen='home';UI.sid=null;render();toast('Data dipulihkan');}).catch(function(){toast('File tidak valid');});
   });
   i.click();break;}
  case 'restoremiss':{var rn=restoreMissing();toast(rn<0?'Belum ada cadangan':rn?rn+' data dipulihkan':'Tidak ada yang hilang');render();break;}
  case 'reset':openSheet('confirm',{title:'Hapus semua data',msg:'Semua barang di perangkat ini akan dihapus. Data di Drive tidak ikut terhapus.',act:'resetok',label:'Hapus semua'});break;
  case 'resetok':bak();DB.docs={};save();UI.screen='home';UI.sid=null;applyCfg();closeSheet();render();break;
 }
});
$('st').addEventListener('click',function(){refreshShared();if(!effCid()){go('setup');toast('Isi Client ID dulu');}else syncNow(true);});
document.addEventListener('input',function(e){
 var t=e.target;
 if(t.id==='q'){UI.q=t.value;var l=$('lst');if(l)l.innerHTML=listRows();}
 if(t.id==='f_p'){var n=parseInt(t.value.replace(/\D/g,''),10)||0;t.value=n?num(n):'';}
});
document.addEventListener('change',function(e){
 if(e.target.id==='cid'){SY.clientId=e.target.value.trim();TC=null;SY.on=false;SY.fileId='';saveSY();}
});
document.addEventListener('focusin',function(e){if(e.target.closest&&e.target.closest('.sh')){setTimeout(function(){try{e.target.scrollIntoView({block:'center'});}catch(x){}},300);}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&MD){if(MD.type==='pass'&&PASSRES){var r=PASSRES;PASSRES=null;r('');}closeSheet();}});
if(window.visualViewport){visualViewport.addEventListener('resize',function(){document.body.classList.toggle('kb',window.innerHeight-visualViewport.height>150);});}
load();refreshShared();applyCfg();render();
(function(){
 var s=document.createElement('script');s.src='../auth.js';s.async=true;
 s.onload=s.onerror=function(){setTimeout(autoSync,500);};
 document.head.appendChild(s);
 setTimeout(autoSync,4000);
})();

})();
</script>
</body>
