<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pemulihan">
<meta name="theme-color" content="#F2F2F7">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<title>Pemulihan</title>
<style>
:root{--bg:#F2F2F7;--surface:#FFFFFF;--ink:#000;--muted:#8A8A8E;--line:rgba(60,60,67,.16);--soft:#E9E9EE;--field:#F2F2F7;--acc:#0ea5e9;--on:#FFFFFF;--coral:#EF5B5B;--green:#22B573;--amber:#F5A524;
 --display:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',system-ui,sans-serif;--body:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#000;--surface:#1C1C1E;--ink:#FFF;--muted:#8E8E93;--line:rgba(84,84,88,.5);--soft:#2C2C2E;--field:#2C2C2E;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--body);-webkit-font-smoothing:antialiased}
button,a{font-family:inherit;touch-action:manipulation}
.wrap{max-width:720px;margin:0 auto;padding:calc(34px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom))}
.vh h2{font:800 32px/1.1 var(--display);letter-spacing:.2px;margin:6px 0 16px}
.setgrid{display:grid;gap:16px}
.card{background:var(--surface);border-radius:14px;padding:16px;min-width:0}
.card h3{font:600 17px/1.2 var(--display);margin:0 0 8px}
.hint{color:var(--muted);font-size:13px;margin:8px 0 0;min-height:1.2em}
.btn{border:0;background:var(--soft);border-radius:10px;padding:9px 14px;font-weight:600;font-size:15px;color:var(--acc);cursor:pointer;text-decoration:none;display:inline-block}
.btn.pri{background:var(--acc);color:var(--on)}
.btn.arm{background:var(--coral);color:#fff}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.item{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:inherit;text-align:left;padding:12px 0;font-size:16px;cursor:pointer;border-top:.5px solid var(--line)}
.item:first-of-type{border-top:0}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t span{display:block;color:var(--muted);font-size:13px}
.item svg{flex:none;color:var(--muted)}
.item.on svg.ck{color:var(--acc)}
.item.on .t b{color:var(--acc)}
.num{font-weight:800;font-size:22px}
.back{display:flex;justify-content:space-between;align-items:center;color:inherit;text-decoration:none;padding:6px 16px}
.back span{padding:12px 0;font-weight:600;color:var(--acc)}
</style>
</head>
<body>
<main class="wrap">
<div class="vh"><h2>Pemulihan</h2></div>
<div class="setgrid" id="app"></div>
<div class="setgrid" style="margin-top:16px"><a class="card back" href="../"><span>Kembali ke index</span><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:var(--acc)"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></a></div>
</main>
<script src="../auth.js"></script>
<script>
(function(){
var API='https://www.googleapis.com/drive/v3/',$app=document.getElementById('app');
var CHEV='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>';
var CHECK='<svg class="ck" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
var st={files:null,file:null,revs:null,rev:null,res:null,msg:'',busy:false,head:null};
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function fmt(t){try{return new Date(t).toLocaleString('id-ID',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});}catch(e){return t;}}
function kb(n){n=+n||0;return n<1024?n+' B':(n/1024).toFixed(1)+' KB';}
function b64(buf){var a=new Uint8Array(buf),t='';for(var i=0;i<a.length;i+=0x8000)t+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000));return btoa(t);}
function unb64(t){var x=atob(t),a=new Uint8Array(x.length);for(var i=0;i<x.length;i++)a[i]=x.charCodeAt(i);return a;}
async function derive(pass,salt,iter){
  var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function dec(text,pass){
  var j;try{j=JSON.parse(text);}catch(e){throw {code:'bad_file'};}
  if(!j||!j.app||!j.ct||!j.salt||!j.iv)throw {code:'bad_file'};
  var salt=unb64(j.salt),iter=+j.iter||250000,key=await derive(pass,salt,iter);
  try{var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(j.iv)},key,unb64(j.ct));return {obj:JSON.parse(new TextDecoder().decode(pt)),ctx:{key:key,salt:salt,iter:iter,app:j.app}};}
  catch(e){throw {code:'bad_pass'};}
}
async function enc(obj,ctx){
  var iv=crypto.getRandomValues(new Uint8Array(12)),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},ctx.key,new TextEncoder().encode(JSON.stringify(obj)));
  return JSON.stringify({app:ctx.app,v:1,kdf:'PBKDF2-SHA256',iter:ctx.iter,salt:b64(ctx.salt),iv:b64(iv),ct:b64(ct)});
}
function authz(){var o=window.SharedAuth&&SharedAuth.read();return o;}
async function call(url,opt){
  var tk=await SharedAuth.token(true);opt=opt||{};opt.headers=Object.assign({Authorization:'Bearer '+tk.t},opt.headers||{});
  var r=await fetch(url,opt);
  if(r.status===401){SharedAuth.drop();throw {code:'auth'};}
  if(!r.ok)throw {code:'http',status:r.status};
  return r;
}
function err(e){
  if(!e)return 'Gagal.';
  if(e.code==='bad_pass')return 'Kata sandi di index tidak cocok dengan file ini.';
  if(e.code==='bad_file')return 'Isi file tidak dikenali.';
  if(e.code==='auth')return 'Tidak bisa masuk ke Google. Coba lagi.';
  if(e.code==='http')return e.status===403?'Google menolak (403). Riwayat versi tidak tersedia untuk file ini.':'Drive error '+e.status+'.';
  return 'Tidak ada koneksi atau gagal.';
}
var has=function(o,k){return !!o&&Object.prototype.hasOwnProperty.call(o,k);};
function diff(chosen,head){
  var out={total:0,docs:0,missing:0,per:{},list:[]};
  var cd=chosen.docs||{},hd=head.docs||{},him=head.im||{};
  Object.keys(cd).forEach(function(d){
    var o=cd[d];if(!o||typeof o!=='object')return;out.docs++;
    Object.keys(o).forEach(function(k){
      out.total++;
      var tomb=him[d]&&+him[d][k]<0;
      if(!has(hd[d],k)&&!tomb){out.missing++;out.per[d]=(out.per[d]||0)+1;out.list.push([d,k]);}
    });
  });
  return out;
}
function render(){
  var a=authz(),h='';
  if(!a){
    $app.innerHTML='<section class="card"><h3>Belum masuk</h3><div class="row"><a class="btn pri" href="../">Masuk di index</a></div></section>';return;
  }
  h+='<section class="card"><h3>File di Drive</h3>';
  if(!st.files)h+='<div class="row"><button class="btn pri" data-a="files"'+(st.busy?' disabled':'')+'>Muat daftar file</button></div>';
  else if(!st.files.length)h+='<p class="hint">Tidak ada file di Drive.</p>';
  else h+=st.files.map(function(f){return '<button class="item'+(st.file&&st.file.id===f.id?' on':'')+'" data-a="file" data-id="'+esc(f.id)+'"><div class="t"><b>'+esc(f.name)+'</b><span>'+esc(fmt(f.modifiedTime))+' · '+kb(f.size)+'</span></div>'+CHEV+'</button>';}).join('');
  h+='</section>';
  if(st.file){
    h+='<section class="card"><h3>Riwayat versi</h3>';
    if(!st.revs)h+='<p class="hint">Memuat…</p>';
    else if(!st.revs.length)h+='<p class="hint">Tidak ada riwayat.</p>';
    else h+=st.revs.slice().reverse().map(function(r,i){return '<button class="item'+(st.rev&&st.rev.id===r.id?' on':'')+'" data-a="rev" data-id="'+esc(r.id)+'"><div class="t"><b>'+esc(fmt(r.modifiedTime))+(i===0?' · terbaru':'')+'</b><span>'+kb(r.size)+'</span></div>'+(st.rev&&st.rev.id===r.id?CHECK:CHEV)+'</button>';}).join('');
    h+='</section>';
  }
  if(st.res){
    var r=st.res;
    h+='<section class="card"><h3>Versi '+esc(fmt(st.rev.modifiedTime))+'</h3>';
    h+='<div class="row" style="gap:18px;margin-bottom:6px"><div><div class="num">'+r.total+'</div><div class="hint" style="margin:0">catatan</div></div><div><div class="num" style="color:'+(r.missing?'var(--coral)':'var(--green)')+'">'+r.missing+'</div><div class="hint" style="margin:0">tidak ada di versi sekarang</div></div></div>';
    var ks=Object.keys(r.per);
    if(ks.length)h+='<div class="hint" style="margin:6px 0 12px">'+ks.slice(0,8).map(function(k){return esc(k)+': '+r.per[k];}).join(' · ')+'</div>';
    h+='<div class="row">'+(r.missing?'<button class="btn pri" data-a="restore">Pulihkan yang hilang ke Drive</button>':'')+'<button class="btn" data-a="dl">Unduh versi ini</button></div></section>';
  }
  h+='<p class="hint" id="msg" style="padding:0 6px">'+esc(st.msg)+'</p>';
  $app.innerHTML=h;
}
function say(t){st.msg=t;var m=document.getElementById('msg');if(m)m.textContent=t;}
async function loadFiles(){
  st.busy=true;say('Memuat…');
  try{
    var r=await call(API+'files?spaces=appDataFolder&pageSize=100&fields=files(id,name,modifiedTime,size)&q='+encodeURIComponent("trashed=false")),j=await r.json();
    st.files=(j.files||[]).sort(function(x,y){return String(x.name).localeCompare(String(y.name));});st.msg='';
  }catch(e){st.msg=err(e);}
  st.busy=false;render();
}
async function loadRevs(f){
  st.file=f;st.revs=null;st.rev=null;st.res=null;st.msg='';render();
  try{var r=await call(API+'files/'+f.id+'/revisions?pageSize=200&fields=revisions(id,modifiedTime,size)'),j=await r.json();st.revs=j.revisions||[];}
  catch(e){st.revs=[];st.msg=err(e);}
  render();
}
async function getHead(){
  var r=await call(API+'files/'+st.file.id+'?alt=media'),t=await r.text();return dec(t,authz().pass);
}
async function checkRev(rev){
  st.rev=rev;st.res=null;st.head=null;say('Membuka versi…');render();
  try{
    var pass=authz().pass;
    var rr=await call(API+'files/'+st.file.id+'/revisions/'+rev.id+'?alt=media'),chosen=await dec(await rr.text(),pass);
    var head=await getHead();
    st.chosen=chosen.obj;st.head=head;st.res=diff(chosen.obj,head.obj);st.msg='';
  }catch(e){st.msg=err(e);}
  render();
}
async function restore(){
  say('Memulihkan…');
  try{
    var head=await getHead(),o=head.obj,now=Date.now(),d=diff(st.chosen,o);
    o.docs=o.docs||{};o.mt=o.mt||{};o.im=o.im||{};
    d.list.forEach(function(p){var doc=p[0],k=p[1];(o.docs[doc]||(o.docs[doc]={}))[k]=st.chosen.docs[doc][k];(o.im[doc]||(o.im[doc]={}))[k]=now;o.mt[doc]=now;});
    o.v=2;
    await call('https://www.googleapis.com/upload/drive/v3/files/'+st.file.id+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body:await enc(o,head.ctx)});
    st.res=diff(st.chosen,o);st.msg=d.missing+' catatan dipulihkan ke Drive. Buka app lalu ketuk status sync.';
  }catch(e){st.msg=err(e);}
  render();
}
function download(){
  var b=new Blob([JSON.stringify(st.chosen,null,1)],{type:'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download=st.file.name.replace(/(\.enc)?\.json$/,'')+'-'+new Date(st.rev.modifiedTime).toISOString().slice(0,16).replace(/[:T]/g,'-')+'.json';
  document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);
}
$app.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');if(!b||st.busy&&b.dataset.a==='files')return;
  var a=b.dataset.a;
  if(a==='files')loadFiles();
  else if(a==='file'){var f=(st.files||[]).filter(function(x){return x.id===b.dataset.id;})[0];if(f)loadRevs(f);}
  else if(a==='rev'){var r=(st.revs||[]).filter(function(x){return x.id===b.dataset.id;})[0];if(r)checkRev(r);}
  else if(a==='dl')download();
  else if(a==='restore'){
    if(!b.classList.contains('arm')){var o=b.textContent;b.classList.add('arm');b.textContent='Ketuk lagi';setTimeout(function(){if(b.isConnected){b.classList.remove('arm');b.textContent=o;}},3500);return;}
    restore();
  }
});
render();
})();
</script>
</body>
</html>
