<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tes</title></head>
<body style="font:16px -apple-system,Arial;padding:16px"><h2>Tes Berkas</h2><p id="a">HTML tampil. Menunggu JavaScript...</p><pre id="b" style="white-space:pre-wrap"></pre>
<script>
document.getElementById('a').textContent='HTML dan JavaScript jalan.';
var o=[];function t(n,f){try{o.push(n+': '+(f()?'ya':'TIDAK'))}catch(e){o.push(n+': error '+e.message)}}
t('alamat '+location.href.slice(0,60),function(){return 1});
t('Blob',function(){return typeof Blob==='function'});
t('URL.createObjectURL',function(){return !!URL.createObjectURL});
t('Worker',function(){return typeof Worker==='function'});
t('canvas',function(){return !!document.createElement('canvas').getContext('2d')});
t('CompressionStream/TextDecoder',function(){return typeof TextDecoder==='function'});
t('async/await',function(){new Function('return async function(){await 1}');return 1});
t('optional chaining',function(){new Function('return a?.b');return 1});
t('regex lookbehind',function(){new RegExp('(?<=a)b');return 1});
t('localStorage',function(){localStorage.setItem('x','1');return 1});
o.push('UA: '+navigator.userAgent);
document.getElementById('b').textContent=o.join('\n');
</script></body></html>
